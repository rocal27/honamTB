<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn.selected { background-color: #dbeafe; border-color: #3b82f6; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
    </style>
</head>
<body class="text-gray-800">
    <div class="max-w-3xl mx-auto p-4 md:p-8 mt-10 bg-white rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">2026 국가결핵관리지침 퀴즈</h1>
        <p class="text-center text-gray-500 mb-6">매번 새로운 10문제가 무작위로 출제됩니다.</p>
        
        <div id="start-screen" class="text-center py-10">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-md transition-transform transform hover:scale-105">
                퀴즈 시작하기
            </button>
            <div class="mt-6 text-sm text-blue-600 font-medium">호남권질병대응센터 감염병대응과</div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-4 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-500" id="question-counter">문제 1 / 10</span>
                <div class="w-2/3 bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full" id="progress-bar" style="width: 10%"></div>
                </div>
            </div>
            
            <div id="question-container" class="mb-6">
                <h2 class="text-xl font-bold mb-4" id="question-text">문제 내용</h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-container" class="hidden p-4 mb-6 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="font-bold text-yellow-800 mb-1">해설:</p>
                <p id="explanation-text" class="text-gray-700 text-sm"></p>
            </div>

            <div class="flex justify-end mt-4">
                <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">다음 문제</button>
                <button id="submit-btn" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg">정답 확인</button>
            </div>
        </div>

        <div id="result-screen" class="hidden text-center py-10">
            <h2 class="text-3xl font-bold mb-4">퀴즈 완료!</h2>
            <p class="text-xl mb-6">당신의 점수는 <span id="score-text" class="font-bold text-blue-600 text-2xl"></span>점 입니다.</p>
            <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-md">
                새로운 문제로 다시 풀기
            </button>
            <button id="reset-history-btn" class="mt-4 block mx-auto text-sm text-gray-400 hover:text-red-500 underline">
                출제 기록 초기화 (500문제 다시 풀기)
            </button>
        </div>
    </div>

    <script>
        // 500제 문제 은행 데이터 바인딩
        const questionBank = [
            { id: 1, q: "가족접촉자 조사의 주된 목적으로 가장 옳은 것은?", options: ["추가 결핵환자 발견 및 잠복결핵감염 치료를 통한 확산 방지", "직장 동료 전수조사 및 격리", "결핵환자의 식단 관리 및 영양 공급", "보건소 의료진 역량 평가"], a: 0, exp: "가족접촉자 조사는 추가 결핵환자 및 잠복결핵감염자를 조기 발견·치료하여 결핵 확산을 방지하기 위함입니다." },
            { id: 2, q: "호흡기 결핵 환자의 가족접촉자 조사 대상 기간 기준은?", options: ["진단일 기준 1개월 이전부터 치료 시작 후 1주까지", "진단일 기준 3개월 이전부터 치료 시작 후 2주까지", "진단일 기준 6개월 이전부터 치료 종료 시까지", "진단일 기준 1년 이전부터 치료 시작 전까지"], a: 1, exp: "호흡기 결핵 환자의 진단일을 기준으로 3개월 이전부터 치료 시작 후 2주까지 같은 공간에서 생활하거나 주기적으로 접촉한 가족 및 동거인이 대상입니다." },
            { id: 3, q: "만 8세 이하 소아 폐외결핵 환자의 경우 가족접촉자 조사를 시행하는 주된 이유는?", options: ["성장 발달 상태를 확인하기 위해", "학교 내 전파를 차단하기 위해", "가족 중 감염원을 파악하기 위해", "BCG 예방접종력을 확인하기 위해"], a: 2, exp: "만 8세 이하 소아 폐외결핵 환자는 초회 감염일 가능성이 높아 가족 중 감염원을 파악하기 위해 접촉자 조사를 시행합니다." },
            { id: 4, q: "가족접촉자 검진수첩은 환자 신고일 기준으로 얼마 이내에 검사를 받도록 안내해야 하는가?", options: ["1주일 이내", "2주일 이내", "1개월 이내", "3개월 이내"], a: 2, exp: "결핵환자는 가족접촉자에게 검진수첩을 전달하고 신고일 기준으로 1개월 내에 보건소나 검진의료기관을 방문하여 검사를 받도록 안내해야 합니다." },
            { id: 5, q: "가족접촉자 전원을 대상으로 활동성 결핵을 배제하기 위해 기본적으로 실시하는 검사는?", options: ["흉부X선 검사", "가래 도말검사", "가래 배양검사", "결핵균 핵산증폭검사"], a: 0, exp: "전체 가족접촉자를 대상으로 활동성 결핵을 배제하기 위해 초회 및 추적 흉부X선 검사를 실시합니다." },
            { id: 6, q: "가족접촉자 중 다제내성결핵 환자의 접촉자인 경우, 가래검사 시 추가로 권장되는 검사는?", options: ["통상감수성검사", "Xpert MTB/RIF 또는 BD max", "항산균 도말검사만", "인터페론감마 분비검사"], a: 1, exp: "다제내성결핵 환자 접촉자인 경우 가래검사 시 Xpert MTB/RIF(Xpert) 또는 BD max 검사를 시행합니다." },
            { id: 7, q: "가족접촉자의 초회 잠복결핵감염검사가 음성인 경우, 2차 연속검사는 언제 시행하는가?", options: ["마지막 접촉일 기준 2~4주 후", "마지막 접촉일 기준 4~6주 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 이후", "마지막 접촉일 기준 12주 후"], a: 2, exp: "초회 잠복결핵감염검사 음성인 경우, 마지막 접촉일 또는 전염성 소실일 기준 8~10주 이후에 2차 검사를 시행합니다." },
            { id: 8, q: "집단시설 결핵역학조사의 구성 요소로 옳은 것은?", options: ["지표환자 조사와 접촉자 조사", "환경 소독과 시설 폐쇄", "건강검진과 예방접종", "방역 인력 배치와 역학조사관 교육"], a: 0, exp: "결핵역학조사는 \'지표환자 조사\'와 \'접촉자 조사\'로 구성됩니다." },
            { id: 9, q: "집단시설 내 결핵환자 발생 시, 지표환자의 호흡기검체 검사 결과가 음성일지라도 조사를 실시해야 하는 기준은?", options: ["기침 증상이 3일 이상 지속될 때", "흉부X선 상 공동이 확인된 경우", "과거 결핵 치료력이 있을 때", "환자가 65세 이상 고령일 때"], a: 1, exp: "호흡기검체 검사 결과 음성이나 흉부X선 상 공동이 확인된 경우 역학조사를 실시합니다." },
            { id: 10, q: "밀접접촉자 선정 기준 중 \'시간\'에 대한 조건으로 옳은 것은?", options: ["하루 연속 4시간 이상 또는 누적 20시간 이상", "하루 연속 8시간 이상 또는 누적 40시간 이상", "하루 연속 12시간 이상 또는 누적 60시간 이상", "연속 24시간 이상"], a: 1, exp: "하루에 연속으로 8시간 이상 접촉했거나 전염성 추정기간 동안 누적 기준 40시간 이상 접촉한 경우 밀접접촉자에 포함됩니다." },
            { id: 11, q: "집단시설 현장조사 종료 후, 보건소는 현장조사서를 질병보건통합관리시스템에 며칠 이내에 등록해야 하는가?", options: ["24시간 이내", "3일 이내 (근무일 기준)", "7일 이내", "14일 이내"], a: 1, exp: "현장조사 종료 후 현장조사서를 작성하여 현장조사일로부터 3일 이내(근무일 기준)에 시스템에 등록해야 합니다." },
            { id: 12, q: "5세 미만 결핵환자 감염원 조사 시 BCG 백신 접종에 의한 감염 가능성을 감별하기 위해 의뢰하는 검사는?", options: ["HIV 항체 검사", "M. bovis BCG 감별검사 (유전형 검사)", "통상감수성 검사", "인터페론감마 분비검사"], a: 1, exp: "BCG 예방접종 이상반응 및 M. bovis BCG 감염 여부를 확인하기 위해 유전형 검사를 의뢰합니다." },
            { id: 13, q: "집단시설 접촉자 조사 완료 시점으로부터 \'결핵역학조사 종료보고서\'를 시스템에 등록해야 하는 기한은?", options: ["3일 이내", "7일 이내", "2주 이내", "1개월 이내"], a: 2, exp: "접촉자 조사 완료 시점으로부터 2주 이내에 \'결핵역학조사 종료보고서\'를 작성하여 시스템에 등록해야 합니다." },
            { id: 14, q: "투베르쿨린 피부반응검사(TST) 시행 전 반드시 확인해야 할 최근 백신 접종력은?", options: ["사백신 접종력", "코로나19 백신 접종력", "최근 4주 이내 생백신 접종력", "모든 백신은 무관함"], a: 2, exp: "생백신 접종은 TST 결과에 위음성을 유발할 수 있으므로, 최근 4주 이내 생백신 접종력을 확인해야 합니다." },
            { id: 15, q: "신생아(생후 4주 이하)가 활동성 결핵환자와 긴밀하게 접촉했을 때, 활동성 배제 후 취해야 할 1차 조치는?", options: ["즉시 BCG 접종", "관찰만 실시", "TST 판독 전까지 이소니아지드 투여", "IGRA 검사 시행"], a: 2, exp: "활동성 결핵이 배제되면 생후 3개월 이후 TST를 시행하며, TST 판독 전까지 이소니아지드를 선제 투여합니다." },
            { id: 16, q: "정상 면역자(5세 이상)의 2차 TST 검사 결과 \'양전(Positive conversion)\'으로 판정하는 기준은?", options: ["5mm 이상 증가", "10mm 이상이면서 1차 결과보다 6mm 이상 증가", "15mm 이상", "이전 결과와 상관없이 10mm 이상"], a: 1, exp: "5세 이상 정상 면역자의 경우 2차 TST 결과가 10mm 이상이면서 1차 결과보다 6mm 이상 증가한 경우 양전으로 판정합니다." },
            { id: 17, q: "잠복결핵감염 치료 전 활동성 결핵을 반드시 배제해야 하는 가장 큰 이유는?", options: ["치료 비용을 절감하기 위해", "내성결핵 발생을 예방하기 위해", "환자의 순응도를 높이기 위해", "통계 오류를 방지하기 위해"], a: 1, exp: "활동성 결핵을 배제하지 않고 잠복결핵 치료를 시행할 경우 내성결핵이 발생할 수 있습니다." },
            { id: 18, q: "지표환자가 \'이소니아지드(INH) 단독 내성\' 결핵인 경우, 접촉자의 잠복결핵감염 치료 권장 요법은?", options: ["9H (이소니아지드 9개월)", "4R (리팜핀 4개월)", "3HR (이소니아지드/리팜핀 3개월)", "6Lfx (레보플록사신 6개월)"], a: 1, exp: "지표환자가 INH 단독 내성인 경우 리팜핀 4개월(4R) 요법을 권장합니다." },
            { id: 19, q: "결핵환자 \'사례조사\'의 1차 조사 시기로 적절한 것은?", options: ["신고일 당일", "신고일 기준 3일 이내 (토·공휴일 제외)", "신고일 기준 7일 이내", "신고일 기준 14일 이내"], a: 1, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 법정공휴일 제외)에 실시해야 합니다." },
            { id: 20, q: "결핵환자 \'취약성평가\' 결과에 따른 위험도 분류 기준 중 \'중위험군\'에 해당하는 점수 구간은?", options: ["0~16점", "17~30점", "31점 이상", "50점 이상"], a: 1, exp: "취약성평가 결과 저위험군은 16점 이하, 중위험군은 17~30점, 고위험군은 31점 이상입니다." },
            { id: 21, q: "(2차 응시) 맞춤형 사례관리의 \'사례상담\' 대상이 되는 위험군 기준은?", options: ["저위험군 이상", "중위험군 이상", "고위험군만", "모든 환자 의무"], a: 1, exp: "취약성평가 결과 중위험군 이상의 위험도를 가진 환자를 대상으로 사례상담을 진행합니다." },
            { id: 22, q: "(2차 응시) 전염성 결핵환자의 경우 치료 시작 직후 전염성 기간(치료 시작 후 2주간)의 기본 복약확인 주기는?", options: ["주 1회", "주 3회", "매일 확인", "월 1회"], a: 2, exp: "전염성 환자의 경우 치료시작 이후 2주간(전염성 기간) 매일 복약확인을 실시해야 합니다." },
            { id: 23, q: "(2차 응시) 결핵 산정특례 적용을 확진일로부터 소급하여 받으려면 확진일로부터 며칠 이내에 신청해야 하는가?", options: ["7일 이내", "14일 이내", "30일 이내", "60일 이내"], a: 2, exp: "확진일로부터 30일 이내에 신청해야 확진일(토·공휴일 포함)부터 소급하여 적용받을 수 있습니다." },
            { id: 24, q: "가족접촉자 조사의 주된 목적으로 가장 옳은 것은?", options: ["추가 결핵환자 발견 및 잠복결핵감염 치료를 통한 확산 방지", "직장 동료 전수조사 및 격리", "결핵환자의 식단 관리 및 영양 공급", "보건소 의료진 역량 평가"], a: 0, exp: "가족접촉자 조사는 추가 결핵환자 및 잠복결핵감염자를 조기 발견·치료하여 결핵 확산을 방지하기 위함입니다." },

            { id: 490, q: "(18차 응시) 가족접촉자의 초회 잠복결핵감염검사가 음성인 경우, 2차 연속검사는 언제 시행하는가?", options: ["마지막 접촉일 기준 2~4주 후", "마지막 접촉일 기준 4~6주 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 이후", "마지막 접촉일 기준 12주 후"], a: 2, exp: "초회 잠복결핵감염검사 음성인 경우, 마지막 접촉일 또는 전염성 소실일 기준 8~10주 이후에 2차 검사를 시행합니다." },
            { id: 491, q: "(21차 응시) 집단시설 결핵역학조사의 구성 요소로 옳은 것은?", options: ["지표환자 조사와 접촉자 조사", "환경 소독과 시설 폐쇄", "건강검진과 예방접종", "방역 인력 배치와 역학조사관 교육"], a: 0, exp: "결핵역학조사는 \'지표환자 조사\'와 \'접촉자 조사\'로 구성됩니다." },
            { id: 492, q: "(21차 응시) 집단시설 내 결핵환자 발생 시, 지표환자의 호흡기검체 검사 결과가 음성일지라도 조사를 실시해야 하는 기준은?", options: ["기침 증상이 3일 이상 지속될 때", "흉부X선 상 공동이 확인된 경우", "과거 결핵 치료력이 있을 때", "환자가 65세 이상 고령일 때"], a: 1, exp: "호흡기검체 검사 결과 음성이나 흉부X선 상 공동이 확인된 경우 역학조사를 실시합니다." },
            { id: 493, q: "(21차 응시) 밀접접촉자 선정 기준 중 \'시간\'에 대한 조건으로 옳은 것은?", options: ["하루 연속 4시간 이상 또는 누적 20시간 이상", "하루 연속 8시간 이상 또는 누적 40시간 이상", "하루 연속 12시간 이상 또는 누적 60시간 이상", "연속 24시간 이상"], a: 1, exp: "하루에 연속으로 8시간 이상 접촉했거나 전염성 추정기간 동안 누적 기준 40시간 이상 접촉한 경우 밀접접촉자에 포함됩니다." },
            { id: 494, q: "(21차 응시) 집단시설 현장조사 종료 후, 보건소는 현장조사서를 질병보건통합관리시스템에 며칠 이내에 등록해야 하는가?", options: ["24시간 이내", "3일 이내 (근무일 기준)", "7일 이내", "14일 이내"], a: 1, exp: "현장조사 종료 후 현장조사서를 작성하여 현장조사일로부터 3일 이내(근무일 기준)에 시스템에 등록해야 합니다." },
            { id: 495, q: "(21차 응시) 5세 미만 결핵환자 감염원 조사 시 BCG 백신 접종에 의한 감염 가능성을 감별하기 위해 의뢰하는 검사는?", options: ["HIV 항체 검사", "M. bovis BCG 감별검사 (유전형 검사)", "통상감수성 검사", "인터페론감마 분비검사"], a: 1, exp: "BCG 예방접종 이상반응 및 M. bovis BCG 감염 여부를 확인하기 위해 유전형 검사를 의뢰합니다." },
            { id: 496, q: "(21차 응시) 집단시설 접촉자 조사 완료 시점으로부터 \'결핵역학조사 종료보고서\'를 시스템에 등록해야 하는 기한은?", options: ["3일 이내", "7일 이내", "2주 이내", "1개월 이내"], a: 2, exp: "접촉자 조사 완료 시점으로부터 2주 이내에 \'결핵역학조사 종료보고서\'를 작성하여 시스템에 등록해야 합니다." },
            { id: 497, q: "(25차 응시) 투베르쿨린 피부반응검사(TST) 시행 전 반드시 확인해야 할 최근 백신 접종력은?", options: ["사백신 접종력", "코로나19 백신 접종력", "최근 4주 이내 생백신 접종력", "모든 백신은 무관함"], a: 2, exp: "생백신 접종은 TST 결과에 위음성을 유발할 수 있으므로, 최근 4주 이내 생백신 접종력을 확인해야 합니다." },
            { id: 498, q: "(25차 응시) 신생아(생후 4주 이하)가 활동성 결핵환자와 긴밀하게 접촉했을 때, 활동성 배제 후 취해야 할 1차 조치는?", options: ["즉시 BCG 접종", "관찰만 실시", "TST 판독 전까지 이소니아지드 투여", "IGRA 검사 시행"], a: 2, exp: "활동성 결핵이 배제되면 생후 3개월 이후 TST를 시행하며, TST 판독 전까지 이소니아지드를 선제 투여합니다." },
            { id: 499, q: "(25차 응시) 정상 면역자(5세 이상)의 2차 TST 검사 결과 \'양전(Positive conversion)\'으로 판정하는 기준은?", options: ["5mm 이상 증가", "10mm 이상이면서 1차 결과보다 6mm 이상 증가", "15mm 이상", "이전 결과와 상관없이 10mm 이상"], a: 1, exp: "5세 이상 정상 면역자의 경우 2차 TST 결과가 10mm 이상이면서 1차 결과보다 6mm 이상 증가한 경우 양전으로 판정합니다." },
            { id: 500, q: "(25차 응시) 잠복결핵감염 치료 전 활동성 결핵을 반드시 배제해야 하는 가장 큰 이유는?", options: ["치료 비용을 절감하기 위해", "내성결핵 발생을 예방하기 위해", "환자의 순응도를 높이기 위해", "통계 오류를 방지하기 위해"], a: 1, exp: "활동성 결핵을 배제하지 않고 잠복결핵 치료를 시행할 경우 내성결핵이 발생할 수 있습니다." }
        ];

        let availableQuestions = [];
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswered = false;
        let currentShuffledOptions = [];

        const QUESTIONS_PER_QUIZ = 10;
        const STORAGE_KEY = 'tb_quiz_500_asked_ids_v2';

        const startBtn = document.getElementById('start-btn');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resetHistoryBtn = document.getElementById('reset-history-btn');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            let askedIds = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            availableQuestions = questionBank.filter(q => !askedIds.includes(q.id));
            
            if (availableQuestions.length < QUESTIONS_PER_QUIZ) {
                askedIds = [];
                availableQuestions = [...questionBank];
                alert("축하합니다! 500문제를 모두 다 푸셨습니다. 출제 기록이 초기화되어 처음부터 다시 시작합니다.");
            }
            
            shuffle(availableQuestions);
            currentQuiz = availableQuestions.slice(0, QUESTIONS_PER_QUIZ);
            
            askedIds = [...askedIds, ...currentQuiz.map(q => q.id)];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(askedIds));

            currentQuestionIndex = 0;
            score = 0;
        }

        function displayQuestion() {
            isAnswered = false;
            selectedOptionIndex = null;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-counter').innerText = `문제 ${currentQuestionIndex + 1} / ${QUESTIONS_PER_QUIZ}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / QUESTIONS_PER_QUIZ) * 100}%`;

            currentShuffledOptions = q.options.map((text, idx) => ({ text, originalIndex: idx }));
            shuffle(currentShuffledOptions);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            currentShuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-lg border border-gray-300 hover:bg-gray-50 focus:outline-none';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, btnNode) {
            if (isAnswered) return;
            selectedOptionIndex = index;
            
            const buttons = document.getElementById('options-container').children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('selected');
            }
            btnNode.classList.add('selected');
        }

        function checkAnswer() {
            if (selectedOptionIndex === null) {
                alert("정답을 선택해주세요.");
                return;
            }
            
            isAnswered = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;
            
            const correctOriginalIndex = q.a;

            for (let i = 0; i < buttons.length; i++) {
                if (currentShuffledOptions[i].originalIndex === correctOriginalIndex) {
                    buttons[i].classList.add('correct');
                    if (i === selectedOptionIndex) {
                        score += 10;
                    }
                } else if (i === selectedOptionIndex) {
                    buttons[i].classList.add('incorrect');
                }
            }

            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_QUIZ) * 100}%`;
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;
        }

        // 이벤트 리스너
        startBtn.addEventListener('click', () => {
            initQuiz();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            displayQuestion();
        });

        submitBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_QUIZ) {
                displayQuestion();
            } else {
                showResults();
            }
        });

        restartBtn.addEventListener('click', () => {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("모든 문제 출제 기록을 초기화하시겠습니까? 처음부터 다시 500문제가 새롭게 출제됩니다.")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("초기화 완료되었습니다.");
            }
        });

    </script>
