<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn.selected { background-color: #dbeafe; border-color: #3b82f6; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .quiz-container { min-height: 400px; }
    </style>
</head>
<body class="text-gray-800">
    <div class="max-w-3xl mx-auto p-4 md:p-8 mt-10 bg-white rounded-xl shadow-lg quiz-container">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">2026 국가결핵관리지침 퀴즈</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">500개의 독립 데이터베이스에서 10문제씩 랜덤 출제됩니다.</p>
        
        <div id="start-screen" class="text-center py-12 flex flex-col items-center justify-center">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition-transform transform hover:scale-105 text-lg">
                퀴즈 시작하기
            </button>
            <div class="mt-6 text-sm text-blue-600 font-medium bg-blue-50 inline-block px-4 py-2 rounded-lg shadow-sm">
                호남권질병대응센터 감염병대응과
            </div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-4 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-500" id="question-counter">문제 1 / 10</span>
                <div class="w-2/3 bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" id="progress-bar" style="width: 10%"></div>
                </div>
            </div>
            
            <div id="question-container" class="mb-6">
                <h2 class="text-xl font-bold mb-5 leading-relaxed" id="question-text">문제 내용</h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-container" class="hidden p-5 mb-6 bg-yellow-50 border border-yellow-200 rounded-lg shadow-sm">
                <p class="font-bold text-yellow-800 mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                    해설 및 지침 근거
                </p>
                <p id="explanation-text" class="text-gray-700 text-sm leading-relaxed"></p>
            </div>

            <div class="flex justify-end mt-4">
                <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition">다음 문제 ➔</button>
                <button id="submit-btn" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition">정답 확인</button>
            </div>
        </div>

        <div id="result-screen" class="hidden py-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold mb-4 text-gray-800">퀴즈 완료!</h2>
                <div class="inline-block bg-blue-50 px-8 py-4 rounded-xl border border-blue-100">
                    <p class="text-lg text-gray-600 mb-1">당신의 점수는</p>
                    <p class="text-4xl font-extrabold text-blue-600"><span id="score-text"></span>점</p>
                </div>
            </div>
            
            <div id="wrong-summary-container" class="mb-10">
                <h3 class="text-xl font-bold text-red-600 mb-4 border-b-2 border-red-100 pb-2 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    틀린 문제 요약 (오답 노트)
                </h3>
                <ul id="wrong-list" class="space-y-4"></ul>
            </div>

            <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md w-full sm:w-auto">
                    새로운 10문제 풀기
                </button>
                <button id="reset-history-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-8 rounded-lg shadow-md w-full sm:w-auto">
                    전체 출제 기록 초기화
                </button>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            { id: 43, baseId: 4, q: "가족접촉자 검진수첩 발급 후 가족이 검사를 완료하도록 권장하는 기한과(와) 관련하여 국가결핵관리사업에서 제시하는 기준은?", options: ["신고일 기준 2주일 이내", "신고일 기준 1주일 이내", "신고일 기준 3개월 이내", "신고일 기준 1개월 이내"], a: 3, exp: "환자 신고일 기준으로 1개월 내에 보건소나 검진의료기관을 방문하여 가족접촉자 검사를 받도록 안내해야 합니다." },
            { id: 157, baseId: 15, q: "의료기관 및 보건당국이 준수해야 하는 잠복결핵감염 치료 중 부작용 모니터링을 위한 간기능 검사(AST/ALT) 기본 주기 지침은?", options: ["치료 시작 후 1주, 2주 차만 실시", "치료 종료 시점에 1회 최종 확인", "치료 시작 후 2주, 4주 및 이후 매달 정기 검사", "치료 시작 3개월 후 1회 실시"], a: 2, exp: "치료 시작 후 2주, 4주차에 시행하고, 이후 치료 종료 시까지 정기적으로 매달 검사합니다." },
            { id: 269, baseId: 26, q: "감염병 관리 법령 및 지침에 명시된 집단시설 결핵역학조사의 핵심을 이루는 두 가지 세부 조사 세부 내용으로 옳은 것은?", options: ["건강검진 실시 현황 조사와 예방접종력 조사", "전염성 확인을 위한 지표환자 조사와 확산 방지를 위한 접촉자 조사", "의료진 역학조사와 방역 인력 배치", "환경 소독 및 환기 점검 조사와 시설 폐쇄 심의"], a: 1, exp: "결핵역학조사는 감염 경로와 전염성을 확인하는 \'지표환자 조사\'와 \'접촉자 조사\'로 이루어집니다." },
            { id: 335, baseId: 33, q: "보건소 결핵 전담요원 업무 중 집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정할 때 참고하지 않는 무관한 지표에 대한 내용으로 알맞은 것은?", options: ["결핵 관련 임상 증상(기침 등)의 최초 발생 시기", "환자 거주지의 방 크기, 인원수 및 환기 상태", "객담 도말검사 및 배양검사 양성 결과", "흉부X선 상 결핵성 공동(cavity) 유무"], a: 1, exp: "전염성 추정 기간은 증상 발생일, 도말검사 결과, 공동 유무 등 임상적 요인에 따라 결정되며, 거주지 환경은 접촉자 범위를 정할 때 참고합니다." },
            { id: 434, baseId: 43, q: "역학조사 및 환자 관리 현장에서 준수해야 할 결핵 1차 치료제 중 드물게 시력 저하, 시야 결손, 적녹 색맹 등의 시신경 부작용을 유발할 수 있는 약제 기준은?", options: ["에탐부톨(EMB, Ethambutol)", "리팜핀(RIF, Rifampin)", "피라진아미드(PZA, Pyrazinamide)", "이소니아지드(INH, Isoniazid)"], a: 0, exp: "에탐부톨은 시신경염을 유발할 수 있으므로, 치료 전후로 시력 및 색각 검사를 권장하며 이상 발생 시 즉시 복용을 중단해야 합니다." },
            { id: 24, baseId: 2, q: "역학조사 및 환자 관리 현장에서 준수해야 할 전염성 폐결핵환자의 치료 초기(전염성 기간 2주) 복약확인 주기 기준은?", options: ["매일 확인", "주 3회", "주 1회", "월 1회"], a: 0, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 46, baseId: 4, q: "다음 중 질병관리청이 권고하는 가족접촉자 검진수첩 발급 후 가족이 검사를 완료하도록 권장하는 기한 지침으로 가장 알맞은 것은?", options: ["신고일 기준 2주일 이내", "신고일 기준 1주일 이내", "신고일 기준 1개월 이내", "신고일 기준 3개월 이내"], a: 2, exp: "환자 신고일 기준으로 1개월 내에 보건소나 검진의료기관을 방문하여 가족접촉자 검사를 받도록 안내해야 합니다." },
            { id: 266, baseId: 26, q: "다음 중 질병관리청이 권고하는 집단시설 결핵역학조사의 핵심을 이루는 두 가지 세부 조사 지침으로 가장 알맞은 것은?", options: ["전염성 확인을 위한 지표환자 조사와 확산 방지를 위한 접촉자 조사", "환경 소독 및 환기 점검 조사와 시설 폐쇄 심의", "의료진 역학조사와 방역 인력 배치", "건강검진 실시 현황 조사와 예방접종력 조사"], a: 0, exp: "결핵역학조사는 감염 경로와 전염성을 확인하는 \'지표환자 조사\'와 \'접촉자 조사\'로 이루어집니다." },
            { id: 365, baseId: 36, q: "보건소 결핵 전담요원 업무 중 결핵환자 치료 성공률 향상을 위해 WHO가 권고하고 국가가지침으로 삼는 \'직접복약확인(DOT)\'의 핵심 원칙에 대한 내용으로 알맞은 것은?", options: ["보호자가 약을 대신 수령하여 환자의 침상 옆에 비치해 두는 것", "환자 스스로 복약 일지를 꼼꼼하게 작성하여 한 달에 한 번 제출하는 것", "의료진이나 전담요원이 환자가 결핵약을 삼키는 것을 눈으로 직접 확인하는 것", "스마트폰 알람 앱을 설치하여 약 먹을 시간에 울리게 하는 것"], a: 2, exp: "직접복약확인(DOT)은 복약 순응도를 높이기 위해 투약 상황을 시각적으로 완전히 확인하는 관리 기법입니다." },
            { id: 499, baseId: 49, q: "감염병 관리 법령 및 지침에 명시된 결핵 감염관리를 위해 전염성 결핵 환자가 입원하는 병실(음압격리실)의 권장 공기 환기 횟수 세부 내용으로 옳은 것은?", options: ["시간당 최대 2회 미만 유지 (공기 유출 방지)", "시간당 30회 이상의 강풍 환기 유지", "시간당 최소 6회 이상 (신축 병동의 경우 12회 이상 권장)", "하루에 1회, 10분간 자연 환기 실시"], a: 2, exp: "공기 매개 감염을 막기 위해 음압격리실은 시간당 최소 6~12회의 기계적 환기를 통해 오염된 공기를 희석 및 배출해야 합니다." },
            { id: 406, baseId: 40, q: "다음 중 질병관리청이 권고하는 잠복결핵감염(LTBI, Latent Tuberculosis Infection)의 정의로 가장 올바른 것 지침으로 가장 알맞은 것은?", options: ["결핵균 감염 후 기침과 객담 증상만 나타나고 전염성은 없는 상태", "결핵균에 감염되었으나 임상적 증상, 방사선학적 이상 소견, 전염성이 모두 없는 상태", "결핵균이 흉부X선 상 명확한 공동(cavity)을 형성하며 잠복해 있는 상태", "활동성 결핵 치료 완료 후 폐에 석회화된 흉터만 남아있는 상태"], a: 1, exp: "잠복결핵감염은 결핵균이 체내에 존재하지만 면역 기전에 의해 억제되어 증상이나 전염성이 없는 상태를 말합니다." },
            { id: 362, baseId: 36, q: "결핵 관리 실무 지침서에 명시된 결핵환자 치료 성공률 향상을 위해 WHO가 권고하고 국가가지침으로 삼는 \'직접복약확인(DOT)\'의 핵심 원칙 규정으로 적절한 것은?", options: ["의료진이나 전담요원이 환자가 결핵약을 삼키는 것을 눈으로 직접 확인하는 것", "보호자가 약을 대신 수령하여 환자의 침상 옆에 비치해 두는 것", "환자 스스로 복약 일지를 꼼꼼하게 작성하여 한 달에 한 번 제출하는 것", "스마트폰 알람 앱을 설치하여 약 먹을 시간에 울리게 하는 것"], a: 0, exp: "직접복약확인(DOT)은 복약 순응도를 높이기 위해 투약 상황을 시각적으로 완전히 확인하는 관리 기법입니다." },
            { id: 66, baseId: 6, q: "다음 중 질병관리청이 권고하는 다제내성결핵 지표환자의 접촉자 중 기침 증상자 객담 검사 시 필수 항목 지침으로 가장 알맞은 것은?", options: ["Xpert MTB/RIF 또는 BD max (신속내성검사)", "투베르쿨린 피부반응검사(TST)", "단순 항산균 도말검사", "결핵균 통상감수성검사"], a: 0, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 신속 내성 검사를 반드시 시행하여 내성균 여부를 확인합니다." },
            { id: 430, baseId: 42, q: "결핵 1차 치료제 중 복용 시 소변, 눈물, 땀 등의 체액을 붉은색(오렌지색)으로 변하게 할 수 있는 약제 처리에 대한 실무적 판단 기준으로 올바른 것은?", options: ["피라진아미드(PZA, Pyrazinamide)", "이소니아지드(INH, Isoniazid)", "에탐부톨(EMB, Ethambutol)", "리팜핀(RIF, Rifampin)"], a: 3, exp: "리팜핀 복용 시 체액이 오렌지색으로 변할 수 있으며, 이는 정상적인 약물 반응이므로 환자에게 사전 복약 지도를 해야 합니다." },
            { id: 263, baseId: 26, q: "집단시설 결핵역학조사의 핵심을 이루는 두 가지 세부 조사과(와) 관련하여 국가결핵관리사업에서 제시하는 기준은?", options: ["건강검진 실시 현황 조사와 예방접종력 조사", "의료진 역학조사와 방역 인력 배치", "환경 소독 및 환기 점검 조사와 시설 폐쇄 심의", "전염성 확인을 위한 지표환자 조사와 확산 방지를 위한 접촉자 조사"], a: 3, exp: "결핵역학조사는 감염 경로와 전염성을 확인하는 \'지표환자 조사\'와 \'접촉자 조사\'로 이루어집니다." },
            { id: 16, baseId: 1, q: "다음 중 질병관리청이 권고하는 결핵 산정특례 소급 적용을 위한 국민건강보험공단 신청 기한 지침으로 가장 알맞은 것은?", options: ["7일 이내", "60일 이내", "14일 이내", "확진일로부터 30일 이내"], a: 3, exp: "30일 이내에 산정특례를 신청해야 확진일(공휴일 포함)부터 소급하여 혜택을 적용받을 수 있습니다." },

            { id: 348, baseId: 34, q: "전염성 결핵환자가 학교, 어린이집 등 집단시설 종사자로 확인되었을 때, 보건소가 타인과의 접촉 차단을 위해 발급하는 서류을(를) 시행할 때 고려해야 할 원칙으로 가장 적절한 것은?", options: ["해당 집단시설 즉각 폐쇄 및 소독 명령서", "결핵환자 강제 입원 및 지정 병동 격리 명령서", "방역 수칙 위반에 따른 시설 과태료 부과 사전 통지서", "업무종사 및 등교 일시 제한 대상자 통보서"], a: 3, exp: "감염병예방법에 따라 집단시설 종사자가 전염성 결핵으로 확인된 경우 업무종사 일시 제한 통보서를 발급하여 격리 조치합니다." },
            { id: 308, baseId: 30, q: "보건소가 집단시설 현장조사를 완료한 후 현장조사서를 질병보건통합관리시스템에 등록해야 하는 기한을(를) 시행할 때 고려해야 할 원칙으로 가장 적절한 것은?", options: ["현장조사 완료 후 24시간 이내", "현장조사일로부터 7일 이내", "현장조사일로부터 14일 이내", "현장조사일로부터 3일 이내 (근무일 기준)"], a: 3, exp: "초기 대응 현황을 신속히 공유하기 위해 현장조사서는 근무일 기준 3일 이내에 시스템에 등록해야 합니다." },
            { id: 118, baseId: 11, q: "신생아(생후 4주 이하)가 활동성 결핵환자와 긴밀 접촉 시 활동성 배제 후 1차 조치을(를) 시행할 때 고려해야 할 원칙으로 가장 적절한 것은?", options: ["관찰만 실시하고 6개월 뒤 IGRA 검사", "즉시 리팜핀을 4개월간 투여", "즉시 BCG 백신을 접종", "생후 3개월 이후 TST 판독 전까지 이소니아지드를 예방적으로 선제 투여"], a: 3, exp: "활동성 결핵이 배제되면, 생후 3개월 이후 TST를 시행하고 그 전까지 예방적으로 이소니아지드를 선제 투여합니다." },
            { id: 381, baseId: 38, q: "지침상 활동성 폐결핵을 진단하기 위해 가장 권장되는 객담(가래) 채취 시점에 대한 설명으로 올바른 것은?", options: ["오후 취침 전 양치질을 마친 후의 타액", "식사 직후 소화효소가 섞인 타액", "아침 기상 직후 밤새 기관지에 고여 있던 첫 객담", "격렬한 운동 직후 호흡이 가쁠 때 나오는 객담"], a: 2, exp: "결핵균 검출률을 극대화하기 위해 아침 기상 직후 깊은 기침을 통해 나오는 첫 객담을 채취하는 것이 가장 좋습니다." },
            { id: 490, baseId: 48, q: "말기 신부전 환자(투석 환자 등)의 활동성 결핵 치료 시 1차 항결핵제 용량 및 투여 간격 조절 원칙 처리에 대한 실무적 판단 기준으로 올바른 것은?", options: ["이소니아지드와 리팜핀의 투여 간격을 월 1회로 대폭 연장", "신장으로 배설되는 에탐부톨과 피라진아미드의 투여 간격을 주 3회 등으로 연장하여 투여", "결핵약 투여를 중지하고 신장이식 수술을 우선 진행", "모든 1차 약제의 1회 투여 용량을 정상인의 절반 이하로 감량하여 매일 투여"], a: 1, exp: "이소니아지드와 리팜핀은 간 대사로 배설되나, 에탐부톨과 피라진아미드는 주로 신장 배설이므로 투여 간격 조정이 필요합니다." },
            { id: 132, baseId: 13, q: "결핵 관리 실무 지침서에 명시된 잠복결핵감염 치료 전 활동성 결핵을 반드시 철저히 배제해야 하는 가장 핵심적인 이유 규정으로 적절한 것은?", options: ["환자의 치료 거부감 및 복약 불순응 감소", "활동성 결핵 상태에서 1~2제 약제만 쓸 경우 결핵균의 내성 획득 위험", "결핵 약제에 의한 급성 간독성 예방", "잠복결핵 치료 약제의 고비용 문제 예방"], a: 1, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 228, baseId: 22, q: "취약성 평가 결과 \'고위험군\'으로 분류된 초치료 결핵 신환자의 권장 복약확인 횟수을(를) 시행할 때 고려해야 할 원칙으로 가장 적절한 것은?", options: ["주 4~5회 철저히 확인", "2주 1회 확인", "주 1~2회 확인", "월 1~2회 확인"], a: 0, exp: "고위험군 신환자의 경우 복약 순응도가 떨어질 우려가 커 주 4~5회 철저히 복약 여부를 확인해야 합니다." }
        ];

        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswered = false;
        let wrongQuestions = []; 

        const QUESTIONS_PER_QUIZ = 10;
        const STORAGE_KEY = 'tb_quiz_final_500_v10';

        const startBtn = document.getElementById('start-btn');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resetHistoryBtn = document.getElementById('reset-history-btn');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            wrongQuestions = [];
            let askedIds = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            let available = questionBank.filter(q => !askedIds.includes(q.id));
            
            shuffle(available);
            
            let selected = [];
            let usedBaseIds = new Set();
            let usedAnswers = new Set(); // 정답 텍스트 중복 방지
            
            // 1. 유사한 개념(Base ID) 차단
            // 2. 똑같은 정답 텍스트 차단
            for (let q of available) {
                let correctAnswerText = q.options[q.a];
                
                if (!usedBaseIds.has(q.baseId) && !usedAnswers.has(correctAnswerText)) {
                    selected.push(q);
                    usedBaseIds.add(q.baseId);
                    usedAnswers.add(correctAnswerText);
                }
                if (selected.length === QUESTIONS_PER_QUIZ) break;
            }

            if (selected.length < QUESTIONS_PER_QUIZ) {
                askedIds = [];
                available = [...questionBank];
                shuffle(available);
                selected = [];
                usedBaseIds = new Set();
                usedAnswers = new Set();
                
                for (let q of available) {
                    let correctAnswerText = q.options[q.a];
                    if (!usedBaseIds.has(q.baseId) && !usedAnswers.has(correctAnswerText)) {
                        selected.push(q);
                        usedBaseIds.add(q.baseId);
                        usedAnswers.add(correctAnswerText);
                    }
                    if (selected.length === QUESTIONS_PER_QUIZ) break;
                }
                alert("이전에 풀었던 문제들을 제외하고 중복 없는 10문제를 구성할 수 없어, 출제 기록이 자동 초기화되었습니다.");
            }
            
            currentQuiz = selected;
            
            askedIds = [...askedIds, ...currentQuiz.map(q => q.id)];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(askedIds));

            currentQuestionIndex = 0;
            score = 0;
        }

        function displayQuestion() {
            isAnswered = false;
            selectedOptionIndex = null;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-counter').innerText = `문제 ${currentQuestionIndex + 1} / ${QUESTIONS_PER_QUIZ}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / QUESTIONS_PER_QUIZ) * 100}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:bg-gray-50 focus:outline-none text-gray-700 font-medium transition-colors';
                btn.innerText = optText;
                btn.onclick = () => {
                    if (isAnswered) return;
                    selectedOptionIndex = index;
                    Array.from(optionsContainer.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer() {
            if (selectedOptionIndex === null) {
                alert("정답을 선택해주세요.");
                return;
            }
            
            isAnswered = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;
            
            let isCorrect = false;

            for (let i = 0; i < buttons.length; i++) {
                if (i === q.a) {
                    buttons[i].classList.add('correct');
                    if (i === selectedOptionIndex) {
                        isCorrect = true;
                        score += 10;
                    }
                } else if (i === selectedOptionIndex) {
                    buttons[i].classList.add('incorrect');
                }
            }

            if (!isCorrect) {
                wrongQuestions.push({
                    question: q.q,
                    myAnswer: q.options[selectedOptionIndex],
                    correctAnswer: q.options[q.a],
                    explanation: q.exp
                });
            }

            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_QUIZ) * 100}%`;
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;

            const wrongListContainer = document.getElementById('wrong-list');
            wrongListContainer.innerHTML = '';
            
            if (wrongQuestions.length === 0) {
                wrongListContainer.innerHTML = '<li class="text-green-700 font-bold text-center py-6 bg-green-50 rounded-xl border border-green-200">🎉 완벽합니다! 모든 문제를 맞히셨습니다.</li>';
            } else {
                wrongQuestions.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = "bg-red-50 p-5 rounded-xl border border-red-200 shadow-sm";
                    li.innerHTML = `
                        <p class="font-bold text-gray-900 mb-3 text-lg">Q${idx+1}. ${item.question}</p>
                        <div class="space-y-2 mb-3">
                            <p class="text-sm text-red-600 flex items-start"><span class="font-bold w-24 shrink-0">내가 고른 답:</span> <span>${item.myAnswer}</span></p>
                            <p class="text-sm text-blue-700 flex items-start"><span class="font-bold w-24 shrink-0">올바른 답:</span> <span>${item.correctAnswer}</span></p>
                        </div>
                        <div class="text-sm text-gray-700 bg-white p-3 rounded-lg border border-red-100 flex items-start">
                            <span class="font-bold text-yellow-600 w-12 shrink-0">해설:</span> 
                            <span>${item.explanation}</span>
                        </div>
                    `;
                    wrongListContainer.appendChild(li);
                });
            }
        }

        startBtn.addEventListener('click', () => {
            initQuiz();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            displayQuestion();
        });

        submitBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_QUIZ) {
                displayQuestion();
            } else {
                showResults();
            }
        });

        restartBtn.addEventListener('click', () => {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("모든 문제 출제 기록을 초기화하시겠습니까? (기록 삭제 후 새로운 10문제가 출제됩니다.)")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("초기화 완료되었습니다.");
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
