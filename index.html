<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 퀴즈 - 시스템 점검</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border-left-color: #0ea5e9;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-slate-800">
    <div class="max-w-xl mx-auto p-10 bg-white rounded-3xl shadow-2xl text-center">
        <div class="flex justify-center mb-8">
            <div class="spinner"></div>
        </div>
        <h1 class="text-3xl font-extrabold text-blue-700 mb-4 tracking-tight">시스템 점검 중</h1>
        <p class="text-lg text-slate-600 mb-2 font-medium">현재 더욱 완벽한 문제를 새롭게 재생산 중입니다.</p>
        <p class="text-md text-slate-500 mb-8">안정적인 서비스 제공을 위해 일시 중지하오니, 잠시 후 다시 접속해 주시기 바랍니다.</p>
        
        <div class="text-sm text-blue-800 font-semibold bg-blue-50 inline-block px-5 py-2.5 rounded-lg shadow-sm border border-blue-200">
            호남권질병대응센터 감염병대응과
        </div>
    </div>
</body>
</html>
