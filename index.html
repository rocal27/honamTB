<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 500제 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn.selected { background-color: #e0f2fe; border-color: #0ea5e9; }
        .option-btn.correct { background-color: #dcfce7; border-color: #22c55e; color: #166534; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .quiz-container { min-height: 450px; }
    </style>
</head>
<body class="text-slate-800">
    <div class="max-w-4xl mx-auto p-5 md:p-10 mt-10 bg-white rounded-2xl shadow-xl quiz-container">
        <h1 class="text-3xl font-extrabold text-center text-blue-700 mb-2 tracking-tight">2026 국가결핵관리지침 퀴즈</h1>
        <p class="text-center text-slate-500 mb-8 text-sm font-medium">500개의 고유한 결핵 지식 데이터베이스에서 중복 없이 10문제가 출제됩니다.</p>
        
        <div id="start-screen" class="text-center py-16 flex flex-col items-center justify-center">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full shadow-lg transition-transform transform hover:scale-105 text-lg">
                퀴즈 시작하기
            </button>
            <div class="mt-8 text-sm text-blue-800 font-semibold bg-blue-100 inline-block px-5 py-2.5 rounded-lg shadow-sm border border-blue-200">
                호남권질병대응센터 감염병대응과
            </div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-5 flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-100">
                <span class="text-sm font-bold text-slate-500" id="question-counter">문제 1 / 10</span>
                <div class="w-2/3 bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500 ease-out" id="progress-bar" style="width: 10%"></div>
                </div>
            </div>
            
            <div id="question-container" class="mb-6">
                <h2 class="text-xl md:text-2xl font-bold mb-6 leading-relaxed text-slate-800" id="question-text">문제 내용</h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-container" class="hidden p-5 mb-6 bg-amber-50 border border-amber-200 rounded-xl shadow-inner">
                <p class="font-extrabold text-amber-900 mb-2 flex items-center text-base">
                    <svg class="w-5 h-5 mr-1.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                    지침 해설
                </p>
                <p id="explanation-text" class="text-slate-700 text-sm md:text-base leading-relaxed font-medium"></p>
            </div>

            <div class="flex justify-end mt-6">
                <button id="next-btn" class="hidden bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-all duration-200">다음 문제 ➔</button>
                <button id="submit-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-all duration-200">정답 확인</button>
            </div>
        </div>

        <div id="result-screen" class="hidden py-8">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-extrabold mb-4 text-slate-800">퀴즈 완료!</h2>
                <div class="inline-block bg-blue-50 px-10 py-5 rounded-2xl border-2 border-blue-100 shadow-sm">
                    <p class="text-lg text-slate-600 mb-2 font-medium">당신의 점수는</p>
                    <p class="text-5xl font-black text-blue-700"><span id="score-text"></span>점</p>
                </div>
            </div>
            
            <div id="wrong-summary-container" class="mb-10">
                <h3 class="text-xl font-bold text-rose-600 mb-5 border-b-2 border-rose-100 pb-3 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    오답 노트 (틀린 문제 복습)
                </h3>
                <ul id="wrong-list" class="space-y-5"></ul>
            </div>

            <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-md w-full sm:w-auto transition-colors">
                    새로운 10문제 풀기
                </button>
                <button id="reset-history-btn" class="bg-slate-400 hover:bg-slate-500 text-white font-bold py-3.5 px-8 rounded-xl shadow-md w-full sm:w-auto transition-colors">
                    전체 출제 기록 초기화
                </button>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            { id: 104, topic: "조사착수", q: "집단시설 결핵환자 발생 시 보건소가 현장조사서를 질병보건통합관리시스템에 등록해야 하는 기한 (시스템 기준 104)", options: ["24시간 이내", "7일 이내", "14일 이내", "현장조사일 기준 3일 이내 (근무일 기준)"], a: 3, exp: "신속한 정보 공유를 위해 현장조사 후 근무일 기준 3일 이내 등록이 원칙입니다." },

            { id: 268, topic: "안심벨트", q: "국가결핵관리사업 중 \'결핵 안심벨트 지원사업\'이 간병비나 영양 간식비 등을 지원하는 주된 대상층 (지원 기준 268)", options: ["만 15세 미만 소아 결핵환자 전원", "입원 명령을 받은 외국인 환자 전체", "모든 다제내성결핵 환자", "사회·경제적 취약계층 결핵환자"], a: 3, exp: "결핵 안심벨트 사업은 저소득층 등 취약계층의 치료 성공률 제고를 목적으로 합니다." },
            { id: 126, topic: "전염성기간", q: "집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\' 설정에 영향을 주지 않는 지표 (조사 기준 126)", options: ["객담 도말 양성 여부", "환자 거주지 또는 근무지의 방 크기 및 환기 상태", "기침 증상 발생일", "흉부X선 상 공동(cavity) 유무"], a: 1, exp: "공간 크기나 환기 상태는 전염성 추정 \'기간\' 설정 기준이 아닙니다." },

            { id: 123, topic: "전염성기간", q: "집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\' 설정에 영향을 주지 않는 지표 (조사 기준 123)", options: ["흉부X선 상 공동(cavity) 유무", "객담 도말 양성 여부", "기침 증상 발생일", "환자 거주지 또는 근무지의 방 크기 및 환기 상태"], a: 3, exp: "공간 크기나 환기 상태는 전염성 추정 \'기간\' 설정 기준이 아닙니다." },

            { id: 162, topic: "간기능모니터링", q: "잠복결핵감염 치료 중 부작용 모니터링을 위한 간기능 검사(AST/ALT)의 기본 권장 주기 (부작용 기준 162)", options: ["치료 종료 시점에 최종 확인", "치료 3개월 경과 후 1회 실시", "치료 시작 후 1주차 1회만 실시", "치료 시작 후 2주, 4주차 및 이후 매달 1회 정기 검사"], a: 3, exp: "초기 2주, 4주차 확인 후 매달 간기능을 모니터링해야 합니다." },

            { id: 378, topic: "HIV접촉", q: "HIV(에이즈) 감염인이 활동성 결핵환자와 접촉했을 때, 잠복결핵감염 치료를 결정하는 투베르쿨린 피부반응검사(TST) 결절 크기 기준 (현장 적용 사례 378)", options: ["15mm 이상일 경우에만 제한적 치료", "정상 면역자와 동일하게 10mm 이상", "TST 결과와 무관하게 흉부X선만 관찰", "결절 크기 5mm 이상일 경우 양성으로 간주하여 즉시 치료"], a: 3, exp: "면역저하자인 HIV 감염인은 TST 결절이 5mm만 되어도 양성으로 판정합니다." },
            { id: 243, topic: "시력저하", q: "결핵 1차 치료제 중 드물게 시력 저하, 시야 결손, 적녹 색맹 등의 시신경염을 유발할 수 있어 주기적 시력 검사가 요구되는 약제 (약제 부작용 243)", options: ["피라진아미드 (PZA)", "리팜핀 (RIF)", "에탐부톨 (EMB)", "이소니아지드 (INH)"], a: 2, exp: "에탐부톨 복용 시 시신경염 부작용 발생 여부를 주의 깊게 관찰해야 합니다." },
            { id: 73, topic: "소아결핵", q: "만 8세 이하 소아 폐외결핵 환자 발생 시 가족접촉자 조사를 시행하는 주된 목적 (소아 기준 73)", options: ["BCG 이상반응 확인", "집단시설 선제적 차단", "가족 내 숨은 감염원(결핵환자) 파악", "소아 성장 지연 방지"], a: 2, exp: "소아 폐외결핵은 초회 감염일 가능성이 높아 감염원 파악을 위해 조사를 실시합니다." },
            { id: 374, topic: "신부전약제", q: "말기 신부전 투석 환자의 활동성 결핵 치료 시 신장 배설에 따른 약제 투여 간격 조절 원칙이 적용되는 주요 약제 (현장 적용 사례 374)", options: ["스트렙토마이신 단독", "이소니아지드와 리팜핀", "에탐부톨과 피라진아미드 (주 3회 등으로 간격 연장)", "모든 1차 항결핵제 전체"], a: 2, exp: "간 대사인 INH, RIF와 달리, EMB와 PZA는 신장 배설이므로 신부전 환자에서 투여 간격 조절이 필요합니다." },
            { id: 49, topic: "상담", q: "보건소 전담요원의 \'사례상담\'이 필수로 요구되는 취약성 평가 위험도 군 (상담 기준 49)", options: ["저위험군 전체", "고위험군 단독", "중위험군 이상 (중위험군 및 고위험군)", "전염성 환자 전원"], a: 2, exp: "중위험군 이상 환자에게 심층 사례상담이 필수적입니다." },
            { id: 270, topic: "안심벨트", q: "국가결핵관리사업 중 \'결핵 안심벨트 지원사업\'이 간병비나 영양 간식비 등을 지원하는 주된 대상층 (지원 기준 270)", options: ["입원 명령을 받은 외국인 환자 전체", "사회·경제적 취약계층 결핵환자", "모든 다제내성결핵 환자", "만 15세 미만 소아 결핵환자 전원"], a: 1, exp: "결핵 안심벨트 사업은 저소득층 등 취약계층의 치료 성공률 제고를 목적으로 합니다." },
            { id: 62, topic: "우선검사", q: "가족접촉자 전원을 대상으로 활동성 결핵 배제를 위해 가장 먼저 시행하는 검사 (검사 원칙 62)", options: ["인터페론감마 분비검사(IGRA)", "객담 도말검사", "흉부X선 검사", "객담 배양검사"], a: 2, exp: "활동성 배제를 위해 흉부X선 검사가 최우선입니다." },
            { id: 280, topic: "외국인비순응", q: "국내 거주 외국인 결핵환자가 정당한 사유 없이 지속적으로 결핵 치료를 거부(비순응)할 경우, 보건소가 취할 수 있는 행정적 조치 (외국인 기준 280)", options: ["본국 대사관 통보 후 24시간 내 강제 출국 조치", "관할 출입국·외국인관청에 통보하여 체류기간 연장 제한 등 조치 의뢰", "경찰 동행 하에 강제 구인하여 구치소 치료", "내국인과 동일하게 어떠한 제재도 불가"], a: 1, exp: "비순응 외국인 환자에 대해서는 감염병예방법에 근거해 체류 제한 조치를 의뢰할 수 있습니다." },
            { id: 32, topic: "복약확인", q: "전염성 폐결핵 환자의 치료 시작 초기 2주간(전염성 기간) 필수 복약확인 주기 (관리 기준 32)", options: ["월 1회", "주 1회", "주 3회", "매일 확인"], a: 3, exp: "초기 전염성 기간 2주간은 매일 복약을 확인해야 합니다." },

            { id: 128, topic: "전염성기간", q: "집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\' 설정에 영향을 주지 않는 지표 (조사 기준 128)", options: ["기침 증상 발생일", "흉부X선 상 공동(cavity) 유무", "객담 도말 양성 여부", "환자 거주지 또는 근무지의 방 크기 및 환기 상태"], a: 3, exp: "공간 크기나 환기 상태는 전염성 추정 \'기간\' 설정 기준이 아닙니다." },
            { id: 253, topic: "산정특례", q: "결핵환자가 진료비 본인부담금을 면제받기 위한 \'산정특례\'를 확진일 당일부터 소급 적용받으려면 확진일 기준 며칠 이내에 신청해야 하는가? (행정 기준 253)", options: ["확진일로부터 60일 이내", "확진일로부터 7일 이내", "확진일로부터 14일 이내", "확진일로부터 30일 이내 (공휴일 포함)"], a: 3, exp: "산정특례는 확진일로부터 30일 이내 신청 시 확진일로 소급 적용됩니다." },
            { id: 471, topic: "배양기간", q: "결핵균 배양검사 중 전통적인 \'고체 배지\' 방식에서 결핵균 음성을 최종 판정하기까지 소요되는 최대 관찰 기간 (현장 적용 사례 471)", options: ["접종 후 최대 2주간", "접종 후 최대 8주간 지속 관찰", "접종 후 6개월간 지속 배양", "접종 후 3일 이내 신속 판정"], a: 1, exp: "고체 배지는 결핵균 증식이 느려 최대 8주 관찰 후 음성을 판정합니다." },
            { id: 483, topic: "HIV접촉", q: "HIV(에이즈) 감염인이 활동성 결핵환자와 접촉했을 때, 잠복결핵감염 치료를 결정하는 투베르쿨린 피부반응검사(TST) 결절 크기 기준 (현장 적용 사례 483)", options: ["TST 결과와 무관하게 흉부X선만 관찰", "15mm 이상일 경우에만 제한적 치료", "정상 면역자와 동일하게 10mm 이상", "결절 크기 5mm 이상일 경우 양성으로 간주하여 즉시 치료"], a: 3, exp: "면역저하자인 HIV 감염인은 TST 결절이 5mm만 되어도 양성으로 판정합니다." },

            { id: 71, topic: "소아결핵", q: "만 8세 이하 소아 폐외결핵 환자 발생 시 가족접촉자 조사를 시행하는 주된 목적 (소아 기준 71)", options: ["BCG 이상반응 확인", "소아 성장 지연 방지", "집단시설 선제적 차단", "가족 내 숨은 감염원(결핵환자) 파악"], a: 3, exp: "소아 폐외결핵은 초회 감염일 가능성이 높아 감염원 파악을 위해 조사를 실시합니다." },

            { id: 172, topic: "간독성기준", q: "잠복결핵 치료 중 환자에게 위장장애나 황달 증상이 없고 무증상일 때, 약제 투여를 즉시 중단해야 하는 AST/ALT 수치 기준 (중단 기준 172)", options: ["수치와 무관하게 유지", "정상 상한치의 2배 이상 증가 시", "정상 상한치의 5배 이상 증가 시", "정상 상한치의 3배 이상 증가 시"], a: 2, exp: "무증상 간독성은 정상 상한치의 5배 이상일 때 즉각 투약 중단합니다." },
            { id: 275, topic: "외국인비순응", q: "국내 거주 외국인 결핵환자가 정당한 사유 없이 지속적으로 결핵 치료를 거부(비순응)할 경우, 보건소가 취할 수 있는 행정적 조치 (외국인 기준 275)", options: ["관할 출입국·외국인관청에 통보하여 체류기간 연장 제한 등 조치 의뢰", "내국인과 동일하게 어떠한 제재도 불가", "본국 대사관 통보 후 24시간 내 강제 출국 조치", "경찰 동행 하에 강제 구인하여 구치소 치료"], a: 0, exp: "비순응 외국인 환자에 대해서는 감염병예방법에 근거해 체류 제한 조치를 의뢰할 수 있습니다." },
            { id: 328, topic: "HIV접촉", q: "HIV(에이즈) 감염인이 활동성 결핵환자와 접촉했을 때, 잠복결핵감염 치료를 결정하는 투베르쿨린 피부반응검사(TST) 결절 크기 기준 (현장 적용 사례 328)", options: ["TST 결과와 무관하게 흉부X선만 관찰", "정상 면역자와 동일하게 10mm 이상", "15mm 이상일 경우에만 제한적 치료", "결절 크기 5mm 이상일 경우 양성으로 간주하여 즉시 치료"], a: 3, exp: "면역저하자인 HIV 감염인은 TST 결절이 5mm만 되어도 양성으로 판정합니다." },
            { id: 245, topic: "시력저하", q: "결핵 1차 치료제 중 드물게 시력 저하, 시야 결손, 적녹 색맹 등의 시신경염을 유발할 수 있어 주기적 시력 검사가 요구되는 약제 (약제 부작용 245)", options: ["에탐부톨 (EMB)", "피라진아미드 (PZA)", "이소니아지드 (INH)", "리팜핀 (RIF)"], a: 0, exp: "에탐부톨 복용 시 시신경염 부작용 발생 여부를 주의 깊게 관찰해야 합니다." },
            { id: 302, topic: "음압환기", q: "결핵 감염관리를 위해 전염성 폐결핵 환자가 입원하는 음압격리병실의 권장 공기 환기 횟수 (현장 적용 사례 302)", options: ["시간당 30회 이상의 강풍 환기", "시간당 최소 6회 이상 (신축의 경우 12회 이상 권장)", "시간당 최대 2회 미만 (유출 방지)", "하루에 1회 10분 자연 환기"], a: 1, exp: "감염 방지를 위해 음압병실은 시간당 6~12회의 기계적 환기가 필수적입니다." },
            { id: 3, topic: "신고", q: "결핵환자 신고 시 의료기관이 관할 보건소에 신고해야 하는 법적 기한 (상세 규정 3)", options: ["24시간 이내", "지체 없이(발견 즉시)", "7일 이내", "3일 이내"], a: 1, exp: "감염병예방법에 따라 결핵환자 발견 시 지체 없이 신고해야 합니다." },
            { id: 488, topic: "HIV접촉", q: "HIV(에이즈) 감염인이 활동성 결핵환자와 접촉했을 때, 잠복결핵감염 치료를 결정하는 투베르쿨린 피부반응검사(TST) 결절 크기 기준 (현장 적용 사례 488)", options: ["결절 크기 5mm 이상일 경우 양성으로 간주하여 즉시 치료", "TST 결과와 무관하게 흉부X선만 관찰", "15mm 이상일 경우에만 제한적 치료", "정상 면역자와 동일하게 10mm 이상"], a: 0, exp: "면역저하자인 HIV 감염인은 TST 결절이 5mm만 되어도 양성으로 판정합니다." },
            { id: 444, topic: "신부전약제", q: "말기 신부전 투석 환자의 활동성 결핵 치료 시 신장 배설에 따른 약제 투여 간격 조절 원칙이 적용되는 주요 약제 (현장 적용 사례 444)", options: ["모든 1차 항결핵제 전체", "이소니아지드와 리팜핀", "스트렙토마이신 단독", "에탐부톨과 피라진아미드 (주 3회 등으로 간격 연장)"], a: 3, exp: "간 대사인 INH, RIF와 달리, EMB와 PZA는 신장 배설이므로 신부전 환자에서 투여 간격 조절이 필요합니다." },

            { id: 189, topic: "병합검사", q: "잠복결핵 진단을 위해 TST와 IGRA를 모두 시행하는 병합 검사에서, TST 양성이나 IGRA가 음성으로 나왔을 때의 최종 판정 (진단 기준 189)", options: ["양성으로 간주하여 즉시 치료", "최종 음성으로 판정하여 잠복결핵 치료를 시행하지 않음", "흉부X선에 따라 임의 결정", "판정 보류 후 3개월 뒤 재검"], a: 1, exp: "특이도가 높은 IGRA 결과가 음성이면 병합 검사 최종 결과는 음성입니다." },

            { id: 84, topic: "창문기", q: "초회 잠복결핵감염 검사(IGRA/TST)가 음성인 가족접촉자의 2차 검사(창문기 검사) 시기 (추적 기준 84)", options: ["접촉일 6개월 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 후", "접촉일 2~4주 후", "접촉일 4~6주 후"], a: 1, exp: "창문기를 고려하여 8~10주 후 2차 검사를 실시합니다." },
            { id: 165, topic: "간기능모니터링", q: "잠복결핵감염 치료 중 부작용 모니터링을 위한 간기능 검사(AST/ALT)의 기본 권장 주기 (부작용 기준 165)", options: ["치료 시작 후 2주, 4주차 및 이후 매달 1회 정기 검사", "치료 3개월 경과 후 1회 실시", "치료 종료 시점에 최종 확인", "치료 시작 후 1주차 1회만 실시"], a: 0, exp: "초기 2주, 4주차 확인 후 매달 간기능을 모니터링해야 합니다." },

            { id: 461, topic: "배양기간", q: "결핵균 배양검사 중 전통적인 \'고체 배지\' 방식에서 결핵균 음성을 최종 판정하기까지 소요되는 최대 관찰 기간 (현장 적용 사례 461)", options: ["접종 후 최대 8주간 지속 관찰", "접종 후 6개월간 지속 배양", "접종 후 3일 이내 신속 판정", "접종 후 최대 2주간"], a: 0, exp: "고체 배지는 결핵균 증식이 느려 최대 8주 관찰 후 음성을 판정합니다." },
            { id: 232, topic: "체액변색", q: "결핵 1차 치료제 중 복용 시 소변, 눈물, 땀 등의 체액을 오렌지색(붉은색)으로 변하게 하여 환자 사전 교육이 필수적인 약제 (약제 부작용 232)", options: ["에탐부톨 (EMB)", "이소니아지드 (INH)", "피라진아미드 (PZA)", "리팜핀 (RIF)"], a: 3, exp: "리팜핀은 체액을 오렌지색으로 물들이는 특징이 있습니다." },
            { id: 209, topic: "다제내성정의", q: "국가결핵관리지침 상 \'다제내성결핵(MDR-TB)\'으로 확진 내리기 위한 1차 항결핵제 핵심 약제 내성 조건 (내성 기준 209)", options: ["리팜핀 단독 내성", "피라진아미드 단독 내성", "퀴놀론계 및 주사제 동시 내성", "이소니아지드(INH)와 리팜핀(RIF) 두 가지 약제에 동시 내성"], a: 3, exp: "MDR-TB는 INH와 RIF에 동시 내성인 경우를 의미합니다." },
            { id: 99, topic: "임산부", q: "임산부 가족접촉자가 방사선 노출을 우려하여 흉부X선 검사를 거부할 때 보건소의 올바른 대처 (특수상황 99)", options: ["X선 대신 즉각 약제 투여", "도말검사로 대체", "납치마(차폐복) 착용 하에 안전하게 검사받도록 권고", "출산 후로 검사 유예"], a: 2, exp: "임산부라도 납치마를 착용하면 안전하게 X선 검사가 가능함을 교육해야 합니다." },
            { id: 157, topic: "활동성배제", q: "잠복결핵감염 치료 시작 전 활동성 결핵을 완벽히 배제해야 하는 가장 핵심적인 의학적 이유 (치료 원칙 157)", options: ["환자 복약 거부감 해소", "급성 간독성 예방", "활동성 결핵 상태에서 1~2제 약제만 사용할 경우 결핵균이 내성을 획득할 위험이 크기 때문", "치료비 과다 청구 방지"], a: 2, exp: "활동성 배제 없이 잠복결핵 약제로만 치료하면 내성결핵 유발 위험이 높습니다." },
            { id: 174, topic: "간독성기준", q: "잠복결핵 치료 중 환자에게 위장장애나 황달 증상이 없고 무증상일 때, 약제 투여를 즉시 중단해야 하는 AST/ALT 수치 기준 (중단 기준 174)", options: ["정상 상한치의 3배 이상 증가 시", "정상 상한치의 2배 이상 증가 시", "수치와 무관하게 유지", "정상 상한치의 5배 이상 증가 시"], a: 3, exp: "무증상 간독성은 정상 상한치의 5배 이상일 때 즉각 투약 중단합니다." },
            { id: 382, topic: "음압환기", q: "결핵 감염관리를 위해 전염성 폐결핵 환자가 입원하는 음압격리병실의 권장 공기 환기 횟수 (현장 적용 사례 382)", options: ["시간당 30회 이상의 강풍 환기", "시간당 최소 6회 이상 (신축의 경우 12회 이상 권장)", "하루에 1회 10분 자연 환기", "시간당 최대 2회 미만 (유출 방지)"], a: 1, exp: "감염 방지를 위해 음압병실은 시간당 6~12회의 기계적 환기가 필수적입니다." },
            { id: 290, topic: "전출이관", q: "치료 중인 결핵환자나 잠복결핵감염자가 타 지역으로 거주지를 이전(전출)할 때 보건소 담당자가 취해야 할 조치 (관리 기준 290)", options: ["이사한 즉시 치료 중단 후 신규 진단 안내", "신규 거주지 관할 보건소로 환자 관리 기관을 시스템 상 이관 처리", "산정특례 취소 후 일반 건보 전환", "기존 보건소에서 치료 종료 시까지 무조건 원격 관리"], a: 1, exp: "전출 시 치료 단절 방지를 위해 신규 보건소로 신속히 이관 처리해야 합니다." },

        const STORAGE_KEY = 'tb_quiz_final_500_v15_pure';

        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');

        const resetHistoryBtn = document.getElementById('reset-history-btn');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            wrongQuestions = [];
            let askedIds = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            // 아직 출제되지 않은 문제들만 필터링
            let available = questionBank.filter(q => !askedIds.includes(q.id));
            shuffle(available);
            
            let selected = [];
            let usedTopics = new Set();
            let usedAnswers = new Set();
            
            // 1. 이미 출제된 ID 제외 (위에서 필터링됨)
            // 2. 현재 10문제 세트 안에서 '주제(Topic)'가 중복되지 않도록 필터링
            // 3. 현재 10문제 세트 안에서 '정답 텍스트'가 중복되지 않도록 필터링
            for (let q of available) {
                let correctAnswerText = q.options[q.a];
                
                if (!usedTopics.has(q.topic) && !usedAnswers.has(correctAnswerText)) {
                    selected.push(q);
                    usedTopics.add(q.topic);
                    usedAnswers.add(correctAnswerText);
                }
                if (selected.length === QUESTIONS_PER_QUIZ) break;
            }

            // 만약 남은 문제들로 완전히 독립적인 10문제를 구성할 수 없다면, 기록 초기화 후 다시 뽑기
            if (selected.length < QUESTIONS_PER_QUIZ) {
                askedIds = [];
                available = [...questionBank];
                shuffle(available);
                
                selected = [];
                usedTopics = new Set();
                usedAnswers = new Set();
                
                for (let q of available) {
                    let correctAnswerText = q.options[q.a];
                    if (!usedTopics.has(q.topic) && !usedAnswers.has(correctAnswerText)) {
                        selected.push(q);
                        usedTopics.add(q.topic);
                        usedAnswers.add(correctAnswerText);
                    }
                    if (selected.length === QUESTIONS_PER_QUIZ) break;
                }
                alert("남은 문제들로는 중복 없는 10문제를 구성할 수 없어, 출제 기록이 자동 초기화되었습니다. (처음부터 다시 시작합니다.)");
            }
            
            currentQuiz = selected;
            
            // 뽑힌 10문제의 ID를 로컬스토리지에 저장하여 다음 번에 나오지 않도록 함
            askedIds = [...askedIds, ...currentQuiz.map(q => q.id)];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(askedIds));

            currentQuestionIndex = 0;
            score = 0;
        }

        function displayQuestion() {
            isAnswered = false;
            selectedOptionIndex = null;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-counter').innerText = `문제 ${currentQuestionIndex + 1} / ${QUESTIONS_PER_QUIZ}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / QUESTIONS_PER_QUIZ) * 100}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:bg-slate-50 focus:outline-none text-slate-700 font-medium transition-colors text-base md:text-lg';
                btn.innerText = optText;
                btn.onclick = () => {
                    if (isAnswered) return;
                    selectedOptionIndex = index;
                    Array.from(optionsContainer.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer() {
            if (selectedOptionIndex === null) {
                alert("정답을 선택해주세요.");
                return;
            }
            
            isAnswered = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;
            
            let isCorrect = false;

            for (let i = 0; i < buttons.length; i++) {
                if (i === q.a) {
                    buttons[i].classList.add('correct');
                    if (i === selectedOptionIndex) {
                        isCorrect = true;
                        score += 10;
                    }
                } else if (i === selectedOptionIndex) {
                    buttons[i].classList.add('incorrect');
                }
            }

            if (!isCorrect) {
                wrongQuestions.push({
                    question: q.q,
                    myAnswer: q.options[selectedOptionIndex],
                    correctAnswer: q.options[q.a],
                    explanation: q.exp
                });
            }

            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_QUIZ) * 100}%`;
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;

            const wrongListContainer = document.getElementById('wrong-list');
            wrongListContainer.innerHTML = '';
            
            if (wrongQuestions.length === 0) {
                wrongListContainer.innerHTML = '<li class="text-emerald-700 font-extrabold text-center py-8 bg-emerald-50 rounded-2xl border-2 border-emerald-200 text-xl">🎉 완벽합니다! 모든 문제를 맞히셨습니다.</li>';
            } else {
                wrongQuestions.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = "bg-rose-50 p-6 rounded-2xl border border-rose-200 shadow-sm";
                    li.innerHTML = `

                        <div class="space-y-3 mb-4">

                            <p class="text-sm md:text-base text-blue-700 flex items-start"><span class="font-black w-24 shrink-0 px-2 py-1 bg-blue-100 rounded mr-2 text-center">실제 정답</span> <span>${item.correctAnswer}</span></p>
                        </div>
                        <div class="text-sm md:text-base text-slate-700 bg-white p-4 rounded-xl border border-rose-100 flex items-start shadow-inner mt-2">
                            <span class="font-black text-amber-600 w-12 shrink-0 pt-0.5">해설</span> 
                            <span class="font-medium">${item.explanation}</span>
                        </div>
                    `;
                    wrongListContainer.appendChild(li);
                });
            }
        }

        startBtn.addEventListener('click', () => {
            initQuiz();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            displayQuestion();
        });

        submitBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_QUIZ) {
                displayQuestion();
            } else {
                showResults();
            }
        });

            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("모든 문제 출제 기록을 완전히 초기화하시겠습니까? (기록 삭제 후 새로운 10문제가 무작위 출제됩니다.)")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("기록 초기화 완료되었습니다.");
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
