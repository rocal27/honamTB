<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn.selected { background-color: #dbeafe; border-color: #3b82f6; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .quiz-container { min-height: 400px; }
    </style>
</head>
<body class="text-gray-800">
    <div class="max-w-3xl mx-auto p-4 md:p-8 mt-10 bg-white rounded-xl shadow-lg quiz-container">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">2026 국가결핵관리지침 퀴즈</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">500개의 독립 데이터베이스에서 10문제씩 랜덤 출제됩니다.</p>
        
        <div id="start-screen" class="text-center py-12 flex flex-col items-center justify-center">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition-transform transform hover:scale-105 text-lg">
                퀴즈 시작하기
            </button>
            <div class="mt-6 text-sm text-blue-600 font-medium bg-blue-50 inline-block px-4 py-2 rounded-lg shadow-sm">
                호남권질병대응센터 감염병대응과
            </div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-4 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-500" id="question-counter">문제 1 / 10</span>
                <div class="w-2/3 bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" id="progress-bar" style="width: 10%"></div>
                </div>
            </div>
            
            <div id="question-container" class="mb-6">
                <h2 class="text-xl font-bold mb-5 leading-relaxed" id="question-text">문제 내용</h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-container" class="hidden p-5 mb-6 bg-yellow-50 border border-yellow-200 rounded-lg shadow-sm">
                <p class="font-bold text-yellow-800 mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                    해설 및 지침 근거
                </p>
                <p id="explanation-text" class="text-gray-700 text-sm leading-relaxed"></p>
            </div>

            <div class="flex justify-end mt-4">
                <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition">다음 문제 ➔</button>
                <button id="submit-btn" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition">정답 확인</button>
            </div>
        </div>

        <div id="result-screen" class="hidden py-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold mb-4 text-gray-800">퀴즈 완료!</h2>
                <div class="inline-block bg-blue-50 px-8 py-4 rounded-xl border border-blue-100">
                    <p class="text-lg text-gray-600 mb-1">당신의 점수는</p>
                    <p class="text-4xl font-extrabold text-blue-600"><span id="score-text"></span>점</p>
                </div>
            </div>
            
            <div id="wrong-summary-container" class="mb-10">
                <h3 class="text-xl font-bold text-red-600 mb-4 border-b-2 border-red-100 pb-2 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    틀린 문제 요약 (오답 노트)
                </h3>
                <ul id="wrong-list" class="space-y-4"></ul>
            </div>

            <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md w-full sm:w-auto">
                    새로운 10문제 풀기
                </button>
                <button id="reset-history-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-8 rounded-lg shadow-md w-full sm:w-auto">
                    전체 출제 기록 초기화
                </button>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            { id: 46, baseId: 3, q: "잠복결핵감염 치료를 받고 있는 40대 환자가 간기능 검사 결과 AST/ALT 수치가 정상 상한치의 5배로 측정되었다. 현재 환자가 증상이 전혀 없을 때면, 의료진이 취해야 할 올바른 조치는? (케이스 2)", options: ["어떤 상황이든 1차 결핵약을 모두 2차 약제로 즉각 변경한다.", "간 보호제만 처방하고 기존 결핵약 용량을 2배로 증량한다.", "부작용 신고 없이 환자 스스로 복약을 2주간 중단하도록 지시한다.", "간수치가 정상의 5배 이상이므로 약을 중단한다."], a: 3, exp: "잠복결핵 치료 중 AST/ALT가 증상 동반 시 3배 이상, 무증상 시 5배 이상이면 약제를 중단해야 합니다." },
            { id: 122, baseId: 6, q: "어린이집 교사로 근무하는 환자가 도말 양성 폐결핵으로 진단되었다. 관할 보건소장이 감염병예방법에 따라 환자와 소속 기관장에게 즉각 발급해야 하는 서류는 무엇인가? (행정 16)", options: ["업무종사 및 등교 일시 제한 대상자 통보서", "방역 수칙 위반에 따른 과태료 부과 사전 통지서", "결핵환자 강제 입원 및 격리 명령서", "해당 어린이집 즉각 폐쇄 명령서"], a: 0, exp: "집단시설 종사자가 전염성 결핵으로 확인된 경우, 타인과의 접촉을 차단하기 위해 업무종사 일시 제한 통보서를 발급합니다." },
            { id: 412, baseId: 18, q: "감염병 관리 시스템 운영 지침에 의하면, 집단시설 결핵역학조사 시 \'밀접접촉자\'를 산정할 때, 하루 연속 몇 시간 이상 접촉한 사람을 기준으로 하는가? (무작위 문항 151)", options: ["8시간 이상", "24시간 이상", "12시간 이상", "4시간 이상"], a: 0, exp: "밀접접촉자는 하루 연속 8시간 이상 또는 누적 40시간 이상 접촉자를 의미합니다." },
            { id: 14, baseId: 1, q: "전염성 폐결핵 환자와 밀접하게 접촉한 35세 직장인이 보건소에 방문하였다. 이 접촉자의 잠복결핵감염 진단을 위해 가장 먼저 실시하거나 고려해야 할 조치로 옳은 것은? (사례 2)", options: ["흉부X선 및 IGRA 시행", "연령과 무관하게 객담 배양검사를 3회 실시한다.", "접촉일로부터 6개월이 경과할 때까지 아무런 검사 없이 경과를 관찰한다.", "즉시 리팜핀 4개월 요법(4R)을 시작한다."], a: 0, exp: "연령별 잠복결핵 진단 알고리즘에 따라 성인의 경우 흉부X선 및 IGRA 시행하는 것이 원칙입니다. 단 모든 연령에서 활동성 결핵 배제를 위한 흉부X선이 우선 또는 동시 시행됩니다." },
            { id: 160, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 38점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 9)", options: ["저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다.", "고위험군으로 분류되며, 사례상담 필수 진행 및 주 4~5회 철저한 복약 확인을 실시한다.", "초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다."], a: 1, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 413, baseId: 19, q: "2026년도 개정 지침을 적용할 때, 집단시설 현장조사를 완료한 후, \'결핵역학조사 현장조사서\'는 근무일 기준 며칠 이내에 질병보건통합관리시스템에 등록해야 하는가? (무작위 문항 152)", options: ["3일 이내", "7일 이내", "당일 이내", "14일 이내"], a: 0, exp: "현장조사서는 근무일 기준 3일 이내에 신속히 시스템에 등록해야 합니다." },
            { id: 336, baseId: 14, q: "역학조사관 교육 자료에 따르면, 결핵 \'안심벨트 지원사업\'은 주로 어떤 환자의 간병비나 이송비를 지원하기 위함인가? (무작위 문항 75)", options: ["모든 다제내성결핵 환자", "15세 미만 소아 결핵환자 전원", "입원 명령을 받은 모든 외국인 환자", "사회·경제적 취약계층 결핵환자"], a: 3, exp: "안심벨트 사업은 취약계층의 치료 성공률을 높이기 위한 재정 지원 사업입니다." },
            { id: 352, baseId: 12, q: "감염병 관리 시스템 운영 지침에 의하면, 가족접촉자 조사의 대상 기간은 호흡기 결핵 환자의 진단일 기준 언제부터 치료 시작 후 2주까지인가? (무작위 문항 91)", options: ["1년 전부터", "6개월 전부터", "3개월 전부터", "1개월 전부터"], a: 2, exp: "진단일 기준 3개월 전부터입니다." },
            { id: 382, baseId: 15, q: "감염병 관리 시스템 운영 지침에 의하면, 외국인 결핵환자가 정당한 이유 없이 약 복용을 지속적으로 거부(비순응)할 경우, 감염병예방법에 따라 보건소가 조치할 수 있는 행정 절차는? (무작위 문항 121)", options: ["경찰 동행 하에 강제 구인하여 구치소 내 치료", "출입국관서에 통보하여 체류기간 연장 제한 등의 조치 의뢰", "어떠한 법적 제재도 불가능하므로 자율에 맡김", "본국 대사관 통보 후 24시간 내 강제 출국 조치"], a: 1, exp: "비순응 외국인 환자에 대해서는 출입국관리법 등과 연계하여 체류 제한 조치를 취할 수 있습니다." },
            { id: 81, baseId: 4, q: "관내 콜센터에서 근무하는 종사자가 전염성 폐결핵으로 확진되어 신고되었다. 보건소 역학조사반은 신고를 접수한 후 며칠 이내에 현장조사에 착수(질병보건통합관리시스템 등록 포함)해야 하는가? (기록 5)", options: ["근무일 기준 14일 이내", "근무일 기준 3일 이내", "신고 당일 자정까지", "근무일 기준 7일 이내"], a: 1, exp: "집단시설 결핵 발생 시 보건소는 신고일로부터 근무일 기준 3일 이내에 현장조사를 실시하고 시스템에 등록해야 합니다." },
            { id: 230, baseId: 10, q: "잠복결핵감염 치료를 1개월째 성실히 받고 있던 환자가 직장 발령으로 타 지역으로 이사를 가게 되었다고 보건소에 통보했다. 담당자가 시스템에서 취해야 할 가장 올바른 행정 조치는? (전출관리 14)", options: ["산정특례를 취소하고 일반 건강보험 청구 대상으로 전환시킨다.", "치료를 일단 중단시키고 이사 간 지역에서 처음부터 다시 진단을 받도록 안내한다.", "기존 보건소에서 치료 종료 시까지 전적으로 원격 관리만 진행한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리하여 치료가 연계되도록 한다."], a: 3, exp: "환자가 거주지를 이동할 경우 치료 단절을 막기 위해 신규 관할 보건소 및 의료기관으로 이관 처리를 해야 합니다." },
            { id: 370, baseId: 12, q: "2026년도 개정 지침을 적용할 때, 가족접촉자 조사의 대상 기간은 호흡기 결핵 환자의 진단일 기준 언제부터 치료 시작 후 2주까지인가? (무작위 문항 109)", options: ["3개월 전부터", "1년 전부터", "1개월 전부터", "6개월 전부터"], a: 0, exp: "진단일 기준 3개월 전부터입니다." },
            { id: 341, baseId: 19, q: "2026년도 개정 지침을 적용할 때, 집단시설 현장조사를 완료한 후, \'결핵역학조사 현장조사서\'는 근무일 기준 며칠 이내에 질병보건통합관리시스템에 등록해야 하는가? (무작위 문항 80)", options: ["7일 이내", "14일 이내", "3일 이내", "당일 이내"], a: 2, exp: "현장조사서는 근무일 기준 3일 이내에 신속히 시스템에 등록해야 합니다." },
            { id: 192, baseId: 9, q: "결핵 진단을 받은 환자가 진료비 본인부담금을 면제받는 \'결핵질환 산정특례\' 제도를 이용하려 한다. 확진일로부터 소급하여 특례 적용을 받기 위해 국민건강보험공단에 신청서를 제출해야 하는 법정 기한은 언제까지인가? (행정절차 6)", options: ["확진일로부터 14일 이내 (공휴일 포함)", "확진일로부터 30일 이내 (공휴일 포함)", "확진일로부터 60일 이내 (영업일 기준)", "확진일로부터 7일 이내 (영업일 기준)"], a: 1, exp: "결핵 산정특례는 확진일로부터 30일 이내에 신청해야 확진일 당일부터 소급하여 진료비 혜택을 받을 수 있습니다." },
            { id: 67, baseId: 4, q: "관내 의료기관 신생아실에서 근무하는 종사자가 전염성 폐결핵으로 확진되어 신고되었다. 보건소 역학조사반은 신고를 접수한 후 며칠 이내에 현장조사에 착수(질병보건통합관리시스템 등록 포함)해야 하는가? (기록 1)", options: ["신고 당일 자정까지", "근무일 기준 3일 이내", "근무일 기준 7일 이내", "근무일 기준 14일 이내"], a: 1, exp: "집단시설 결핵 발생 시 보건소는 신고일로부터 근무일 기준 3일 이내에 현장조사를 실시하고 시스템에 등록해야 합니다." },

            { id: 34, baseId: 2, q: "잠복결핵감염으로 진단된 환자의 지표환자(감염원)가 모든 약제에 감수성 결핵으로 최종 확인되었다. 이 잠복결핵감염자에게 권고되는 치료 요법으로 가장 적절한 것은? (상황 2)", options: ["이소니아지드 9개월(9H) 요법을 무조건적으로 시행한다.", "피라진아미드와 에탐부톨을 병합하여 2개월간 투여한다.", "치료를 전면 보류하고 2년간 흉부X선만 추적 관찰한다.", "이소니아지드/리팜핀 3개월(3HR) 또는 이소니아지드 9개월(9H) 등을 시행한다."], a: 3, exp: "지표환자의 약제감수성 결과가 모든 약제에 감수성인 경우, 지침상 이소니아지드/리팜핀 3개월(3HR) 또는 이소니아지드 9개월(9H) 등을 시행한다.는 것이 권장됩니다." },

            { id: 2, baseId: 1, q: "전염성 폐결핵 환자와 밀접하게 접촉한 생후 3주 신생아가 보건소에 방문하였다. 이 접촉자의 잠복결핵감염 진단을 위해 가장 먼저 실시하거나 고려해야 할 조치로 옳은 것은? (사례 2)", options: ["생후 3개월 이후 TST 시행 시까지 이소니아지드 선제 투여", "즉시 리팜핀 4개월 요법(4R)을 시작한다.", "연령과 무관하게 객담 배양검사를 3회 실시한다.", "접촉일로부터 6개월이 경과할 때까지 아무런 검사 없이 경과를 관찰한다."], a: 0, exp: "연령별 잠복결핵 진단 알고리즘에 따라 신생아의 경우 생후 3개월 이후 TST 시행 시까지 이소니아지드 선제 투여하는 것이 원칙입니다. 단 모든 연령에서 활동성 결핵 배제를 위한 흉부X선이 우선 또는 동시 시행됩니다." },

            { id: 467, baseId: 19, q: "감염병 관리 시스템 운영 지침에 의하면, 집단시설 현장조사를 완료한 후, \'결핵역학조사 현장조사서\'는 근무일 기준 며칠 이내에 질병보건통합관리시스템에 등록해야 하는가? (무작위 문항 206)", options: ["14일 이내", "7일 이내", "3일 이내", "당일 이내"], a: 2, exp: "현장조사서는 근무일 기준 3일 이내에 신속히 시스템에 등록해야 합니다." },
            { id: 471, baseId: 14, q: "보건소 결핵실 대응 상황에서, 결핵 \'안심벨트 지원사업\'은 주로 어떤 환자의 간병비나 이송비를 지원하기 위함인가? (무작위 문항 210)", options: ["모든 다제내성결핵 환자", "15세 미만 소아 결핵환자 전원", "사회·경제적 취약계층 결핵환자", "입원 명령을 받은 모든 외국인 환자"], a: 2, exp: "안심벨트 사업은 취약계층의 치료 성공률을 높이기 위한 재정 지원 사업입니다." },
            { id: 387, baseId: 20, q: "2026년도 개정 지침을 적용할 때, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 126)", options: ["최근 3개월 이내 인플루엔자 백신", "최근 2주 이내 코로나19 백신", "최근 4주 이내 사백신 접종", "최근 4주 이내 생백신 접종"], a: 3, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },
            { id: 51, baseId: 3, q: "잠복결핵감염 치료를 받고 있는 40대 환자가 간기능 검사 결과 AST/ALT 수치가 정상 상한치의 2배로 측정되었다. 현재 환자가 가벼운 피로감만 있을 때면, 의료진이 취해야 할 올바른 조치는? (케이스 1)", options: ["간 보호제만 처방하고 기존 결핵약 용량을 2배로 증량한다.", "약제를 유지하며 간기능을 주의 깊게 모니터링한다.", "어떤 상황이든 1차 결핵약을 모두 2차 약제로 즉각 변경한다.", "부작용 신고 없이 환자 스스로 복약을 2주간 중단하도록 지시한다."], a: 1, exp: "잠복결핵 치료 중 AST/ALT가 증상 동반 시 3배 이상, 무증상 시 5배 이상이면 약제를 중단해야 합니다." },
            { id: 33, baseId: 2, q: "잠복결핵감염으로 진단된 환자의 지표환자(감염원)가 모든 약제에 감수성 결핵으로 최종 확인되었다. 이 잠복결핵감염자에게 권고되는 치료 요법으로 가장 적절한 것은? (상황 1)", options: ["이소니아지드/리팜핀 3개월(3HR) 또는 이소니아지드 9개월(9H) 등을 시행한다.", "피라진아미드와 에탐부톨을 병합하여 2개월간 투여한다.", "치료를 전면 보류하고 2년간 흉부X선만 추적 관찰한다.", "이소니아지드 9개월(9H) 요법을 무조건적으로 시행한다."], a: 0, exp: "지표환자의 약제감수성 결과가 모든 약제에 감수성인 경우, 지침상 이소니아지드/리팜핀 3개월(3HR) 또는 이소니아지드 9개월(9H) 등을 시행한다.는 것이 권장됩니다." },
            { id: 159, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 38점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 8)", options: ["위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "고위험군으로 분류되며, 사례상담 필수 진행 및 주 4~5회 철저한 복약 확인을 실시한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다."], a: 2, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },

            { id: 460, baseId: 12, q: "결핵 관리 실무 지침상, 가족접촉자 조사의 대상 기간은 호흡기 결핵 환자의 진단일 기준 언제부터 치료 시작 후 2주까지인가? (무작위 문항 199)", options: ["3개월 전부터", "1년 전부터", "6개월 전부터", "1개월 전부터"], a: 0, exp: "진단일 기준 3개월 전부터입니다." },
            { id: 208, baseId: 9, q: "결핵 진단을 받은 환자가 진료비 본인부담금을 면제받는 \'결핵질환 산정특례\' 제도를 이용하려 한다. 확진일로부터 소급하여 특례 적용을 받기 위해 국민건강보험공단에 신청서를 제출해야 하는 법정 기한은 언제까지인가? (행정절차 22)", options: ["확진일로부터 60일 이내 (영업일 기준)", "확진일로부터 30일 이내 (공휴일 포함)", "확진일로부터 7일 이내 (영업일 기준)", "확진일로부터 14일 이내 (공휴일 포함)"], a: 1, exp: "결핵 산정특례는 확진일로부터 30일 이내에 신청해야 확진일 당일부터 소급하여 진료비 혜택을 받을 수 있습니다." },

            { id: 254, baseId: 11, q: "영유아(5세 미만)가 결핵으로 진단되어 보건소에서 감염원 조사를 실시하려 한다. 이때 해당 결핵이 일반 결핵인지, 예방접종 이상반응인 \'M. bovis BCG 감염\'인지 정확히 감별하기 위해 질병관리청에 의뢰해야 하는 검사는 무엇인가? (감별 13)", options: ["결핵균 유전형 검사", "인터페론감마 분비검사(IGRA)", "단순 항산균 도말 및 배양검사", "HIV 항체 및 면역결핍 혈액 검사"], a: 0, exp: "영유아의 결핵 진단 시 BCG 균주에 의한 발병 여부를 감별하기 위해 유전형 검사를 의뢰하는 것이 원칙입니다." },
            { id: 238, baseId: 10, q: "잠복결핵감염 치료를 1개월째 성실히 받고 있던 환자가 직장 발령으로 타 지역으로 이사를 가게 되었다고 보건소에 통보했다. 담당자가 시스템에서 취해야 할 가장 올바른 행정 조치는? (전출관리 22)", options: ["치료를 일단 중단시키고 이사 간 지역에서 처음부터 다시 진단을 받도록 안내한다.", "산정특례를 취소하고 일반 건강보험 청구 대상으로 전환시킨다.", "기존 보건소에서 치료 종료 시까지 전적으로 원격 관리만 진행한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리하여 치료가 연계되도록 한다."], a: 3, exp: "환자가 거주지를 이동할 경우 치료 단절을 막기 위해 신규 관할 보건소 및 의료기관으로 이관 처리를 해야 합니다." },
            { id: 99, baseId: 5, q: "집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정하려고 한다. 이때 역학조사관이 기준점(시작점)을 정하기 위해 확인해야 하는 핵심 지표가 아닌 것은? (평가 18)", options: ["객담 도말검사 및 배양검사 결과 (양성 여부)", "흉부X선 상 공동(cavity)의 유무", "환자 거주지의 방 크기 및 환기 상태", "결핵 관련 임상 증상(기침 등)의 발생 시기"], a: 2, exp: "전염성 추정 기간은 증상 발생일, 도말검사 결과, 공동 유무에 따라 결정되며, 거주지 면적은 전염성 추정 \'기간\' 산정 기준이 아닙니다." },

            { id: 366, baseId: 17, q: "감염병 관리 시스템 운영 지침에 의하면, TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 최종 잠복결핵감염 판정은 어떻게 내리는가? (무작위 문항 105)", options: ["음성으로 판정하여 치료를 시행하지 않는다.", "양성으로 판정하여 치료를 시작한다.", "결과 불일치로 객담 배양검사를 의뢰한다.", "판정 보류로 3개월 뒤 TST를 다시 시행한다."], a: 0, exp: "특이도가 높은 IGRA 결과가 음성이면 최종적으로 음성 판정합니다." },
            { id: 65, baseId: 4, q: "관내 고등학교에서 근무하는 종사자가 전염성 폐결핵으로 확진되어 신고되었다. 보건소 역학조사반은 신고를 접수한 후 며칠 이내에 현장조사에 착수(질병보건통합관리시스템 등록 포함)해야 하는가? (기록 4)", options: ["신고 당일 자정까지", "근무일 기준 14일 이내", "근무일 기준 3일 이내", "근무일 기준 7일 이내"], a: 2, exp: "집단시설 결핵 발생 시 보건소는 신고일로부터 근무일 기준 3일 이내에 현장조사를 실시하고 시스템에 등록해야 합니다." },
            { id: 451, baseId: 12, q: "감염병 관리 시스템 운영 지침에 의하면, 가족접촉자 조사의 대상 기간은 호흡기 결핵 환자의 진단일 기준 언제부터 치료 시작 후 2주까지인가? (무작위 문항 190)", options: ["1개월 전부터", "3개월 전부터", "6개월 전부터", "1년 전부터"], a: 1, exp: "진단일 기준 3개월 전부터입니다." },
            { id: 135, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 12점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 4)", options: ["초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "저위험군으로 분류되며, 월 1~2회 외래 중심으로 규칙적인 복약 여부 확인을 실시한다.", "위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다."], a: 1, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 389, baseId: 13, q: "결핵 관리 실무 지침상, 임산부인 결핵 접촉자가 흉부X선 검사를 꺼려할 때 올바른 설명은? (무작위 문항 128)", options: ["출산 시까지 무조건 검사를 유예한다.", "납치마를 착용하면 태아 방사선 피폭 위험이 거의 없어 검사 가능함을 안내한다.", "즉각적인 치료 약제를 투여한다.", "X선 대신 IGRA만 시행하고 종료한다."], a: 1, exp: "납치마 착용 하에 안전하게 검사 가능함을 교육해야 합니다." },
            { id: 188, baseId: 9, q: "결핵 진단을 받은 환자가 진료비 본인부담금을 면제받는 \'결핵질환 산정특례\' 제도를 이용하려 한다. 확진일로부터 소급하여 특례 적용을 받기 위해 국민건강보험공단에 신청서를 제출해야 하는 법정 기한은 언제까지인가? (행정절차 2)", options: ["확진일로부터 30일 이내 (공휴일 포함)", "확진일로부터 14일 이내 (공휴일 포함)", "확진일로부터 60일 이내 (영업일 기준)", "확진일로부터 7일 이내 (영업일 기준)"], a: 0, exp: "결핵 산정특례는 확진일로부터 30일 이내에 신청해야 확진일 당일부터 소급하여 진료비 혜택을 받을 수 있습니다." },
            { id: 6, baseId: 1, q: "전염성 폐결핵 환자와 밀접하게 접촉한 만 3세 소아가 보건소에 방문하였다. 이 접촉자의 잠복결핵감염 진단을 위해 가장 먼저 실시하거나 고려해야 할 조치로 옳은 것은? (사례 2)", options: ["즉시 리팜핀 4개월 요법(4R)을 시작한다.", "연령과 무관하게 객담 배양검사를 3회 실시한다.", "접촉일로부터 6개월이 경과할 때까지 아무런 검사 없이 경과를 관찰한다.", "흉부X선 및 TST(또는 IGRA) 시행"], a: 3, exp: "연령별 잠복결핵 진단 알고리즘에 따라 소아의 경우 흉부X선 및 TST(또는 IGRA) 시행하는 것이 원칙입니다. 단 모든 연령에서 활동성 결핵 배제를 위한 흉부X선이 우선 또는 동시 시행됩니다." },
            { id: 498, baseId: 14, q: "2026년도 개정 지침을 적용할 때, 결핵 \'안심벨트 지원사업\'은 주로 어떤 환자의 간병비나 이송비를 지원하기 위함인가? (무작위 문항 237)", options: ["입원 명령을 받은 모든 외국인 환자", "모든 다제내성결핵 환자", "사회·경제적 취약계층 결핵환자", "15세 미만 소아 결핵환자 전원"], a: 2, exp: "안심벨트 사업은 취약계층의 치료 성공률을 높이기 위한 재정 지원 사업입니다." },

            { id: 17, baseId: 1, q: "전염성 폐결핵 환자와 밀접하게 접촉한 70세 어르신이 보건소에 방문하였다. 이 접촉자의 잠복결핵감염 진단을 위해 가장 먼저 실시하거나 고려해야 할 조치로 옳은 것은? (사례 1)", options: ["흉부X선 및 IGRA 시행 (치료 시 4R 우선 고려)", "연령과 무관하게 객담 배양검사를 3회 실시한다.", "접촉일로부터 6개월이 경과할 때까지 아무런 검사 없이 경과를 관찰한다.", "즉시 리팜핀 4개월 요법(4R)을 시작한다."], a: 0, exp: "연령별 잠복결핵 진단 알고리즘에 따라 노인의 경우 흉부X선 및 IGRA 시행 (치료 시 4R 우선 고려)하는 것이 원칙입니다. 단 모든 연령에서 활동성 결핵 배제를 위한 흉부X선이 우선 또는 동시 시행됩니다." },
            { id: 54, baseId: 3, q: "잠복결핵감염 치료를 받고 있는 40대 환자가 간기능 검사 결과 AST/ALT 수치가 정상 상한치의 2배로 측정되었다. 현재 환자가 가벼운 피로감만 있을 때면, 의료진이 취해야 할 올바른 조치는? (케이스 4)", options: ["약제를 유지하며 간기능을 주의 깊게 모니터링한다.", "간 보호제만 처방하고 기존 결핵약 용량을 2배로 증량한다.", "어떤 상황이든 1차 결핵약을 모두 2차 약제로 즉각 변경한다.", "부작용 신고 없이 환자 스스로 복약을 2주간 중단하도록 지시한다."], a: 0, exp: "잠복결핵 치료 중 AST/ALT가 증상 동반 시 3배 이상, 무증상 시 5배 이상이면 약제를 중단해야 합니다." },
            { id: 418, baseId: 15, q: "감염병 관리 시스템 운영 지침에 의하면, 외국인 결핵환자가 정당한 이유 없이 약 복용을 지속적으로 거부(비순응)할 경우, 감염병예방법에 따라 보건소가 조치할 수 있는 행정 절차는? (무작위 문항 157)", options: ["출입국관서에 통보하여 체류기간 연장 제한 등의 조치 의뢰", "경찰 동행 하에 강제 구인하여 구치소 내 치료", "본국 대사관 통보 후 24시간 내 강제 출국 조치", "어떠한 법적 제재도 불가능하므로 자율에 맡김"], a: 0, exp: "비순응 외국인 환자에 대해서는 출입국관리법 등과 연계하여 체류 제한 조치를 취할 수 있습니다." },
            { id: 322, baseId: 18, q: "역학조사관 교육 자료에 따르면, 집단시설 결핵역학조사 시 \'밀접접촉자\'를 산정할 때, 하루 연속 몇 시간 이상 접촉한 사람을 기준으로 하는가? (무작위 문항 61)", options: ["24시간 이상", "8시간 이상", "12시간 이상", "4시간 이상"], a: 1, exp: "밀접접촉자는 하루 연속 8시간 이상 또는 누적 40시간 이상 접촉자를 의미합니다." },
            { id: 279, baseId: 20, q: "역학조사관 교육 자료에 따르면, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 18)", options: ["최근 4주 이내 생백신 접종", "최근 3개월 이내 인플루엔자 백신", "최근 4주 이내 사백신 접종", "최근 2주 이내 코로나19 백신"], a: 0, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },
            { id: 324, baseId: 20, q: "보건소 결핵실 대응 상황에서, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 63)", options: ["최근 3개월 이내 인플루엔자 백신", "최근 4주 이내 사백신 접종", "최근 2주 이내 코로나19 백신", "최근 4주 이내 생백신 접종"], a: 3, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },

            { id: 179, baseId: 8, q: "도말 양성으로 판정된 전염성 폐결핵 환자가 항결핵제 복용을 막 시작하였다. 환자의 취약성 평가 점수와 상관없이 \'치료 시작 후 초기 2주간(전염성 기간)\' 동안 보건소 전담요원이 수행해야 하는 복약확인 주기는? (초기관리 18)", options: ["매일 확인", "주 3회 확인", "주 1회 확인", "월 1회 확인"], a: 0, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도(저/중/고)와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 109, baseId: 6, q: "어린이집 교사로 근무하는 환자가 도말 양성 폐결핵으로 진단되었다. 관할 보건소장이 감염병예방법에 따라 환자와 소속 기관장에게 즉각 발급해야 하는 서류는 무엇인가? (행정 3)", options: ["업무종사 및 등교 일시 제한 대상자 통보서", "해당 어린이집 즉각 폐쇄 명령서", "결핵환자 강제 입원 및 격리 명령서", "방역 수칙 위반에 따른 과태료 부과 사전 통지서"], a: 0, exp: "집단시설 종사자가 전염성 결핵으로 확인된 경우, 타인과의 접촉을 차단하기 위해 업무종사 일시 제한 통보서를 발급합니다." },

            { id: 137, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 12점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 6)", options: ["초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "저위험군으로 분류되며, 월 1~2회 외래 중심으로 규칙적인 복약 여부 확인을 실시한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다."], a: 2, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 236, baseId: 10, q: "잠복결핵감염 치료를 1개월째 성실히 받고 있던 환자가 직장 발령으로 타 지역으로 이사를 가게 되었다고 보건소에 통보했다. 담당자가 시스템에서 취해야 할 가장 올바른 행정 조치는? (전출관리 20)", options: ["신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리하여 치료가 연계되도록 한다.", "기존 보건소에서 치료 종료 시까지 전적으로 원격 관리만 진행한다.", "산정특례를 취소하고 일반 건강보험 청구 대상으로 전환시킨다.", "치료를 일단 중단시키고 이사 간 지역에서 처음부터 다시 진단을 받도록 안내한다."], a: 0, exp: "환자가 거주지를 이동할 경우 치료 단절을 막기 위해 신규 관할 보건소 및 의료기관으로 이관 처리를 해야 합니다." },
            { id: 399, baseId: 14, q: "역학조사관 교육 자료에 따르면, 결핵 \'안심벨트 지원사업\'은 주로 어떤 환자의 간병비나 이송비를 지원하기 위함인가? (무작위 문항 138)", options: ["15세 미만 소아 결핵환자 전원", "모든 다제내성결핵 환자", "사회·경제적 취약계층 결핵환자", "입원 명령을 받은 모든 외국인 환자"], a: 2, exp: "안심벨트 사업은 취약계층의 치료 성공률을 높이기 위한 재정 지원 사업입니다." },
            { id: 162, baseId: 8, q: "도말 양성으로 판정된 전염성 폐결핵 환자가 항결핵제 복용을 막 시작하였다. 환자의 취약성 평가 점수와 상관없이 \'치료 시작 후 초기 2주간(전염성 기간)\' 동안 보건소 전담요원이 수행해야 하는 복약확인 주기는? (초기관리 1)", options: ["주 1회 확인", "주 3회 확인", "매일 확인", "월 1회 확인"], a: 2, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도(저/중/고)와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 186, baseId: 8, q: "도말 양성으로 판정된 전염성 폐결핵 환자가 항결핵제 복용을 막 시작하였다. 환자의 취약성 평가 점수와 상관없이 \'치료 시작 후 초기 2주간(전염성 기간)\' 동안 보건소 전담요원이 수행해야 하는 복약확인 주기는? (초기관리 25)", options: ["주 3회 확인", "월 1회 확인", "매일 확인", "주 1회 확인"], a: 2, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도(저/중/고)와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 145, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 25점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 4)", options: ["초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다.", "위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "중위험군으로 분류되며, 사례상담 필수 진행 및 주 2~3회 복약 확인을 실시한다."], a: 3, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 28, baseId: 2, q: "잠복결핵감염으로 진단된 환자의 지표환자(감염원)가 다제내성(MDR) 결핵으로 최종 확인되었다. 이 잠복결핵감염자에게 권고되는 치료 요법으로 가장 적절한 것은? (상황 2)", options: ["전문가 상의 후 레보플록사신 6개월(6Lfx) 요법을 고려한다.", "이소니아지드 9개월(9H) 요법을 무조건적으로 시행한다.", "피라진아미드와 에탐부톨을 병합하여 2개월간 투여한다.", "치료를 전면 보류하고 2년간 흉부X선만 추적 관찰한다."], a: 0, exp: "지표환자의 약제감수성 결과가 다제내성(MDR)인 경우, 지침상 전문가 상의 후 레보플록사신 6개월(6Lfx) 요법을 고려한다.는 것이 권장됩니다." },
            { id: 309, baseId: 14, q: "결핵 관리 실무 지침상, 결핵 \'안심벨트 지원사업\'은 주로 어떤 환자의 간병비나 이송비를 지원하기 위함인가? (무작위 문항 48)", options: ["15세 미만 소아 결핵환자 전원", "모든 다제내성결핵 환자", "사회·경제적 취약계층 결핵환자", "입원 명령을 받은 모든 외국인 환자"], a: 2, exp: "안심벨트 사업은 취약계층의 치료 성공률을 높이기 위한 재정 지원 사업입니다." },
            { id: 248, baseId: 11, q: "영유아(5세 미만)가 결핵으로 진단되어 보건소에서 감염원 조사를 실시하려 한다. 이때 해당 결핵이 일반 결핵인지, 예방접종 이상반응인 \'M. bovis BCG 감염\'인지 정확히 감별하기 위해 질병관리청에 의뢰해야 하는 검사는 무엇인가? (감별 7)", options: ["단순 항산균 도말 및 배양검사", "HIV 항체 및 면역결핍 혈액 검사", "인터페론감마 분비검사(IGRA)", "결핵균 유전형 검사"], a: 3, exp: "영유아의 결핵 진단 시 BCG 균주에 의한 발병 여부를 감별하기 위해 유전형 검사를 의뢰하는 것이 원칙입니다." },
            { id: 12, baseId: 1, q: "전염성 폐결핵 환자와 밀접하게 접촉한 만 15세 고등학생이 보건소에 방문하였다. 이 접촉자의 잠복결핵감염 진단을 위해 가장 먼저 실시하거나 고려해야 할 조치로 옳은 것은? (사례 4)", options: ["연령과 무관하게 객담 배양검사를 3회 실시한다.", "흉부X선 및 IGRA 또는 TST 시행", "즉시 리팜핀 4개월 요법(4R)을 시작한다.", "접촉일로부터 6개월이 경과할 때까지 아무런 검사 없이 경과를 관찰한다."], a: 1, exp: "연령별 잠복결핵 진단 알고리즘에 따라 청소년의 경우 흉부X선 및 IGRA 또는 TST 시행하는 것이 원칙입니다. 단 모든 연령에서 활동성 결핵 배제를 위한 흉부X선이 우선 또는 동시 시행됩니다." },
            { id: 339, baseId: 17, q: "2026년도 개정 지침을 적용할 때, TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 최종 잠복결핵감염 판정은 어떻게 내리는가? (무작위 문항 78)", options: ["양성으로 판정하여 치료를 시작한다.", "판정 보류로 3개월 뒤 TST를 다시 시행한다.", "음성으로 판정하여 치료를 시행하지 않는다.", "결과 불일치로 객담 배양검사를 의뢰한다."], a: 2, exp: "특이도가 높은 IGRA 결과가 음성이면 최종적으로 음성 판정합니다." },
            { id: 204, baseId: 9, q: "결핵 진단을 받은 환자가 진료비 본인부담금을 면제받는 \'결핵질환 산정특례\' 제도를 이용하려 한다. 확진일로부터 소급하여 특례 적용을 받기 위해 국민건강보험공단에 신청서를 제출해야 하는 법정 기한은 언제까지인가? (행정절차 18)", options: ["확진일로부터 14일 이내 (공휴일 포함)", "확진일로부터 60일 이내 (영업일 기준)", "확진일로부터 30일 이내 (공휴일 포함)", "확진일로부터 7일 이내 (영업일 기준)"], a: 2, exp: "결핵 산정특례는 확진일로부터 30일 이내에 신청해야 확진일 당일부터 소급하여 진료비 혜택을 받을 수 있습니다." },
            { id: 485, baseId: 19, q: "결핵 관리 실무 지침상, 집단시설 현장조사를 완료한 후, \'결핵역학조사 현장조사서\'는 근무일 기준 며칠 이내에 질병보건통합관리시스템에 등록해야 하는가? (무작위 문항 224)", options: ["당일 이내", "14일 이내", "7일 이내", "3일 이내"], a: 3, exp: "현장조사서는 근무일 기준 3일 이내에 신속히 시스템에 등록해야 합니다." },
            { id: 328, baseId: 15, q: "2026년도 개정 지침을 적용할 때, 외국인 결핵환자가 정당한 이유 없이 약 복용을 지속적으로 거부(비순응)할 경우, 감염병예방법에 따라 보건소가 조치할 수 있는 행정 절차는? (무작위 문항 67)", options: ["경찰 동행 하에 강제 구인하여 구치소 내 치료", "본국 대사관 통보 후 24시간 내 강제 출국 조치", "어떠한 법적 제재도 불가능하므로 자율에 맡김", "출입국관서에 통보하여 체류기간 연장 제한 등의 조치 의뢰"], a: 3, exp: "비순응 외국인 환자에 대해서는 출입국관리법 등과 연계하여 체류 제한 조치를 취할 수 있습니다." },
            { id: 125, baseId: 6, q: "어린이집 교사로 근무하는 환자가 도말 양성 폐결핵으로 진단되었다. 관할 보건소장이 감염병예방법에 따라 환자와 소속 기관장에게 즉각 발급해야 하는 서류는 무엇인가? (행정 19)", options: ["해당 어린이집 즉각 폐쇄 명령서", "업무종사 및 등교 일시 제한 대상자 통보서", "결핵환자 강제 입원 및 격리 명령서", "방역 수칙 위반에 따른 과태료 부과 사전 통지서"], a: 1, exp: "집단시설 종사자가 전염성 결핵으로 확인된 경우, 타인과의 접촉을 차단하기 위해 업무종사 일시 제한 통보서를 발급합니다." },

            { id: 491, baseId: 16, q: "감염병 관리 시스템 운영 지침에 의하면, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준 며칠 이내에 완료되어야 하는가? (무작위 문항 230)", options: ["7일 이내", "3일 이내 (토·공휴일 제외)", "당일 이내", "14일 이내"], a: 1, exp: "1차 사례조사는 신속한 관리를 위해 3일 이내에 완료해야 합니다." },

            { id: 146, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 25점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 5)", options: ["위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "중위험군으로 분류되며, 사례상담 필수 진행 및 주 2~3회 복약 확인을 실시한다.", "초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다."], a: 1, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 355, baseId: 15, q: "2026년도 개정 지침을 적용할 때, 외국인 결핵환자가 정당한 이유 없이 약 복용을 지속적으로 거부(비순응)할 경우, 감염병예방법에 따라 보건소가 조치할 수 있는 행정 절차는? (무작위 문항 94)", options: ["어떠한 법적 제재도 불가능하므로 자율에 맡김", "출입국관서에 통보하여 체류기간 연장 제한 등의 조치 의뢰", "본국 대사관 통보 후 24시간 내 강제 출국 조치", "경찰 동행 하에 강제 구인하여 구치소 내 치료"], a: 1, exp: "비순응 외국인 환자에 대해서는 출입국관리법 등과 연계하여 체류 제한 조치를 취할 수 있습니다." },
            { id: 367, baseId: 18, q: "결핵 관리 실무 지침상, 집단시설 결핵역학조사 시 \'밀접접촉자\'를 산정할 때, 하루 연속 몇 시간 이상 접촉한 사람을 기준으로 하는가? (무작위 문항 106)", options: ["4시간 이상", "12시간 이상", "24시간 이상", "8시간 이상"], a: 3, exp: "밀접접촉자는 하루 연속 8시간 이상 또는 누적 40시간 이상 접촉자를 의미합니다." },
            { id: 325, baseId: 12, q: "감염병 관리 시스템 운영 지침에 의하면, 가족접촉자 조사의 대상 기간은 호흡기 결핵 환자의 진단일 기준 언제부터 치료 시작 후 2주까지인가? (무작위 문항 64)", options: ["1년 전부터", "1개월 전부터", "3개월 전부터", "6개월 전부터"], a: 2, exp: "진단일 기준 3개월 전부터입니다." },
            { id: 308, baseId: 13, q: "역학조사관 교육 자료에 따르면, 임산부인 결핵 접촉자가 흉부X선 검사를 꺼려할 때 올바른 설명은? (무작위 문항 47)", options: ["납치마를 착용하면 태아 방사선 피폭 위험이 거의 없어 검사 가능함을 안내한다.", "즉각적인 치료 약제를 투여한다.", "출산 시까지 무조건 검사를 유예한다.", "X선 대신 IGRA만 시행하고 종료한다."], a: 0, exp: "납치마 착용 하에 안전하게 검사 가능함을 교육해야 합니다." },

            { id: 177, baseId: 8, q: "도말 양성으로 판정된 전염성 폐결핵 환자가 항결핵제 복용을 막 시작하였다. 환자의 취약성 평가 점수와 상관없이 \'치료 시작 후 초기 2주간(전염성 기간)\' 동안 보건소 전담요원이 수행해야 하는 복약확인 주기는? (초기관리 16)", options: ["월 1회 확인", "주 3회 확인", "매일 확인", "주 1회 확인"], a: 2, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도(저/중/고)와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 206, baseId: 9, q: "결핵 진단을 받은 환자가 진료비 본인부담금을 면제받는 \'결핵질환 산정특례\' 제도를 이용하려 한다. 확진일로부터 소급하여 특례 적용을 받기 위해 국민건강보험공단에 신청서를 제출해야 하는 법정 기한은 언제까지인가? (행정절차 20)", options: ["확진일로부터 14일 이내 (공휴일 포함)", "확진일로부터 30일 이내 (공휴일 포함)", "확진일로부터 60일 이내 (영업일 기준)", "확진일로부터 7일 이내 (영업일 기준)"], a: 1, exp: "결핵 산정특례는 확진일로부터 30일 이내에 신청해야 확진일 당일부터 소급하여 진료비 혜택을 받을 수 있습니다." },
            { id: 36, baseId: 2, q: "잠복결핵감염으로 진단된 환자의 지표환자(감염원)가 모든 약제에 감수성 결핵으로 최종 확인되었다. 이 잠복결핵감염자에게 권고되는 치료 요법으로 가장 적절한 것은? (상황 4)", options: ["이소니아지드/리팜핀 3개월(3HR) 또는 이소니아지드 9개월(9H) 등을 시행한다.", "이소니아지드 9개월(9H) 요법을 무조건적으로 시행한다.", "피라진아미드와 에탐부톨을 병합하여 2개월간 투여한다.", "치료를 전면 보류하고 2년간 흉부X선만 추적 관찰한다."], a: 0, exp: "지표환자의 약제감수성 결과가 모든 약제에 감수성인 경우, 지침상 이소니아지드/리팜핀 3개월(3HR) 또는 이소니아지드 9개월(9H) 등을 시행한다.는 것이 권장됩니다." },
            { id: 464, baseId: 16, q: "2026년도 개정 지침을 적용할 때, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준 며칠 이내에 완료되어야 하는가? (무작위 문항 203)", options: ["7일 이내", "14일 이내", "3일 이내 (토·공휴일 제외)", "당일 이내"], a: 2, exp: "1차 사례조사는 신속한 관리를 위해 3일 이내에 완료해야 합니다." },
            { id: 171, baseId: 8, q: "도말 양성으로 판정된 전염성 폐결핵 환자가 항결핵제 복용을 막 시작하였다. 환자의 취약성 평가 점수와 상관없이 \'치료 시작 후 초기 2주간(전염성 기간)\' 동안 보건소 전담요원이 수행해야 하는 복약확인 주기는? (초기관리 10)", options: ["주 1회 확인", "월 1회 확인", "주 3회 확인", "매일 확인"], a: 3, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도(저/중/고)와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 243, baseId: 11, q: "영유아(5세 미만)가 결핵으로 진단되어 보건소에서 감염원 조사를 실시하려 한다. 이때 해당 결핵이 일반 결핵인지, 예방접종 이상반응인 \'M. bovis BCG 감염\'인지 정확히 감별하기 위해 질병관리청에 의뢰해야 하는 검사는 무엇인가? (감별 2)", options: ["결핵균 유전형 검사", "인터페론감마 분비검사(IGRA)", "HIV 항체 및 면역결핍 혈액 검사", "단순 항산균 도말 및 배양검사"], a: 0, exp: "영유아의 결핵 진단 시 BCG 균주에 의한 발병 여부를 감별하기 위해 유전형 검사를 의뢰하는 것이 원칙입니다." },
            { id: 474, baseId: 17, q: "보건소 결핵실 대응 상황에서, TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 최종 잠복결핵감염 판정은 어떻게 내리는가? (무작위 문항 213)", options: ["양성으로 판정하여 치료를 시작한다.", "판정 보류로 3개월 뒤 TST를 다시 시행한다.", "결과 불일치로 객담 배양검사를 의뢰한다.", "음성으로 판정하여 치료를 시행하지 않는다."], a: 3, exp: "특이도가 높은 IGRA 결과가 음성이면 최종적으로 음성 판정합니다." },
            { id: 132, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 12점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 1)", options: ["초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다.", "저위험군으로 분류되며, 월 1~2회 외래 중심으로 규칙적인 복약 여부 확인을 실시한다.", "위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다."], a: 2, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 107, baseId: 6, q: "어린이집 교사로 근무하는 환자가 도말 양성 폐결핵으로 진단되었다. 관할 보건소장이 감염병예방법에 따라 환자와 소속 기관장에게 즉각 발급해야 하는 서류는 무엇인가? (행정 1)", options: ["해당 어린이집 즉각 폐쇄 명령서", "결핵환자 강제 입원 및 격리 명령서", "방역 수칙 위반에 따른 과태료 부과 사전 통지서", "업무종사 및 등교 일시 제한 대상자 통보서"], a: 3, exp: "집단시설 종사자가 전염성 결핵으로 확인된 경우, 타인과의 접촉을 차단하기 위해 업무종사 일시 제한 통보서를 발급합니다." },
            { id: 58, baseId: 4, q: "관내 어린이집에서 근무하는 종사자가 전염성 폐결핵으로 확진되어 신고되었다. 보건소 역학조사반은 신고를 접수한 후 며칠 이내에 현장조사에 착수(질병보건통합관리시스템 등록 포함)해야 하는가? (기록 2)", options: ["신고 당일 자정까지", "근무일 기준 3일 이내", "근무일 기준 14일 이내", "근무일 기준 7일 이내"], a: 1, exp: "집단시설 결핵 발생 시 보건소는 신고일로부터 근무일 기준 3일 이내에 현장조사를 실시하고 시스템에 등록해야 합니다." },

            { id: 155, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 38점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 4)", options: ["초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다.", "위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다.", "고위험군으로 분류되며, 사례상담 필수 진행 및 주 4~5회 철저한 복약 확인을 실시한다."], a: 3, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 217, baseId: 10, q: "잠복결핵감염 치료를 1개월째 성실히 받고 있던 환자가 직장 발령으로 타 지역으로 이사를 가게 되었다고 보건소에 통보했다. 담당자가 시스템에서 취해야 할 가장 올바른 행정 조치는? (전출관리 1)", options: ["치료를 일단 중단시키고 이사 간 지역에서 처음부터 다시 진단을 받도록 안내한다.", "산정특례를 취소하고 일반 건강보험 청구 대상으로 전환시킨다.", "기존 보건소에서 치료 종료 시까지 전적으로 원격 관리만 진행한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리하여 치료가 연계되도록 한다."], a: 3, exp: "환자가 거주지를 이동할 경우 치료 단절을 막기 위해 신규 관할 보건소 및 의료기관으로 이관 처리를 해야 합니다." },
            { id: 209, baseId: 9, q: "결핵 진단을 받은 환자가 진료비 본인부담금을 면제받는 \'결핵질환 산정특례\' 제도를 이용하려 한다. 확진일로부터 소급하여 특례 적용을 받기 위해 국민건강보험공단에 신청서를 제출해야 하는 법정 기한은 언제까지인가? (행정절차 23)", options: ["확진일로부터 7일 이내 (영업일 기준)", "확진일로부터 14일 이내 (공휴일 포함)", "확진일로부터 60일 이내 (영업일 기준)", "확진일로부터 30일 이내 (공휴일 포함)"], a: 3, exp: "결핵 산정특례는 확진일로부터 30일 이내에 신청해야 확진일 당일부터 소급하여 진료비 혜택을 받을 수 있습니다." },

            { id: 329, baseId: 16, q: "감염병 관리 시스템 운영 지침에 의하면, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준 며칠 이내에 완료되어야 하는가? (무작위 문항 68)", options: ["7일 이내", "3일 이내 (토·공휴일 제외)", "당일 이내", "14일 이내"], a: 1, exp: "1차 사례조사는 신속한 관리를 위해 3일 이내에 완료해야 합니다." },
            { id: 277, baseId: 18, q: "2026년도 개정 지침을 적용할 때, 집단시설 결핵역학조사 시 \'밀접접촉자\'를 산정할 때, 하루 연속 몇 시간 이상 접촉한 사람을 기준으로 하는가? (무작위 문항 16)", options: ["4시간 이상", "12시간 이상", "8시간 이상", "24시간 이상"], a: 2, exp: "밀접접촉자는 하루 연속 8시간 이상 또는 누적 40시간 이상 접촉자를 의미합니다." },
            { id: 468, baseId: 20, q: "감염병 관리 시스템 운영 지침에 의하면, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 207)", options: ["최근 4주 이내 사백신 접종", "최근 2주 이내 코로나19 백신", "최근 4주 이내 생백신 접종", "최근 3개월 이내 인플루엔자 백신"], a: 2, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },

            { id: 45, baseId: 3, q: "잠복결핵감염 치료를 받고 있는 40대 환자가 간기능 검사 결과 AST/ALT 수치가 정상 상한치의 5배로 측정되었다. 현재 환자가 증상이 전혀 없을 때면, 의료진이 취해야 할 올바른 조치는? (케이스 1)", options: ["어떤 상황이든 1차 결핵약을 모두 2차 약제로 즉각 변경한다.", "간수치가 정상의 5배 이상이므로 약을 중단한다.", "간 보호제만 처방하고 기존 결핵약 용량을 2배로 증량한다.", "부작용 신고 없이 환자 스스로 복약을 2주간 중단하도록 지시한다."], a: 1, exp: "잠복결핵 치료 중 AST/ALT가 증상 동반 시 3배 이상, 무증상 시 5배 이상이면 약제를 중단해야 합니다." },
            { id: 170, baseId: 8, q: "도말 양성으로 판정된 전염성 폐결핵 환자가 항결핵제 복용을 막 시작하였다. 환자의 취약성 평가 점수와 상관없이 \'치료 시작 후 초기 2주간(전염성 기간)\' 동안 보건소 전담요원이 수행해야 하는 복약확인 주기는? (초기관리 9)", options: ["주 1회 확인", "매일 확인", "주 3회 확인", "월 1회 확인"], a: 1, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도(저/중/고)와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 96, baseId: 5, q: "집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정하려고 한다. 이때 역학조사관이 기준점(시작점)을 정하기 위해 확인해야 하는 핵심 지표가 아닌 것은? (평가 15)", options: ["객담 도말검사 및 배양검사 결과 (양성 여부)", "환자 거주지의 방 크기 및 환기 상태", "흉부X선 상 공동(cavity)의 유무", "결핵 관련 임상 증상(기침 등)의 발생 시기"], a: 1, exp: "전염성 추정 기간은 증상 발생일, 도말검사 결과, 공동 유무에 따라 결정되며, 거주지 면적은 전염성 추정 \'기간\' 산정 기준이 아닙니다." },

            { id: 250, baseId: 11, q: "영유아(5세 미만)가 결핵으로 진단되어 보건소에서 감염원 조사를 실시하려 한다. 이때 해당 결핵이 일반 결핵인지, 예방접종 이상반응인 \'M. bovis BCG 감염\'인지 정확히 감별하기 위해 질병관리청에 의뢰해야 하는 검사는 무엇인가? (감별 9)", options: ["HIV 항체 및 면역결핍 혈액 검사", "인터페론감마 분비검사(IGRA)", "결핵균 유전형 검사", "단순 항산균 도말 및 배양검사"], a: 2, exp: "영유아의 결핵 진단 시 BCG 균주에 의한 발병 여부를 감별하기 위해 유전형 검사를 의뢰하는 것이 원칙입니다." },
            { id: 26, baseId: 2, q: "잠복결핵감염으로 진단된 환자의 지표환자(감염원)가 이소니아지드 단독내성 결핵으로 최종 확인되었다. 이 잠복결핵감염자에게 권고되는 치료 요법으로 가장 적절한 것은? (상황 6)", options: ["이소니아지드 9개월(9H) 요법을 무조건적으로 시행한다.", "피라진아미드와 에탐부톨을 병합하여 2개월간 투여한다.", "치료를 전면 보류하고 2년간 흉부X선만 추적 관찰한다.", "리팜핀 4개월(4R) 요법을 시행한다."], a: 3, exp: "지표환자의 약제감수성 결과가 이소니아지드 단독내성인 경우, 지침상 리팜핀 4개월(4R) 요법을 시행한다.는 것이 권장됩니다." },
            { id: 115, baseId: 6, q: "어린이집 교사로 근무하는 환자가 도말 양성 폐결핵으로 진단되었다. 관할 보건소장이 감염병예방법에 따라 환자와 소속 기관장에게 즉각 발급해야 하는 서류는 무엇인가? (행정 9)", options: ["해당 어린이집 즉각 폐쇄 명령서", "결핵환자 강제 입원 및 격리 명령서", "업무종사 및 등교 일시 제한 대상자 통보서", "방역 수칙 위반에 따른 과태료 부과 사전 통지서"], a: 2, exp: "집단시설 종사자가 전염성 결핵으로 확인된 경우, 타인과의 접촉을 차단하기 위해 업무종사 일시 제한 통보서를 발급합니다." },
            { id: 270, baseId: 20, q: "결핵 관리 실무 지침상, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 9)", options: ["최근 4주 이내 사백신 접종", "최근 2주 이내 코로나19 백신", "최근 3개월 이내 인플루엔자 백신", "최근 4주 이내 생백신 접종"], a: 3, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },
            { id: 375, baseId: 17, q: "결핵 관리 실무 지침상, TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 최종 잠복결핵감염 판정은 어떻게 내리는가? (무작위 문항 114)", options: ["양성으로 판정하여 치료를 시작한다.", "판정 보류로 3개월 뒤 TST를 다시 시행한다.", "결과 불일치로 객담 배양검사를 의뢰한다.", "음성으로 판정하여 치료를 시행하지 않는다."], a: 3, exp: "특이도가 높은 IGRA 결과가 음성이면 최종적으로 음성 판정합니다." },
            { id: 437, baseId: 16, q: "보건소 결핵실 대응 상황에서, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준 며칠 이내에 완료되어야 하는가? (무작위 문항 176)", options: ["당일 이내", "3일 이내 (토·공휴일 제외)", "7일 이내", "14일 이내"], a: 1, exp: "1차 사례조사는 신속한 관리를 위해 3일 이내에 완료해야 합니다." },

            { id: 97, baseId: 5, q: "집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정하려고 한다. 이때 역학조사관이 기준점(시작점)을 정하기 위해 확인해야 하는 핵심 지표가 아닌 것은? (평가 16)", options: ["객담 도말검사 및 배양검사 결과 (양성 여부)", "환자 거주지의 방 크기 및 환기 상태", "흉부X선 상 공동(cavity)의 유무", "결핵 관련 임상 증상(기침 등)의 발생 시기"], a: 1, exp: "전염성 추정 기간은 증상 발생일, 도말검사 결과, 공동 유무에 따라 결정되며, 거주지 면적은 전염성 추정 \'기간\' 산정 기준이 아닙니다." },

            { id: 10, baseId: 1, q: "전염성 폐결핵 환자와 밀접하게 접촉한 만 15세 고등학생이 보건소에 방문하였다. 이 접촉자의 잠복결핵감염 진단을 위해 가장 먼저 실시하거나 고려해야 할 조치로 옳은 것은? (사례 2)", options: ["흉부X선 및 IGRA 또는 TST 시행", "접촉일로부터 6개월이 경과할 때까지 아무런 검사 없이 경과를 관찰한다.", "즉시 리팜핀 4개월 요법(4R)을 시작한다.", "연령과 무관하게 객담 배양검사를 3회 실시한다."], a: 0, exp: "연령별 잠복결핵 진단 알고리즘에 따라 청소년의 경우 흉부X선 및 IGRA 또는 TST 시행하는 것이 원칙입니다. 단 모든 연령에서 활동성 결핵 배제를 위한 흉부X선이 우선 또는 동시 시행됩니다." },
            { id: 484, baseId: 18, q: "보건소 결핵실 대응 상황에서, 집단시설 결핵역학조사 시 \'밀접접촉자\'를 산정할 때, 하루 연속 몇 시간 이상 접촉한 사람을 기준으로 하는가? (무작위 문항 223)", options: ["8시간 이상", "12시간 이상", "4시간 이상", "24시간 이상"], a: 0, exp: "밀접접촉자는 하루 연속 8시간 이상 또는 누적 40시간 이상 접촉자를 의미합니다." },

            { id: 151, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 25점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 10)", options: ["위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "중위험군으로 분류되며, 사례상담 필수 진행 및 주 2~3회 복약 확인을 실시한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다.", "초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다."], a: 1, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 219, baseId: 10, q: "잠복결핵감염 치료를 1개월째 성실히 받고 있던 환자가 직장 발령으로 타 지역으로 이사를 가게 되었다고 보건소에 통보했다. 담당자가 시스템에서 취해야 할 가장 올바른 행정 조치는? (전출관리 3)", options: ["치료를 일단 중단시키고 이사 간 지역에서 처음부터 다시 진단을 받도록 안내한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리하여 치료가 연계되도록 한다.", "기존 보건소에서 치료 종료 시까지 전적으로 원격 관리만 진행한다.", "산정특례를 취소하고 일반 건강보험 청구 대상으로 전환시킨다."], a: 1, exp: "환자가 거주지를 이동할 경우 치료 단절을 막기 위해 신규 관할 보건소 및 의료기관으로 이관 처리를 해야 합니다." },
            { id: 446, baseId: 16, q: "감염병 관리 시스템 운영 지침에 의하면, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준 며칠 이내에 완료되어야 하는가? (무작위 문항 185)", options: ["7일 이내", "14일 이내", "당일 이내", "3일 이내 (토·공휴일 제외)"], a: 3, exp: "1차 사례조사는 신속한 관리를 위해 3일 이내에 완료해야 합니다." },

            { id: 49, baseId: 3, q: "잠복결핵감염 치료를 받고 있는 40대 환자가 간기능 검사 결과 AST/ALT 수치가 정상 상한치의 5배로 측정되었다. 현재 환자가 증상이 전혀 없을 때면, 의료진이 취해야 할 올바른 조치는? (케이스 5)", options: ["어떤 상황이든 1차 결핵약을 모두 2차 약제로 즉각 변경한다.", "간 보호제만 처방하고 기존 결핵약 용량을 2배로 증량한다.", "부작용 신고 없이 환자 스스로 복약을 2주간 중단하도록 지시한다.", "간수치가 정상의 5배 이상이므로 약을 중단한다."], a: 3, exp: "잠복결핵 치료 중 AST/ALT가 증상 동반 시 3배 이상, 무증상 시 5배 이상이면 약제를 중단해야 합니다." },
            { id: 374, baseId: 16, q: "2026년도 개정 지침을 적용할 때, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준 며칠 이내에 완료되어야 하는가? (무작위 문항 113)", options: ["7일 이내", "당일 이내", "14일 이내", "3일 이내 (토·공휴일 제외)"], a: 3, exp: "1차 사례조사는 신속한 관리를 위해 3일 이내에 완료해야 합니다." },
            { id: 256, baseId: 11, q: "영유아(5세 미만)가 결핵으로 진단되어 보건소에서 감염원 조사를 실시하려 한다. 이때 해당 결핵이 일반 결핵인지, 예방접종 이상반응인 \'M. bovis BCG 감염\'인지 정확히 감별하기 위해 질병관리청에 의뢰해야 하는 검사는 무엇인가? (감별 15)", options: ["HIV 항체 및 면역결핍 혈액 검사", "결핵균 유전형 검사", "단순 항산균 도말 및 배양검사", "인터페론감마 분비검사(IGRA)"], a: 1, exp: "영유아의 결핵 진단 시 BCG 균주에 의한 발병 여부를 감별하기 위해 유전형 검사를 의뢰하는 것이 원칙입니다." },
            { id: 18, baseId: 1, q: "전염성 폐결핵 환자와 밀접하게 접촉한 70세 어르신이 보건소에 방문하였다. 이 접촉자의 잠복결핵감염 진단을 위해 가장 먼저 실시하거나 고려해야 할 조치로 옳은 것은? (사례 2)", options: ["흉부X선 및 IGRA 시행 (치료 시 4R 우선 고려)", "연령과 무관하게 객담 배양검사를 3회 실시한다.", "즉시 리팜핀 4개월 요법(4R)을 시작한다.", "접촉일로부터 6개월이 경과할 때까지 아무런 검사 없이 경과를 관찰한다."], a: 0, exp: "연령별 잠복결핵 진단 알고리즘에 따라 노인의 경우 흉부X선 및 IGRA 시행 (치료 시 4R 우선 고려)하는 것이 원칙입니다. 단 모든 연령에서 활동성 결핵 배제를 위한 흉부X선이 우선 또는 동시 시행됩니다." },

            { id: 227, baseId: 10, q: "잠복결핵감염 치료를 1개월째 성실히 받고 있던 환자가 직장 발령으로 타 지역으로 이사를 가게 되었다고 보건소에 통보했다. 담당자가 시스템에서 취해야 할 가장 올바른 행정 조치는? (전출관리 11)", options: ["신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리하여 치료가 연계되도록 한다.", "기존 보건소에서 치료 종료 시까지 전적으로 원격 관리만 진행한다.", "치료를 일단 중단시키고 이사 간 지역에서 처음부터 다시 진단을 받도록 안내한다.", "산정특례를 취소하고 일반 건강보험 청구 대상으로 전환시킨다."], a: 0, exp: "환자가 거주지를 이동할 경우 치료 단절을 막기 위해 신규 관할 보건소 및 의료기관으로 이관 처리를 해야 합니다." },

            { id: 60, baseId: 4, q: "관내 어린이집에서 근무하는 종사자가 전염성 폐결핵으로 확진되어 신고되었다. 보건소 역학조사반은 신고를 접수한 후 며칠 이내에 현장조사에 착수(질병보건통합관리시스템 등록 포함)해야 하는가? (기록 4)", options: ["신고 당일 자정까지", "근무일 기준 3일 이내", "근무일 기준 7일 이내", "근무일 기준 14일 이내"], a: 1, exp: "집단시설 결핵 발생 시 보건소는 신고일로부터 근무일 기준 3일 이내에 현장조사를 실시하고 시스템에 등록해야 합니다." },

            { id: 439, baseId: 18, q: "감염병 관리 시스템 운영 지침에 의하면, 집단시설 결핵역학조사 시 \'밀접접촉자\'를 산정할 때, 하루 연속 몇 시간 이상 접촉한 사람을 기준으로 하는가? (무작위 문항 178)", options: ["4시간 이상", "12시간 이상", "8시간 이상", "24시간 이상"], a: 2, exp: "밀접접촉자는 하루 연속 8시간 이상 또는 누적 40시간 이상 접촉자를 의미합니다." },
            { id: 123, baseId: 6, q: "어린이집 교사로 근무하는 환자가 도말 양성 폐결핵으로 진단되었다. 관할 보건소장이 감염병예방법에 따라 환자와 소속 기관장에게 즉각 발급해야 하는 서류는 무엇인가? (행정 17)", options: ["해당 어린이집 즉각 폐쇄 명령서", "결핵환자 강제 입원 및 격리 명령서", "방역 수칙 위반에 따른 과태료 부과 사전 통지서", "업무종사 및 등교 일시 제한 대상자 통보서"], a: 3, exp: "집단시설 종사자가 전염성 결핵으로 확인된 경우, 타인과의 접촉을 차단하기 위해 업무종사 일시 제한 통보서를 발급합니다." },
            { id: 189, baseId: 9, q: "결핵 진단을 받은 환자가 진료비 본인부담금을 면제받는 \'결핵질환 산정특례\' 제도를 이용하려 한다. 확진일로부터 소급하여 특례 적용을 받기 위해 국민건강보험공단에 신청서를 제출해야 하는 법정 기한은 언제까지인가? (행정절차 3)", options: ["확진일로부터 7일 이내 (영업일 기준)", "확진일로부터 14일 이내 (공휴일 포함)", "확진일로부터 30일 이내 (공휴일 포함)", "확진일로부터 60일 이내 (영업일 기준)"], a: 2, exp: "결핵 산정특례는 확진일로부터 30일 이내에 신청해야 확진일 당일부터 소급하여 진료비 혜택을 받을 수 있습니다." },
            { id: 385, baseId: 18, q: "감염병 관리 시스템 운영 지침에 의하면, 집단시설 결핵역학조사 시 \'밀접접촉자\'를 산정할 때, 하루 연속 몇 시간 이상 접촉한 사람을 기준으로 하는가? (무작위 문항 124)", options: ["24시간 이상", "8시간 이상", "4시간 이상", "12시간 이상"], a: 1, exp: "밀접접촉자는 하루 연속 8시간 이상 또는 누적 40시간 이상 접촉자를 의미합니다." },
            { id: 458, baseId: 19, q: "감염병 관리 시스템 운영 지침에 의하면, 집단시설 현장조사를 완료한 후, \'결핵역학조사 현장조사서\'는 근무일 기준 며칠 이내에 질병보건통합관리시스템에 등록해야 하는가? (무작위 문항 197)", options: ["14일 이내", "3일 이내", "당일 이내", "7일 이내"], a: 1, exp: "현장조사서는 근무일 기준 3일 이내에 신속히 시스템에 등록해야 합니다." },
            { id: 345, baseId: 14, q: "감염병 관리 시스템 운영 지침에 의하면, 결핵 \'안심벨트 지원사업\'은 주로 어떤 환자의 간병비나 이송비를 지원하기 위함인가? (무작위 문항 84)", options: ["모든 다제내성결핵 환자", "15세 미만 소아 결핵환자 전원", "사회·경제적 취약계층 결핵환자", "입원 명령을 받은 모든 외국인 환자"], a: 2, exp: "안심벨트 사업은 취약계층의 치료 성공률을 높이기 위한 재정 지원 사업입니다." },
            { id: 348, baseId: 17, q: "2026년도 개정 지침을 적용할 때, TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 최종 잠복결핵감염 판정은 어떻게 내리는가? (무작위 문항 87)", options: ["판정 보류로 3개월 뒤 TST를 다시 시행한다.", "결과 불일치로 객담 배양검사를 의뢰한다.", "음성으로 판정하여 치료를 시행하지 않는다.", "양성으로 판정하여 치료를 시작한다."], a: 2, exp: "특이도가 높은 IGRA 결과가 음성이면 최종적으로 음성 판정합니다." },
            { id: 143, baseId: 7, q: "보건소 전담요원이 신규 결핵환자의 취약성 평가를 실시한 결과 총점이 25점이었다. 이 환자의 위험도 분류와 그에 따른 적절한 복약확인 및 관리 방안은 무엇인가? (환자 2)", options: ["위험도 분류와 무관하게 모든 환자는 매일 보건소에 출석하여 약을 복용해야 한다.", "중위험군으로 분류되며, 사례상담 필수 진행 및 주 2~3회 복약 확인을 실시한다.", "저위험군으로 분류되며, 약물 부작용이 없으면 치료 종료 시까지 연락하지 않는다.", "초고위험군으로 분류되어 즉시 국립결핵병원으로 강제 이송 조치한다."], a: 1, exp: "취약성 평가는 16점 이하 저위험군, 17~30점 중위험군, 31점 이상 고위험군이며, 점수에 따라 사례관리 강도가 달라집니다." },
            { id: 415, baseId: 12, q: "2026년도 개정 지침을 적용할 때, 가족접촉자 조사의 대상 기간은 호흡기 결핵 환자의 진단일 기준 언제부터 치료 시작 후 2주까지인가? (무작위 문항 154)", options: ["6개월 전부터", "1년 전부터", "1개월 전부터", "3개월 전부터"], a: 3, exp: "진단일 기준 3개월 전부터입니다." },
            { id: 287, baseId: 19, q: "보건소 결핵실 대응 상황에서, 집단시설 현장조사를 완료한 후, \'결핵역학조사 현장조사서\'는 근무일 기준 며칠 이내에 질병보건통합관리시스템에 등록해야 하는가? (무작위 문항 26)", options: ["당일 이내", "14일 이내", "7일 이내", "3일 이내"], a: 3, exp: "현장조사서는 근무일 기준 3일 이내에 신속히 시스템에 등록해야 합니다." },
            { id: 305, baseId: 19, q: "감염병 관리 시스템 운영 지침에 의하면, 집단시설 현장조사를 완료한 후, \'결핵역학조사 현장조사서\'는 근무일 기준 며칠 이내에 질병보건통합관리시스템에 등록해야 하는가? (무작위 문항 44)", options: ["3일 이내", "14일 이내", "당일 이내", "7일 이내"], a: 0, exp: "현장조사서는 근무일 기준 3일 이내에 신속히 시스템에 등록해야 합니다." },
            { id: 288, baseId: 20, q: "감염병 관리 시스템 운영 지침에 의하면, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 27)", options: ["최근 2주 이내 코로나19 백신", "최근 4주 이내 사백신 접종", "최근 3개월 이내 인플루엔자 백신", "최근 4주 이내 생백신 접종"], a: 3, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },
            { id: 178, baseId: 8, q: "도말 양성으로 판정된 전염성 폐결핵 환자가 항결핵제 복용을 막 시작하였다. 환자의 취약성 평가 점수와 상관없이 \'치료 시작 후 초기 2주간(전염성 기간)\' 동안 보건소 전담요원이 수행해야 하는 복약확인 주기는? (초기관리 17)", options: ["월 1회 확인", "주 3회 확인", "주 1회 확인", "매일 확인"], a: 3, exp: "전염성이 높은 치료 시작 직후 2주간은 환자의 위험도(저/중/고)와 무관하게 매일 복약을 확인해야 합니다." },
            { id: 438, baseId: 17, q: "보건소 결핵실 대응 상황에서, TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 최종 잠복결핵감염 판정은 어떻게 내리는가? (무작위 문항 177)", options: ["판정 보류로 3개월 뒤 TST를 다시 시행한다.", "음성으로 판정하여 치료를 시행하지 않는다.", "양성으로 판정하여 치료를 시작한다.", "결과 불일치로 객담 배양검사를 의뢰한다."], a: 1, exp: "특이도가 높은 IGRA 결과가 음성이면 최종적으로 음성 판정합니다." },
            { id: 103, baseId: 5, q: "집단시설 역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정하려고 한다. 이때 역학조사관이 기준점(시작점)을 정하기 위해 확인해야 하는 핵심 지표가 아닌 것은? (평가 22)", options: ["결핵 관련 임상 증상(기침 등)의 발생 시기", "객담 도말검사 및 배양검사 결과 (양성 여부)", "흉부X선 상 공동(cavity)의 유무", "환자 거주지의 방 크기 및 환기 상태"], a: 3, exp: "전염성 추정 기간은 증상 발생일, 도말검사 결과, 공동 유무에 따라 결정되며, 거주지 면적은 전염성 추정 \'기간\' 산정 기준이 아닙니다." },
            { id: 445, baseId: 15, q: "보건소 결핵실 대응 상황에서, 외국인 결핵환자가 정당한 이유 없이 약 복용을 지속적으로 거부(비순응)할 경우, 감염병예방법에 따라 보건소가 조치할 수 있는 행정 절차는? (무작위 문항 184)", options: ["출입국관서에 통보하여 체류기간 연장 제한 등의 조치 의뢰", "경찰 동행 하에 강제 구인하여 구치소 내 치료", "어떠한 법적 제재도 불가능하므로 자율에 맡김", "본국 대사관 통보 후 24시간 내 강제 출국 조치"], a: 0, exp: "비순응 외국인 환자에 대해서는 출입국관리법 등과 연계하여 체류 제한 조치를 취할 수 있습니다." },
            { id: 307, baseId: 12, q: "감염병 관리 시스템 운영 지침에 의하면, 가족접촉자 조사의 대상 기간은 호흡기 결핵 환자의 진단일 기준 언제부터 치료 시작 후 2주까지인가? (무작위 문항 46)", options: ["1년 전부터", "3개월 전부터", "1개월 전부터", "6개월 전부터"], a: 1, exp: "진단일 기준 3개월 전부터입니다." },
            { id: 486, baseId: 20, q: "보건소 결핵실 대응 상황에서, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 225)", options: ["최근 4주 이내 생백신 접종", "최근 4주 이내 사백신 접종", "최근 2주 이내 코로나19 백신", "최근 3개월 이내 인플루엔자 백신"], a: 0, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },
            { id: 27, baseId: 2, q: "잠복결핵감염으로 진단된 환자의 지표환자(감염원)가 다제내성(MDR) 결핵으로 최종 확인되었다. 이 잠복결핵감염자에게 권고되는 치료 요법으로 가장 적절한 것은? (상황 1)", options: ["치료를 전면 보류하고 2년간 흉부X선만 추적 관찰한다.", "이소니아지드 9개월(9H) 요법을 무조건적으로 시행한다.", "피라진아미드와 에탐부톨을 병합하여 2개월간 투여한다.", "전문가 상의 후 레보플록사신 6개월(6Lfx) 요법을 고려한다."], a: 3, exp: "지표환자의 약제감수성 결과가 다제내성(MDR)인 경우, 지침상 전문가 상의 후 레보플록사신 6개월(6Lfx) 요법을 고려한다.는 것이 권장됩니다." },
            { id: 246, baseId: 11, q: "영유아(5세 미만)가 결핵으로 진단되어 보건소에서 감염원 조사를 실시하려 한다. 이때 해당 결핵이 일반 결핵인지, 예방접종 이상반응인 \'M. bovis BCG 감염\'인지 정확히 감별하기 위해 질병관리청에 의뢰해야 하는 검사는 무엇인가? (감별 5)", options: ["단순 항산균 도말 및 배양검사", "결핵균 유전형 검사", "인터페론감마 분비검사(IGRA)", "HIV 항체 및 면역결핍 혈액 검사"], a: 1, exp: "영유아의 결핵 진단 시 BCG 균주에 의한 발병 여부를 감별하기 위해 유전형 검사를 의뢰하는 것이 원칙입니다." },
            { id: 297, baseId: 20, q: "2026년도 개정 지침을 적용할 때, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 36)", options: ["최근 3개월 이내 인플루엔자 백신", "최근 4주 이내 생백신 접종", "최근 2주 이내 코로나19 백신", "최근 4주 이내 사백신 접종"], a: 1, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." },
            { id: 378, baseId: 20, q: "역학조사관 교육 자료에 따르면, 투베르쿨린 피부반응검사(TST) 시행 시 위음성 결과를 피하기 위해 최근 접종력을 확인해야 하는 백신의 종류와 기한은? (무작위 문항 117)", options: ["최근 3개월 이내 인플루엔자 백신", "최근 4주 이내 사백신 접종", "최근 2주 이내 코로나19 백신", "최근 4주 이내 생백신 접종"], a: 3, exp: "생백신은 TST 결과에 위음성을 유발할 수 있어 4주 이내 접종력을 확인합니다." }
        ];

        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswered = false;
        let wrongQuestions = []; 

        const QUESTIONS_PER_QUIZ = 10;
        const STORAGE_KEY = 'tb_quiz_final_500_v7';

        const startBtn = document.getElementById('start-btn');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resetHistoryBtn = document.getElementById('reset-history-btn');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            wrongQuestions = [];
            let askedIds = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            let available = questionBank.filter(q => !askedIds.includes(q.id));
            
            shuffle(available);
            
            let selected = [];
            let usedBaseIds = new Set();
            
            // 유사한 문맥(Base ID)의 문제가 한 세션 10문제 안에 절대 중복되지 않도록 필터링
            for (let q of available) {
                if (!usedBaseIds.has(q.baseId)) {
                    selected.push(q);
                    usedBaseIds.add(q.baseId);
                }
                if (selected.length === QUESTIONS_PER_QUIZ) break;
            }

            // 조건을 만족하는 문제가 부족하면 전체 기록 리셋 후 다시 추출
            if (selected.length < QUESTIONS_PER_QUIZ) {
                askedIds = [];
                available = [...questionBank];
                shuffle(available);
                selected = [];
                usedBaseIds = new Set();
                for (let q of available) {
                    if (!usedBaseIds.has(q.baseId)) {
                        selected.push(q);
                        usedBaseIds.add(q.baseId);
                    }
                    if (selected.length === QUESTIONS_PER_QUIZ) break;
                }
                alert("이전에 풀었던 문제들을 제외하고 중복 없는 10문제를 구성할 수 없어, 출제 기록이 자동 초기화되었습니다.");
            }
            
            currentQuiz = selected;
            
            askedIds = [...askedIds, ...currentQuiz.map(q => q.id)];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(askedIds));

            currentQuestionIndex = 0;
            score = 0;
        }

        function displayQuestion() {
            isAnswered = false;
            selectedOptionIndex = null;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-counter').innerText = `문제 ${currentQuestionIndex + 1} / ${QUESTIONS_PER_QUIZ}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / QUESTIONS_PER_QUIZ) * 100}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:bg-gray-50 focus:outline-none text-gray-700 font-medium transition-colors';
                btn.innerText = optText;
                btn.onclick = () => {
                    if (isAnswered) return;
                    selectedOptionIndex = index;
                    Array.from(optionsContainer.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer() {
            if (selectedOptionIndex === null) {
                alert("정답을 선택해주세요.");
                return;
            }
            
            isAnswered = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;
            
            let isCorrect = false;

            for (let i = 0; i < buttons.length; i++) {
                if (i === q.a) {
                    buttons[i].classList.add('correct');
                    if (i === selectedOptionIndex) {
                        isCorrect = true;
                        score += 10;
                    }
                } else if (i === selectedOptionIndex) {
                    buttons[i].classList.add('incorrect');
                }
            }

            if (!isCorrect) {
                wrongQuestions.push({
                    question: q.q,
                    myAnswer: q.options[selectedOptionIndex],
                    correctAnswer: q.options[q.a],
                    explanation: q.exp
                });
            }

            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_QUIZ) * 100}%`;
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;

            const wrongListContainer = document.getElementById('wrong-list');
            wrongListContainer.innerHTML = '';
            
            if (wrongQuestions.length === 0) {
                wrongListContainer.innerHTML = '<li class="text-green-700 font-bold text-center py-6 bg-green-50 rounded-xl border border-green-200">🎉 완벽합니다! 모든 문제를 맞히셨습니다.</li>';
            } else {
                wrongQuestions.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = "bg-red-50 p-5 rounded-xl border border-red-200 shadow-sm";
                    li.innerHTML = `
                        <p class="font-bold text-gray-900 mb-3 text-lg">Q${idx+1}. ${item.question}</p>
                        <div class="space-y-2 mb-3">
                            <p class="text-sm text-red-600 flex items-start"><span class="font-bold w-24 shrink-0">내가 고른 답:</span> <span>${item.myAnswer}</span></p>
                            <p class="text-sm text-blue-700 flex items-start"><span class="font-bold w-24 shrink-0">올바른 답:</span> <span>${item.correctAnswer}</span></p>
                        </div>
                        <div class="text-sm text-gray-700 bg-white p-3 rounded-lg border border-red-100 flex items-start">
                            <span class="font-bold text-yellow-600 w-12 shrink-0">해설:</span> 
                            <span>${item.explanation}</span>
                        </div>
                    `;
                    wrongListContainer.appendChild(li);
                });
            }
        }

        startBtn.addEventListener('click', () => {
            initQuiz();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            displayQuestion();
        });

        submitBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_QUIZ) {
                displayQuestion();
            } else {
                showResults();
            }
        });

        restartBtn.addEventListener('click', () => {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("모든 문제 출제 기록을 초기화하시겠습니까? (기록 삭제 후 새로운 10문제가 출제됩니다.)")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("초기화 완료되었습니다.");
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
