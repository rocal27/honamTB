<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn.selected { background-color: #dbeafe; border-color: #3b82f6; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
    </style>
</head>
<body class="text-gray-800">
    <div class="max-w-3xl mx-auto p-4 md:p-8 mt-10 bg-white rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">2026 국가결핵관리지침 퀴즈</h1>
        <p class="text-center text-gray-500 mb-6">매번 새로운 10문제가 무작위로 출제됩니다.</p>
        
        <div id="start-screen" class="text-center py-10">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-md transition-transform transform hover:scale-105">
                퀴즈 시작하기
            </button>
            <div class="mt-6 text-sm text-blue-600 font-medium">호남권질병대응센터 감염병대응과</div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-4 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-500" id="question-counter">문제 1 / 10</span>
                <div class="w-2/3 bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full" id="progress-bar" style="width: 10%"></div>
                </div>
            </div>
            
            <div id="question-container" class="mb-6">
                <h2 class="text-xl font-bold mb-4" id="question-text">문제 내용</h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-container" class="hidden p-4 mb-6 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="font-bold text-yellow-800 mb-1">해설:</p>
                <p id="explanation-text" class="text-gray-700 text-sm"></p>
            </div>

            <div class="flex justify-end mt-4">
                <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">다음 문제</button>
                <button id="submit-btn" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg">정답 확인</button>
            </div>
        </div>

        <div id="result-screen" class="hidden text-center py-10">
            <h2 class="text-3xl font-bold mb-4">퀴즈 완료!</h2>
            <p class="text-xl mb-6">당신의 점수는 <span id="score-text" class="font-bold text-blue-600 text-2xl"></span>점 입니다.</p>
            <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-md">
                새로운 문제로 다시 풀기
            </button>
            <button id="reset-history-btn" class="mt-4 block mx-auto text-sm text-gray-400 hover:text-red-500 underline">
                출제 기록 초기화 (500문제 다시 풀기)
            </button>
        </div>
    </div>

    <script>
        const questionBank = [
            { id: 1, q: "가족접촉자 조사의 주된 목적 중 \'추가 결핵환자 발견\' 외에 또 다른 핵심 어느 것인가? (1번 문항)", options: ["잠복결핵감염 치료를 통한 결핵 발병 예방", "환자 가족의 건강보험 자격 심사", "의료기관 평가 자료 수집", "직장 내 방역 소독 여부 점검"], a: 0, exp: "가족접촉자 조사는 추가 환자 발견뿐만 아니라 잠복결핵감염 치료를 통한 발병 예방을 목적으로 합니다." },
            { id: 2, q: "결핵으로 진단받은 최민수씨의 가족접촉자 조사를 진행하려 한다. 조사 대상 기간의 기준으로 옳은알맞은 것은? (2번 문항)", options: ["진단일 기준 1개월 전 ~ 치료 시작 후 1주", "진단일 기준 3개월 전 ~ 치료 시작 후 2주", "진단일 기준 6개월 전 ~ 치료 종료 시", "증상 발생 1년 전 ~ 치료 시작 시점"], a: 1, exp: "호흡기 결핵 환자의 진단일 기준 3개월 이전부터 치료 시작 후 2주까지 접촉한 가족 및 동거인이 대상입니다." },
            { id: 3, q: "만 8세 이하 소아 폐외결핵 환자가 발생했을 때, 가족접촉자 조사를 시행하는 주된 어느 것인가? (3번 문항)", options: ["소아의 성장 발달 지연 방지", "가족 중 숨은 감염원을 파악하기 위해", "유치원 내 집단 발병을 막기 위해", "예방접종력 조사를 위해"], a: 1, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원 파악을 위해 조사를 실시합니다." },
            { id: 4, q: "결핵환자 신고 후, 가족접촉자는 언제까지 검진을 받아야 한다고 안내옳은 것은? (4번 문항)", options: ["신고일 기준 1주일 이내", "신고일 기준 2주일 이내", "신고일 기준 1개월 이내", "신고일 기준 3개월 이내"], a: 2, exp: "환자 신고일 기준으로 1개월 내에 가족접촉자 검진의료기관이나 보건소를 방문하여 검사를 받도록 안내해야 합니다." },
            { id: 5, q: "[상황제시형] 가족접촉자 전원을 대상으로 활동성 결핵을 먼저 배제하기 위해 기본적으로 실시하는 무엇인가? (5번 문항)", options: ["흉부X선 검사", "객담 도말검사", "객담 배양검사", "IGRA 검사"], a: 0, exp: "전체 가족접촉자를 대상으로 활동성 결핵 배제를 위해 가장 먼저 흉부X선 검사를 실시합니다." },
            { id: 6, q: "가족접촉자 중 다제내성결핵 환자의 접촉자인 경우, 객담 검사 시 추가로 시행해야 하는 어느 것인가? (6번 문항)", options: ["결핵균 통상감수성검사", "Xpert MTB/RIF 또는 BD max", "단순 항산균 도말검사", "결핵균 피부반응검사(TST)"], a: 1, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 7, q: "[상황제시형] 집단시설 결핵역학조사의 두 가지 핵심 구성 옳은 것은? (7번 문항)", options: ["지표환자 조사와 접촉자 조사", "환경 소독과 시설 폐쇄", "건강검진과 예방접종 실시", "의료진 조사와 방역 인력 배치"], a: 0, exp: "결핵역학조사는 \'지표환자 조사\'와 \'접촉자 조사\'로 이루어집니다." },
            { id: 8, q: "집단시설 내 결핵환자 발생 시, 호흡기검체 검사 결과가 음성일지라도 조사를 실시하는 적절한 것은? (8번 문항)", options: ["기침이 3일 지속될 때", "흉부X선 상 공동(cavity)이 확인된 경우", "결핵 과거력이 있을 때", "환자가 65세 이상일 때"], a: 1, exp: "호흡기검체 음성이어도 흉부X선 상 공동이 확인된 경우 전염성이 높을 수 있어 역학조사를 실시합니다." },
            { id: 9, q: "집단시설 \'밀접접촉자\' 선정 기준 중 접촉 시간에 대한 알맞은 것은? (9번 문항)", options: ["하루 연속 4시간 이상 또는 누적 20시간 이상", "하루 연속 8시간 이상 또는 누적 40시간 이상", "하루 연속 12시간 이상 또는 누적 60시간 이상", "연속 24시간 이상"], a: 1, exp: "하루 연속 8시간 이상 접촉했거나 전염성 추정기간 동안 누적 기준 40시간 이상 접촉한 경우 밀접접촉자로 분류합니다." },
            { id: 10, q: "집단시설 현장조사 종료 후, 보건소는 현장조사서를 질병보건통합관리시스템에 며칠 이내에 등록해야 알맞은 것은? (10번 문항)", options: ["24시간 이내", "3일 이내 (근무일 기준)", "7일 이내", "14일 이내"], a: 1, exp: "현장조사일로부터 3일 이내(근무일 기준)에 현장조사서를 시스템에 등록해야 합니다." },
            { id: 11, q: "[상황제시형] 투베르쿨린 피부반응검사(TST) 시행 전 최근 접종력을 확인해야 하는 백신의 종류와 알맞은 것은? (11번 문항)", options: ["코로나19 백신 2주 이내", "사백신 4주 이내", "생백신 4주 이내", "모든 백신 3개월 이내"], a: 2, exp: "생백신 접종은 TST 위음성을 유발할 수 있으므로 최근 4주 이내 생백신 접종력을 확인해야 합니다." },
            { id: 12, q: "결핵환자 어머니를 둔 신생아 오서연가 있다. 활동성 결핵 배제 후 1차적으로 취해야 할 가장 적절한 적절한 것은? (12번 문항)", options: ["즉시 BCG 접종", "관찰 후 6개월 뒤 IGRA 검사", "TST 판독 전까지 이소니아지드 투여", "생백신 접종 보류"], a: 2, exp: "활동성 결핵 배제 후 생후 3개월 이후 TST를 시행하며, 판독 전까지 이소니아지드를 선제 투여합니다." },
            { id: 13, q: "[상황제시형] 5세 이상 정상 면역자의 2차 TST 검사 결과가 \'양전(Positive conversion)\'으로 판정되는 알맞은 것은? (13번 문항)", options: ["5mm 이상 증가", "10mm 이상이면서 1차 결과보다 6mm 이상 증가", "15mm 이상 증가", "무조건 10mm 이상"], a: 1, exp: "정상 면역자(5세 이상)는 2차 결과가 10mm 이상이면서 1차보다 6mm 이상 증가해야 양전으로 판정합니다." },
            { id: 14, q: "결핵환자 \'사례조사\'의 1차 조사는 신고일 기준으로 며칠 이내에 실시해야 옳은 것은? (14번 문항)", options: ["당일 이내", "3일 이내 (토·공휴일 제외)", "7일 이내", "14일 이내"], a: 1, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 공휴일 제외)에 실시해야 합니다." },
            { id: 15, q: "결핵환자 \'취약성평가\' 결과에 따른 \'중위험군\' 점수 알맞은 것은? (15번 문항)", options: ["0~16점", "17~30점", "31점 이상", "50점 이상"], a: 1, exp: "취약성평가 저위험군은 16점 이하, 중위험군은 17~30점, 고위험군은 31점 이상입니다." },
            { id: 16, q: "[상황제시형] 전염성 결핵환자의 경우, 치료 시작 후 전염성 기간(초기 2주간)의 기본 복약확인 알맞은 것은? (16번 문항)", options: ["주 1회", "주 3회", "매일 확인", "월 1회"], a: 2, exp: "전염성 환자의 경우 치료시작 이후 2주간(전염성 기간) 매일 복약확인을 실시해야 합니다." },
            { id: 17, q: "결핵 산정특례 적용을 확진일로부터 소급 받기 위해 신청해야 하는 어느 것인가? (17번 문항)", options: ["7일 이내", "14일 이내", "30일 이내", "60일 이내"], a: 2, exp: "확진일로부터 30일 이내에 신청해야 확진일(공휴일 포함)부터 소급하여 적용받을 수 있습니다." },
            { id: 18, q: "[상황제시형] 가족접촉자 조사의 주된 목적 중 \'추가 결핵환자 발견\' 외에 또 다른 핵심 어느 것인가? (18번 문항)", options: ["잠복결핵감염 치료를 통한 결핵 발병 예방", "환자 가족의 건강보험 자격 심사", "의료기관 평가 자료 수집", "직장 내 방역 소독 여부 점검"], a: 0, exp: "가족접촉자 조사는 추가 환자 발견뿐만 아니라 잠복결핵감염 치료를 통한 발병 예방을 목적으로 합니다." },
            { id: 19, q: "호흡기 결핵 환자의 가족접촉자 조사 대상 기간으로 옳은적절한 것은? (19번 문항)", options: ["진단일 기준 1개월 전 ~ 치료 시작 후 1주", "진단일 기준 3개월 전 ~ 치료 시작 후 2주", "진단일 기준 6개월 전 ~ 치료 종료 시", "증상 발생 1년 전 ~ 치료 시작 시점"], a: 1, exp: "호흡기 결핵 환자의 진단일 기준 3개월 이전부터 치료 시작 후 2주까지 접촉한 가족 및 동거인이 대상입니다." },
            { id: 20, q: "[상황제시형] 만 8세 이하 소아 폐외결핵 환자가 발생했을 때, 가족접촉자 조사를 시행하는 주된 어느 것인가? (20번 문항)", options: ["소아의 성장 발달 지연 방지", "가족 중 숨은 감염원을 파악하기 위해", "유치원 내 집단 발병을 막기 위해", "예방접종력 조사를 위해"], a: 1, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원 파악을 위해 조사를 실시합니다." },
            { id: 21, q: "결핵환자 신고 후, 가족접촉자는 언제까지 검진을 받아야 한다고 안내어느 것인가? (21번 문항)", options: ["신고일 기준 1주일 이내", "신고일 기준 2주일 이내", "신고일 기준 1개월 이내", "신고일 기준 3개월 이내"], a: 2, exp: "환자 신고일 기준으로 1개월 내에 가족접촉자 검진의료기관이나 보건소를 방문하여 검사를 받도록 안내해야 합니다." },
            { id: 22, q: "가족접촉자 전원을 대상으로 활동성 결핵을 먼저 배제하기 위해 기본적으로 실시하는 어느 것인가? (22번 문항)", options: ["흉부X선 검사", "객담 도말검사", "객담 배양검사", "IGRA 검사"], a: 0, exp: "전체 가족접촉자를 대상으로 활동성 결핵 배제를 위해 가장 먼저 흉부X선 검사를 실시합니다." },

        const STORAGE_KEY = 'tb_quiz_unique500_v1';

        const startBtn = document.getElementById('start-btn');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resetHistoryBtn = document.getElementById('reset-history-btn');

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            let askedIds = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            availableQuestions = questionBank.filter(q => !askedIds.includes(q.id));
            
            if (availableQuestions.length < QUESTIONS_PER_QUIZ) {
                askedIds = [];
                availableQuestions = [...questionBank];
                alert("축하합니다! 500문제를 모두 다 푸셨습니다. 출제 기록이 초기화되어 처음부터 다시 시작합니다.");
            }
            
            shuffle(availableQuestions);
            currentQuiz = availableQuestions.slice(0, QUESTIONS_PER_QUIZ);
            
            askedIds = [...askedIds, ...currentQuiz.map(q => q.id)];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(askedIds));

            currentQuestionIndex = 0;
            score = 0;
        }

        function displayQuestion() {
            isAnswered = false;
            selectedOptionIndex = null;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-counter').innerText = `문제 ${currentQuestionIndex + 1} / ${QUESTIONS_PER_QUIZ}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / QUESTIONS_PER_QUIZ) * 100}%`;

            currentShuffledOptions = q.options.map((text, idx) => ({ text, originalIndex: idx }));
            shuffle(currentShuffledOptions);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            currentShuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-lg border border-gray-300 hover:bg-gray-50 focus:outline-none';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, btnNode) {
            if (isAnswered) return;
            selectedOptionIndex = index;
            
            const buttons = document.getElementById('options-container').children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('selected');
            }
            btnNode.classList.add('selected');
        }

        function checkAnswer() {
            if (selectedOptionIndex === null) {
                alert("정답을 선택해주세요.");
                return;
            }
            
            isAnswered = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;
            
            const correctOriginalIndex = q.a;

            for (let i = 0; i < buttons.length; i++) {
                if (currentShuffledOptions[i].originalIndex === correctOriginalIndex) {
                    buttons[i].classList.add('correct');
                    if (i === selectedOptionIndex) {
                        score += 10;
                    }
                } else if (i === selectedOptionIndex) {
                    buttons[i].classList.add('incorrect');
                }
            }

            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_QUIZ) * 100}%`;
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;
        }

            initQuiz();
            document.getElementById('start-screen').classList.add('hidden');

        restartBtn.addEventListener('click', () => {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("모든 문제 출제 기록을 초기화하시겠습니까? 처음부터 다시 500문제가 새롭게 출제됩니다.")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("초기화 완료되었습니다.");
            }
        });

    </script>
</body>
</html>
