<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn.selected { background-color: #dbeafe; border-color: #3b82f6; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
    </style>
</head>
<body class="text-gray-800">
    <div class="max-w-3xl mx-auto p-4 md:p-8 mt-10 bg-white rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">2026 국가결핵관리지침 퀴즈</h1>
        
        <div id="start-screen" class="text-center py-10">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-md transition-transform transform hover:scale-105">
                퀴즈 시작하기
            </button>
            <div class="mt-6 text-sm text-blue-600 font-medium">호남권질병대응센터 감염병대응과</div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-4 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-500" id="question-counter">문제 1 / 10</span>
                <div class="w-2/3 bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full" id="progress-bar" style="width: 10%"></div>
                </div>
            </div>
            
            <div id="question-container" class="mb-6">
                <h2 class="text-xl font-bold mb-4" id="question-text">문제 내용</h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-container" class="hidden p-4 mb-6 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="font-bold text-yellow-800 mb-1">해설:</p>
                <p id="explanation-text" class="text-gray-700 text-sm"></p>
            </div>

            <div class="flex justify-end mt-4">
                <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg">다음 문제</button>
                <button id="submit-btn" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg">정답 확인</button>
            </div>
        </div>

        <div id="result-screen" class="hidden py-8">
            <h2 class="text-3xl font-bold mb-4 text-center">퀴즈 완료!</h2>
            <p class="text-xl mb-6 text-center">당신의 점수는 <span id="score-text" class="font-bold text-blue-600 text-2xl"></span>점 입니다.</p>
            
            <div id="wrong-summary-container" class="mb-8">
                <h3 class="text-lg font-bold text-red-600 mb-3 border-b pb-2">오답 노트</h3>
                <ul id="wrong-list" class="space-y-4"></ul>
            </div>

            <div class="flex justify-center space-x-4">
                <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md">
                    새로운 10문제 풀기
                </button>
                <button id="reset-history-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg shadow-md">
                    출제 기록 초기화
                </button>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            { id: 1, q: "국가결핵관리지침상, (정지원 환자 사례) 가족접촉자 중 다제내성결핵 환자의 접촉자인 경우, 객담 검사 시 추가로 시행해야 하는 검사는 가장 올바른 것은?", options: ["결핵균 통상감수성검사", "결핵균 피부반응검사(TST)", "단순 항산균 도말검사", "Xpert MTB/RIF 또는 BD max"], a: 3, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 2, q: "현장 대응 시, 신생아(생후 4주 이하)가 활동성 결핵환자와 긴밀 접촉 시, 활동성 배제 후 취해야 할 1차 조치는 맞는 설명은?", options: ["생백신 접종 보류", "관찰 후 6개월 뒤 IGRA 검사", "TST 판독 전까지 이소니아지드 투여", "즉시 BCG 접종"], a: 2, exp: "활동성 결핵 배제 후 생후 3개월 이후 TST를 시행하며, 판독 전까지 이소니아지드를 선제 투여합니다." },
            { id: 3, q: "지침에 따르면, 결핵환자 \'취약성평가\' 결과에 따른 \'중위험군\' 점수 구간으로 올바른 것은 맞는 설명은?", options: ["46점 이상", "0~16점", "17~30점", "31~45점"], a: 2, exp: "취약성평가 저위험군은 16점 이하, 중위험군은 17~30점, 고위험군은 31점 이상입니다." },
            { id: 4, q: "국가결핵관리지침상, 신생아(생후 4주 이하)가 활동성 결핵환자와 긴밀 접촉 시, 활동성 배제 후 취해야 할 1차 조치는 옳은 것은?", options: ["관찰 후 6개월 뒤 IGRA 검사", "TST 판독 전까지 이소니아지드 투여", "즉시 BCG 접종", "생백신 접종 보류"], a: 1, exp: "활동성 결핵 배제 후 생후 3개월 이후 TST를 시행하며, 판독 전까지 이소니아지드를 선제 투여합니다." },
            { id: 5, q: "현장 대응 시, 결핵환자 \'취약성평가\' 결과에 따른 \'중위험군\' 점수 구간으로 올바른 것은 무엇인가?", options: ["17~30점", "0~16점", "46점 이상", "31~45점"], a: 0, exp: "취약성평가 저위험군은 16점 이하, 중위험군은 17~30점, 고위험군은 31점 이상입니다." },
            { id: 6, q: "결핵역학조사 시, 결핵 산정특례 적용을 확진일로부터 소급하여 받기 위해 신청해야 하는 법정 기한은 옳은 것은?", options: ["14일 이내", "30일 이내", "60일 이내", "7일 이내"], a: 1, exp: "확진일로부터 30일 이내에 신청해야 확진일(공휴일 포함)부터 소급하여 적용받을 수 있습니다." },
            { id: 7, q: "결핵역학조사 시, 가족접촉자 조사의 주된 목적 중 \'추가 결핵환자 발견\' 외에 또 다른 핵심 목적은 옳은 것은?​", options: ["직장 내 방역 소독 여부 점검", "의료기관 평가 자료 수집", "환자 가족의 건강보험 자격 심사", "잠복결핵감염 치료를 통한 결핵 발병 예방"], a: 3, exp: "가족접촉자 조사는 추가 환자 발견뿐만 아니라 잠복결핵감염 치료를 통한 발병 예방을 목적으로 합니다." },
            { id: 8, q: "국가결핵관리지침상, 전염성 결핵환자의 경우, 치료 시작 후 전염성 기간(초기 2주간)의 권장 기본 복약확인 주기는 어느 것인가?", options: ["주 1회", "주 3회", "월 1회", "매일 확인"], a: 3, exp: "전염성 환자의 경우 치료시작 이후 2주간(전염성 기간) 매일 복약확인을 실시해야 합니다." },
            { id: 9, q: "질병관리청 지침상, 만 8세 이하 소아 폐외결핵 환자가 발생했을 때, 가족접촉자 조사를 시행하는 주된 이유는 무엇인가?​​​", options: ["유치원 내 집단 발병을 막기 위해", "가족 중 숨은 감염원을 파악하기 위해", "예방접종력 조사를 위해", "소아의 성장 발달 지연 방지"], a: 1, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원 파악을 위해 조사를 실시합니다." },
            { id: 10, q: "현장 대응 시, 5세 이상 정상 면역자의 2차 TST 검사 결과가 \'양전(Positive conversion)\'으로 판정되는 정확한 기준은 무엇인가?", options: ["5mm 이상 증가", "무조건 10mm 이상", "10mm 이상이면서 1차 결과보다 6mm 이상 증가", "15mm 이상 증가"], a: 2, exp: "정상 면역자(5세 이상)는 2차 결과가 10mm 이상이면서 1차보다 6mm 이상 증가해야 양전으로 판정합니다." },
            { id: 11, q: "질병관리청 지침상, 전염성 결핵환자의 경우, 치료 시작 후 전염성 기간(초기 2주간)의 권장 기본 복약확인 주기는 맞는 설명은?", options: ["월 1회", "매일 확인", "주 3회", "주 1회"], a: 1, exp: "전염성 환자의 경우 치료시작 이후 2주간(전염성 기간) 매일 복약확인을 실시해야 합니다." },
            { id: 12, q: "현장 대응 시, 가족접촉자 조사의 주된 목적 중 \'추가 결핵환자 발견\' 외에 또 다른 핵심 목적은 알맞은 것은?", options: ["의료기관 평가 자료 수집", "환자 가족의 건강보험 자격 심사", "잠복결핵감염 치료를 통한 결핵 발병 예방", "직장 내 방역 소독 여부 점검"], a: 2, exp: "가족접촉자 조사는 추가 환자 발견뿐만 아니라 잠복결핵감염 치료를 통한 발병 예방을 목적으로 합니다." },
            { id: 13, q: "질병관리청 지침상, (한도윤 환자 사례) 가족접촉자 조사의 주된 목적 중 \'추가 결핵환자 발견\' 외에 또 다른 핵심 목적은 옳은 것은?", options: ["의료기관 평가 자료 수집", "직장 내 방역 소독 여부 점검", "잠복결핵감염 치료를 통한 결핵 발병 예방", "환자 가족의 건강보험 자격 심사"], a: 2, exp: "가족접촉자 조사는 추가 환자 발견뿐만 아니라 잠복결핵감염 치료를 통한 발병 예방을 목적으로 합니다." },
            { id: 14, q: "결핵역학조사 시, 결핵 산정특례 적용을 확진일로부터 소급하여 받기 위해 신청해야 하는 법정 기한은 맞는 설명은?", options: ["60일 이내", "30일 이내", "7일 이내", "14일 이내"], a: 1, exp: "확진일로부터 30일 이내에 신청해야 확진일(공휴일 포함)부터 소급하여 적용받을 수 있습니다." },
            { id: 15, q: "질병관리청 지침상, 집단시설 현장조사 종료 후, 보건소는 현장조사서를 질병보건통합관리시스템에 며칠 이내에 등록해야 하는가 무엇인가?", options: ["7일 이내", "3일 이내 (근무일 기준)", "14일 이내", "24시간 이내"], a: 1, exp: "현장조사일로부터 3일 이내(근무일 기준)에 현장조사서를 시스템에 등록해야 합니다." },
            { id: 16, q: "실무 가이드라인에 의하면, 집단시설 결핵역학조사의 두 가지 핵심 구성 요소는 맞는 설명은?​​", options: ["지표환자 조사와 접촉자 조사", "의료진 조사와 방역 인력 배치", "환경 소독과 시설 폐쇄", "건강검진과 예방접종 실시"], a: 0, exp: "결핵역학조사는 \'지표환자 조사\'와 \'접촉자 조사\'로 이루어집니다." },
            { id: 17, q: "사례관리 실무에서, 가족접촉자 전원을 대상으로 활동성 결핵을 먼저 배제하기 위해 기본적으로 실시하는 검사는 무엇인가?", options: ["객담 배양검사", "객담 도말검사", "흉부X선 검사", "IGRA 검사"], a: 2, exp: "전체 가족접촉자를 대상으로 활동성 결핵 배제를 위해 가장 먼저 흉부X선 검사를 실시합니다." },
            { id: 18, q: "보건소 결핵관리 담당자로서 알아야 할 내용 중, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준으로 며칠 이내에 실시해야 하는가 옳은 것은?​", options: ["14일 이내", "7일 이내", "당일 이내", "3일 이내 (토·공휴일 제외)"], a: 3, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 공휴일 제외)에 실시해야 합니다." },
            { id: 19, q: "질병관리청 지침상, 결핵환자 \'사례조사\'의 1차 조사는 원칙적으로 신고일 기준으로 며칠 이내에 실시해야 하는가 알맞은 것은?", options: ["3일 이내 (토·공휴일 제외)", "당일 이내", "14일 이내", "7일 이내"], a: 0, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 공휴일 제외)에 실시해야 합니다." },
            { id: 20, q: "국가결핵관리지침상, 만 8세 이하 소아 폐외결핵 환자가 발생했을 때, 가족접촉자 조사를 시행하는 주된 이유는 알맞은 것은?", options: ["유치원 내 집단 발병을 막기 위해", "소아의 성장 발달 지연 방지", "예방접종력 조사를 위해", "가족 중 숨은 감염원을 파악하기 위해"], a: 3, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원 파악을 위해 조사를 실시합니다." },
            { id: 21, q: "보건소 결핵관리 담당자로서 알아야 할 내용 중, 가족접촉자 전원을 대상으로 활동성 결핵을 먼저 배제하기 위해 기본적으로 실시하는 검사는 무엇인가?", options: ["IGRA 검사", "객담 배양검사", "객담 도말검사", "흉부X선 검사"], a: 3, exp: "전체 가족접촉자를 대상으로 활동성 결핵 배제를 위해 가장 먼저 흉부X선 검사를 실시합니다." },
            { id: 22, q: "현장 대응 시, 결핵환자 신고 후, 가족접촉자는 언제까지 검진을 받아야 한다고 안내해야 하는가 맞는 설명은?", options: ["신고일 기준 1주일 이내", "신고일 기준 2주일 이내", "신고일 기준 3개월 이내", "신고일 기준 1개월 이내"], a: 3, exp: "환자 신고일 기준으로 1개월 내에 가족접촉자 검진의료기관이나 보건소를 방문하여 검사를 받도록 안내해야 합니다." },

            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-counter').innerText = `문제 ${currentQuestionIndex + 1} / ${QUESTIONS_PER_QUIZ}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / QUESTIONS_PER_QUIZ) * 100}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-lg border border-gray-300 hover:bg-gray-50 focus:outline-none text-gray-700';
                btn.innerText = optText;
                btn.onclick = () => {
                    if (isAnswered) return;
                    selectedOptionIndex = index;
                    Array.from(optionsContainer.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer() {
            if (selectedOptionIndex === null) {
                alert("정답을 선택해주세요.");
                return;
            }
            
            isAnswered = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;
            
            let isCorrect = false;

            for (let i = 0; i < buttons.length; i++) {
                if (i === q.a) {
                    buttons[i].classList.add('correct');
                    if (i === selectedOptionIndex) {
                        isCorrect = true;
                        score += 10;
                    }
                } else if (i === selectedOptionIndex) {
                    buttons[i].classList.add('incorrect');
                }
            }

            if (!isCorrect) {
                wrongQuestions.push({
                    question: q.q,
                    myAnswer: q.options[selectedOptionIndex],
                    correctAnswer: q.options[q.a],
                    explanation: q.exp
                });
            }

            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_QUIZ) * 100}%`;
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;

            const wrongListContainer = document.getElementById('wrong-list');
            wrongListContainer.innerHTML = '';
            
            if (wrongQuestions.length === 0) {
                wrongListContainer.innerHTML = '<li class="text-green-600 font-bold text-center py-4 bg-green-50 rounded">완벽합니다! 모든 문제를 맞히셨습니다.</li>';
            } else {
                wrongQuestions.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = "bg-red-50 p-4 rounded-lg border border-red-100";
                    li.innerHTML = `
                        <p class="font-bold text-gray-800 mb-2">Q${idx+1}. ${item.question}</p>
                        <p class="text-sm text-red-600 mb-1"><span class="font-semibold">내가 고른 답:</span> ${item.myAnswer}</p>
                        <p class="text-sm text-blue-600 mb-3"><span class="font-semibold">정답:</span> ${item.correctAnswer}</p>
                        <p class="text-sm text-gray-700 bg-white p-3 rounded border"><span class="font-semibold text-yellow-600">해설:</span> ${item.explanation}</p>
                    `;
                    wrongListContainer.appendChild(li);
                });
            }
        }

        startBtn.addEventListener('click', () => {
            initQuiz();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            displayQuestion();
        });

        submitBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_QUIZ) {
                displayQuestion();
            } else {
                showResults();
            }
        });

        restartBtn.addEventListener('click', () => {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("모든 문제 출제 기록을 초기화하시겠습니까? (처음부터 500문제가 새롭게 출제됩니다)")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("초기화 완료되었습니다.");
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
