<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 국가결핵관리지침 실전 퀴즈 (500제)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Pretendard', sans-serif; }
        .hidden { display: none; }
        .option-btn { transition: all 0.2s; }
        .option-btn.selected { background-color: #dbeafe; border-color: #3b82f6; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .option-btn.incorrect { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .quiz-container { min-height: 400px; }
    </style>
</head>
<body class="text-gray-800">
    <div class="max-w-3xl mx-auto p-4 md:p-8 mt-10 bg-white rounded-xl shadow-lg quiz-container">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-2">2026 국가결핵관리지침 실전 퀴즈</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">500개의 독립 데이터베이스에서 10문제씩 랜덤 출제됩니다.</p>
        
        <div id="start-screen" class="text-center py-12">
            <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transition-transform transform hover:scale-105 text-lg">
                퀴즈 시작하기
            </button>
            <div class="mt-8 text-sm text-blue-600 font-medium bg-blue-50 inline-block px-4 py-2 rounded-lg">호남권질병대응센터 감염병대응과 제공</div>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="mb-4 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-500" id="question-counter">문제 1 / 10</span>
                <div class="w-2/3 bg-gray-200 rounded-full h-2.5">
                    <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" id="progress-bar" style="width: 10%"></div>
                </div>
            </div>
            
            <div id="question-container" class="mb-6">
                <h2 class="text-xl font-bold mb-5 leading-relaxed" id="question-text">문제 내용</h2>
                <div id="options-container" class="space-y-3"></div>
            </div>

            <div id="explanation-container" class="hidden p-5 mb-6 bg-yellow-50 border border-yellow-200 rounded-lg shadow-sm">
                <p class="font-bold text-yellow-800 mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>
                    해설 및 지침 근거
                </p>
                <p id="explanation-text" class="text-gray-700 text-sm leading-relaxed"></p>
            </div>

            <div class="flex justify-end mt-4">
                <button id="next-btn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition">다음 문제 ➔</button>
                <button id="submit-btn" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition">정답 확인</button>
            </div>
        </div>

        <div id="result-screen" class="hidden py-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold mb-4 text-gray-800">퀴즈 완료!</h2>
                <div class="inline-block bg-blue-50 px-8 py-4 rounded-xl border border-blue-100">
                    <p class="text-lg text-gray-600 mb-1">당신의 점수는</p>
                    <p class="text-4xl font-extrabold text-blue-600"><span id="score-text"></span>점</p>
                </div>
            </div>
            
            <div id="wrong-summary-container" class="mb-10">
                <h3 class="text-xl font-bold text-red-600 mb-4 border-b-2 border-red-100 pb-2 flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    틀린 문제 오답 노트
                </h3>
                <ul id="wrong-list" class="space-y-4"></ul>
            </div>

            <div class="flex flex-col sm:flex-row justify-center space-y-3 sm:space-y-0 sm:space-x-4">
                <button id="restart-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-md w-full sm:w-auto">
                    새로운 10문제 풀기
                </button>
                <button id="reset-history-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-8 rounded-lg shadow-md w-full sm:w-auto">
                    전체 출제 기록 초기화
                </button>
            </div>
        </div>
    </div>

    <script>
        const questionBank = [
            { id: 449, q: "국가결핵관리지침 제2절에 의하면, [박○민 환자 관련] 가족접촉자 조사의 주된 목적으로 추가 결핵환자 발견 외에 가장 중요한 것은? 옳은 것은?", options: ["거주지 방역 소독 필요성 판단", "환자 가족의 건강보험 자격 심사 및 진료비 지원", "지역사회 감염병 통계 산출을 위한 데이터 수집", "잠복결핵감염 치료를 통한 결핵 발병 예방"], a: 3, exp: "가족접촉자 조사는 추가 환자 발견뿐만 아니라 잠복결핵감염 치료를 통한 발병 예방을 목적으로 합니다." },
            { id: 313, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 맞춤형 사례관리를 위해 보건소 전담요원이 \'사례상담\'을 필수로 진행해야 하는 취약성평가 위험도 기준은? 알맞은 것은?", options: ["중위험군 이상 (중위험군 및 고위험군)", "저위험군을 포함한 모든 결핵 환자", "고위험군 환자만 전담", "전염성 결핵 환자 전원"], a: 0, exp: "취약성평가 결과 \'중위험군\' 이상의 위험도를 가진 환자를 대상으로 심층적인 사례상담을 필수 진행합니다." },
            { id: 143, q: "최신 지침을 기준으로 볼 때, [의료기관 결핵 발생 사례] 5세 이상 정상 면역자의 2차 TST 검사 결과에서 \'양전(Positive conversion)\'으로 판정하는 수치 기준은? 옳은 것은?", options: ["2차 결과가 10mm 이상이면서 1차보다 6mm 이상 증가", "2차 결과가 무조건 15mm 이상일 때", "2차 결과가 1차 결과보다 10mm 이상 증가할 때", "2차 결과가 5mm 이상이며 1차 대비 5mm 증가"], a: 0, exp: "5세 이상 정상 면역자는 2차 TST가 10mm 이상이면서 1차 대비 6mm 이상 증가했을 때 양전으로 판정합니다." },
            { id: 186, q: "최신 지침을 기준으로 볼 때, [종합병원 결핵 발생 사례] 지표환자가 다제내성결핵(MDR-TB)인 경우, 밀접접촉자의 잠복결핵감염 치료를 위해 전문가 상의 후 고려할 수 있는 요법은? 적절한 설명은?", options: ["리팜핀 4개월 요법 (4R)", "이소니아지드 9개월 요법 (9H)", "레보플록사신 6개월 요법 (6Lfx)", "피라진아미드 단독 2개월 요법"], a: 2, exp: "다제내성 결핵 접촉자의 경우 득실을 고려하여 레보플록사신 6개월(6Lfx) 요법을 권고할 수 있습니다." },
            { id: 477, q: "결핵역학조사 현장 대응 원칙상, [박○아 환자 관련] 결핵환자가 진료비 본인부담을 면제받는 \'산정특례\'를 확진일로부터 소급하여 적용받으려면 확진일 기준 며칠 이내에 신청해야 하는가에 대하여 적절한 설명은?", options: ["14일 이내", "7일 이내", "30일 이내", "60일 이내"], a: 2, exp: "확진일로부터 30일 이내에 국민건강보험공단에 신청해야 확진일(공휴일 포함)부터 소급하여 혜택을 적용받을 수 있습니다." },
            { id: 227, q: "최신 지침을 기준으로 볼 때, [대학교 기숙사 결핵 발생 사례] 잠복결핵감염 치료 중 부작용 모니터링을 위해 기본적으로 권장되는 간기능 검사(AST/ALT 등)의 주기는? 알맞은 것은?", options: ["치료 시작 후 1주, 2주 차만 실시", "치료 시작 3개월 후 1회 실시", "치료 종료 시점에 1회 최종 확인", "치료 시작 후 2주, 4주 및 이후 매달"], a: 3, exp: "치료 시작 후 2주, 4주차에 시행하고, 이후 치료 종료 시까지 정기적으로 매달 검사합니다." },
            { id: 381, q: "최신 지침을 기준으로 볼 때, [이○연 환자 관련] 잠복결핵감염 검사를 위해 투베르쿨린 피부반응검사(TST)를 실시하기 전, 위음성 방지를 위해 반드시 확인해야 할 접종력은? 알맞은 것은?", options: ["최근 3개월 이내 모든 백신 접종력", "최근 4주 이내 생백신 접종력", "최근 4주 이내 사백신 접종력", "최근 2주 이내 코로나19 백신 접종력"], a: 1, exp: "생백신 접종은 TST 검사에 위음성 영향을 미칠 수 있으므로, 최근 4주 이내 생백신 접종력을 확인해야 합니다." },
            { id: 414, q: "결핵역학조사 현장 대응 원칙상, [어린이집 결핵 발생 사례] 집단시설 결핵역학조사에서 \'밀접접촉자\'로 분류하기 위한 지표환자와의 접촉 시간 기준은? 맞는 설명은?", options: ["누적 100시간 이상", "하루 연속 8시간 이상 또는 누적 40시간 이상", "하루 연속 12시간 이상 또는 누적 60시간 이상", "하루 연속 4시간 이상 또는 누적 20시간 이상"], a: 1, exp: "하루에 연속으로 8시간 이상 접촉하거나, 전염성 추정기간 동안 누적 40시간 이상 접촉한 사람을 밀접접촉자로 분류합니다." },
            { id: 161, q: "보건소 실무 지침서에 명시된 바에 따라, [이○연 환자 관련] 호흡기 결핵 환자의 가족접촉자 조사 대상 기간은 언제부터 언제까지인가? 알맞은 것은?", options: ["진단일 기준 1개월 전부터 치료 시작 후 1주까지", "증상 발생 6개월 전부터 치료 종료 시까지", "진단일 기준 3개월 전부터 치료 시작 후 2주까지", "진단일 기준 6개월 전부터 전염성 소실 시점까지"], a: 2, exp: "호흡기 결핵 환자의 진단일을 기준으로 3개월 이전부터 치료 시작 후 2주까지 같은 공간에서 생활하거나 주기적으로 접촉한 가족 및 동거인이 대상입니다." },
            { id: 445, q: "국가결핵관리지침 제2절에 의하면, [콜센터 결핵 발생 사례] 지표환자가 다제내성결핵인 경우, 기침 증상이 있는 접촉자의 객담 검사 시 반드시 포함해야 하는 검사는? 가장 올바른 것은?", options: ["결핵균 통상감수성검사", "결핵균 피부반응검사(TST)", "단순 항산균 도말검사", "결핵균 핵산증폭검사(Xpert MTB/RIF 또는 BD max)"], a: 3, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 410, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 임산부인 가족접촉자가 방사선 노출 우려로 흉부X선 검사를 거부할 경우 적절한 조치는? 알맞은 것은?", options: ["흉부X선 대신 즉시 잠복결핵감염 치료 약제를 투여한다.", "출산 후 6개월까지 모든 검사를 보류한다.", "납치마를 착용하고 검사를 받도록 권고한다.", "객담 도말검사만 3회 실시하고 조사를 종료한다."], a: 2, exp: "임산부라도 납치마(차폐복)를 착용하면 태아에게 미치는 방사선 영향이 거의 없으므로 활동성 결핵 배제를 위해 검사를 권고합니다." },
            { id: 330, q: "국가결핵관리지침 제2절에 의하면, [대학교 기숙사 결핵 발생 사례] 임산부인 가족접촉자가 방사선 노출 우려로 흉부X선 검사를 거부할 경우 적절한 조치는? 맞는 설명은?", options: ["객담 도말검사만 3회 실시하고 조사를 종료한다.", "납치마를 착용하고 검사를 받도록 권고한다.", "출산 후 6개월까지 모든 검사를 보류한다.", "흉부X선 대신 즉시 잠복결핵감염 치료 약제를 투여한다."], a: 1, exp: "임산부라도 납치마(차폐복)를 착용하면 태아에게 미치는 방사선 영향이 거의 없으므로 활동성 결핵 배제를 위해 검사를 권고합니다." },
            { id: 37, q: "보건소 실무 지침서에 명시된 바에 따라, [노인요양원 결핵 발생 사례] 결핵환자가 진료비 본인부담을 면제받는 \'산정특례\'를 확진일로부터 소급하여 적용받으려면 확진일 기준 며칠 이내에 신청해야 하는가에 대하여 가장 올바른 것은?", options: ["60일 이내", "30일 이내", "14일 이내", "7일 이내"], a: 1, exp: "확진일로부터 30일 이내에 국민건강보험공단에 신청해야 확진일(공휴일 포함)부터 소급하여 혜택을 적용받을 수 있습니다." },
            { id: 88, q: "감염병 대응 매뉴얼을 적용할 때, [정○원 환자 관련] 다제내성결핵 환자의 접촉자 중 잠복결핵감염 미치료자에 대한 추적검사(흉부X선) 횟수는? 옳은 것은?", options: ["1년간 총 4회 (3, 6, 9, 12개월)", "2년간 총 6회 (3, 6, 9, 12, 18, 24개월)", "3년간 총 3회 (매년 1회)", "5년간 총 5회 (매년 1회)"], a: 1, exp: "다제내성결핵 접촉자 중 잠복결핵 미치료자는 2년에 걸쳐 총 6회 추적 관찰을 시행합니다." },
            { id: 114, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 취약성평가 결과 \'고위험군\'으로 분류된 초치료 결핵 신환자의 권장 복약확인 횟수는? 옳은 것은?", options: ["주 4~5회 확인", "월 1~2회 확인", "주 1~2회 확인", "2주 1회 확인"], a: 0, exp: "고위험군 신환자의 경우 복약 순응도가 떨어질 우려가 있어 주 4~5회 철저히 복약 여부를 확인해야 합니다." },

            { id: 344, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 잠복결핵감염 치료 전 흉부X선 등을 통해 \'활동성 결핵\'을 반드시 배제해야 하는 가장 핵심적인 이유는? 옳은 것은?", options: ["환자의 치료 순응도와 거부감을 줄이기 위해서", "결핵 약제에 의한 급성 간독성을 예방하기 위해서", "활동성 결핵 상태에서 1~2제 약제만 쓸 경우 내성결핵이 유발될 수 있어서", "잠복결핵 치료 약제가 너무 고가여서"], a: 2, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제(단일 또는 2제)로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 213, q: "국가결핵관리지침 제2절에 의하면, [임○아 환자 관련] 집단시설 내에서 역학적 연관성이 있는 결핵환자가 몇 명 이상, 어떤 기준 내에 발생했을 때 집중 조사를 실시하는가에 대하여 옳은 것은?", options: ["3개월 이내 3명 이상", "기간 상관없이 5명 이상", "6개월 이내 2명 이상", "1년 이내 1명 이상"], a: 2, exp: "호흡기검체 결과와 상관없이 6개월 이내에 연관성이 있는 환자가 2명 이상 발생 시 조사를 실시합니다." },
            { id: 240, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 사망한 결핵환자(사후 진단 포함)에 대해서도 역학조사를 위해 결핵균 약제감수성 검사를 의뢰할 수 있다. 이 비용은 처리는 맞는 설명은?", options: ["해당 의료기관이 전액 부담", "질병관리청(보건소) 예산을 통해 지원 가능", "사망자 유가족에게 전액 청구", "국민건강보험공단에서 100% 사후 환급"], a: 1, exp: "사후 진단 등으로 약제감수성 검사가 필요한 경우 공중보건학적 목적을 위해 국가(보건소) 예산으로 비용을 지원합니다." },
            { id: 346, q: "최신 지침을 기준으로 볼 때, [대학교 기숙사 결핵 발생 사례] 지표환자가 다제내성결핵(MDR-TB)인 경우, 밀접접촉자의 잠복결핵감염 치료를 위해 전문가 상의 후 고려할 수 있는 요법은? 알맞은 것은?", options: ["피라진아미드 단독 2개월 요법", "이소니아지드 9개월 요법 (9H)", "레보플록사신 6개월 요법 (6Lfx)", "리팜핀 4개월 요법 (4R)"], a: 2, exp: "다제내성 결핵 접촉자의 경우 득실을 고려하여 레보플록사신 6개월(6Lfx) 요법을 권고할 수 있습니다." },
            { id: 148, q: "최신 지침을 기준으로 볼 때, [한○윤 환자 관련] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 옳은 것은?", options: ["판정보류로 3개월 뒤 TST를 재검한다.", "흉부X선 결과와 무관하게 양전으로 간주한다.", "음성으로 판정하여 치료를 시행하지 않는다.", "양성으로 판정하여 즉시 치료를 시작한다."], a: 2, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 46, q: "국가결핵관리지침 제2절에 의하면, [의료기관 결핵 발생 사례] 가족접촉자의 초회 잠복결핵감염검사(TST 또는 IGRA)가 음성으로 나왔을 때, 2차 검사(연속검사)는 언제 시행하는가에 대하여 옳은 것은?", options: ["마지막 접촉일 기준 2~4주 후", "마지막 접촉일 기준 6개월 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 후", "마지막 접촉일 기준 4~6주 후"], a: 2, exp: "초회 검사 음성 시 창문기(Window period)를 고려하여 8~10주 이후에 2차 검사를 실시합니다." },
            { id: 184, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 잠복결핵감염 치료 전 흉부X선 등을 통해 \'활동성 결핵\'을 반드시 배제해야 하는 가장 핵심적인 이유는? 적절한 설명은?", options: ["활동성 결핵 상태에서 1~2제 약제만 쓸 경우 내성결핵이 유발될 수 있어서", "환자의 치료 순응도와 거부감을 줄이기 위해서", "결핵 약제에 의한 급성 간독성을 예방하기 위해서", "잠복결핵 치료 약제가 너무 고가여서"], a: 0, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제(단일 또는 2제)로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 238, q: "보건소 실무 지침서에 명시된 바에 따라, [종합병원 결핵 발생 사례] 결핵 \'안심벨트 지원사업\'의 주된 목적과 지원 대상으로 가장 올바른 것은? 옳은 것은?", options: ["다제내성결핵 환자의 해외 이송 비용 지원", "사회·경제적 취약계층 결핵환자의 간병비, 이송비 등 지원", "보건소 의료진의 방역복 및 장비 구매 지원", "모든 국민의 결핵 검진 비용 전액 지원"], a: 1, exp: "결핵 안심벨트 지원사업은 결핵환자 중 취약계층을 대상으로 입원비, 간병비, 영양 간식 등을 지원하는 사업입니다." },
            { id: 481, q: "감염병 대응 매뉴얼을 적용할 때, [대학교 기숙사 결핵 발생 사례] 호흡기 결핵 환자의 가족접촉자 조사 대상 기간은 언제부터 언제까지인가? 알맞은 것은?", options: ["진단일 기준 6개월 전부터 전염성 소실 시점까지", "진단일 기준 1개월 전부터 치료 시작 후 1주까지", "증상 발생 6개월 전부터 치료 종료 시까지", "진단일 기준 3개월 전부터 치료 시작 후 2주까지"], a: 3, exp: "호흡기 결핵 환자의 진단일을 기준으로 3개월 이전부터 치료 시작 후 2주까지 같은 공간에서 생활하거나 주기적으로 접촉한 가족 및 동거인이 대상입니다." },
            { id: 30, q: "결핵역학조사 현장 대응 원칙상, [이○연 환자 관련] 잠복결핵감염 치료 대상자가 치료 중 타 지역으로 전출(이사)을 간 경우 올바른 행정 조치는? 적절한 설명은?", options: ["이사한 즉시 치료를 중단하고 새로 진단받도록 한다.", "기존 보건소에서 치료가 끝날 때까지 원격 관리한다.", "산정특례를 취소하고 일반 건강보험으로 전환한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리한다."], a: 3, exp: "전출 시 신규 거주지 관할 보건소로 관리 기관을 변경(이관)하여 치료가 중단되지 않도록 연계해야 합니다." },
            { id: 90, q: "결핵역학조사 현장 대응 원칙상, [김○현 환자 관련] 임산부인 가족접촉자가 방사선 노출 우려로 흉부X선 검사를 거부할 경우 적절한 조치는? 가장 올바른 것은?", options: ["출산 후 6개월까지 모든 검사를 보류한다.", "납치마를 착용하고 검사를 받도록 권고한다.", "객담 도말검사만 3회 실시하고 조사를 종료한다.", "흉부X선 대신 즉시 잠복결핵감염 치료 약제를 투여한다."], a: 1, exp: "임산부라도 납치마(차폐복)를 착용하면 태아에게 미치는 방사선 영향이 거의 없으므로 활동성 결핵 배제를 위해 검사를 권고합니다." },
            { id: 132, q: "결핵역학조사 현장 대응 원칙상, [고등학교 결핵 발생 사례] 집단시설 내 결핵환자 발생 시, 호흡기검체 검사 결과가 음성일지라도 역학조사를 실시해야 하는 경우는? 알맞은 것은?", options: ["과거 결핵 약제를 복용한 이력이 있을 때", "기침, 가래 증상이 1개월 이상 지속될 때", "환자가 만 65세 이상의 고령일 때", "흉부X선 상 공동(cavity)이 확인된 경우"], a: 3, exp: "검체가 음성이더라도 흉부X선 상 \'공동\'이 있다면 전염성이 있을 가능성이 커서 조사를 실시합니다." },
            { id: 202, q: "국가결핵관리지침 제2절에 의하면, [일반 사업장 결핵 발생 사례] 만 8세 이하 소아 폐외결핵 환자 발생 시, 가족접촉자 조사를 시행하는 주된 이유는 가장 올바른 것은?", options: ["소아의 결핵 발병으로 인한 성장 지연을 막기 위해", "가족 중 숨은 감염원(결핵환자)을 파악하기 위해", "유치원 등 집단시설로의 확산을 선제적으로 차단하기 위해", "예방접종(BCG) 이상반응 여부를 확인하기 위해"], a: 1, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원을 찾기 위해 역학조사를 실시합니다." },
            { id: 222, q: "보건소 실무 지침서에 명시된 바에 따라, [대학교 기숙사 결핵 발생 사례] 생후 4주 이하의 신생아가 전염성 결핵환자와 긴밀하게 접촉했다. 활동성 결핵 배제 후 즉시 취해야 할 조치는? 가장 올바른 것은?", options: ["즉시 리팜핀을 4개월간 투여한다.", "아무 조치 없이 6개월 뒤 IGRA 검사만 시행한다.", "BCG 백신을 즉시 접종한다.", "생후 3개월 이후 TST 판독 전까지 이소니아지드를 예방적으로 투여한다."], a: 3, exp: "활동성 결핵이 배제되면, 생후 3개월 이후 TST를 시행하고 그 전까지 예방적으로 이소니아지드를 선제 투여합니다." },
            { id: 365, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 지표환자가 다제내성결핵인 경우, 기침 증상이 있는 접촉자의 객담 검사 시 반드시 포함해야 하는 검사는? 가장 올바른 것은?", options: ["결핵균 통상감수성검사", "단순 항산균 도말검사", "결핵균 핵산증폭검사(Xpert MTB/RIF 또는 BD max)", "결핵균 피부반응검사(TST)"], a: 2, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 391, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 결핵환자 신고 접수 후, 관할 보건소가 실시하는 \'1차 사례조사\'의 완료 기한은? 알맞은 것은?", options: ["신고일 기준 14일 이내", "신고일 기준 7일 이내", "신고일 당일 자정까지", "신고일 기준 3일 이내 (토·공휴일 제외)"], a: 3, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 법정공휴일 제외)에 완료해야 합니다." },
            { id: 181, q: "결핵역학조사 현장 대응 원칙상, [종합병원 결핵 발생 사례] 잠복결핵감염 검사를 위해 투베르쿨린 피부반응검사(TST)를 실시하기 전, 위음성 방지를 위해 반드시 확인해야 할 접종력은? 옳은 것은?", options: ["최근 2주 이내 코로나19 백신 접종력", "최근 4주 이내 생백신 접종력", "최근 4주 이내 사백신 접종력", "최근 3개월 이내 모든 백신 접종력"], a: 1, exp: "생백신 접종은 TST 검사에 위음성 영향을 미칠 수 있으므로, 최근 4주 이내 생백신 접종력을 확인해야 합니다." },

            { id: 395, q: "결핵역학조사 현장 대응 원칙상, [김○수 환자 관련] 취약성평가 결과 \'저위험군\'으로 분류된 환자의 기본 복약확인 권장 주기는? 적절한 설명은?", options: ["월 1~2회", "주 4~5회", "매일 확인", "주 1~2회"], a: 0, exp: "저위험군의 경우 의료기관이나 보건소를 통해 외래 중심으로 월 1~2회 규칙적인 복약 여부를 확인합니다." },
            { id: 200, q: "보건소 실무 지침서에 명시된 바에 따라, [이○희 환자 관련] 사망한 결핵환자(사후 진단 포함)에 대해서도 역학조사를 위해 결핵균 약제감수성 검사를 의뢰할 수 있다. 이 비용은 처리는 알맞은 것은?", options: ["해당 의료기관이 전액 부담", "질병관리청(보건소) 예산을 통해 지원 가능", "사망자 유가족에게 전액 청구", "국민건강보험공단에서 100% 사후 환급"], a: 1, exp: "사후 진단 등으로 약제감수성 검사가 필요한 경우 공중보건학적 목적을 위해 국가(보건소) 예산으로 비용을 지원합니다." },
            { id: 317, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 결핵환자가 진료비 본인부담을 면제받는 \'산정특례\'를 확진일로부터 소급하여 적용받으려면 확진일 기준 며칠 이내에 신청해야 하는가에 대하여 알맞은 것은?", options: ["30일 이내", "14일 이내", "7일 이내", "60일 이내"], a: 0, exp: "확진일로부터 30일 이내에 국민건강보험공단에 신청해야 확진일(공휴일 포함)부터 소급하여 혜택을 적용받을 수 있습니다." },
            { id: 352, q: "국가결핵관리지침 제2절에 의하면, [박○민 환자 관련] 결핵환자 \'취약성평가\' 결과에 따라 환자를 분류할 때, \'중위험군\'에 해당하는 점수 구간은? 맞는 설명은?", options: ["17점 이상 30점 이하", "31점 이상 45점 이하", "16점 이하", "46점 이상"], a: 0, exp: "취약성평가 결과 저위험군은 16점 이하, 중위험군은 17~30점, 고위험군은 31점 이상으로 분류합니다." },
            { id: 215, q: "최신 지침을 기준으로 볼 때, [한○윤 환자 관련] 보건소가 집단시설 현장조사를 완료한 후, 현장조사서를 질병보건통합관리시스템에 등록해야 하는 기한은? 맞는 설명은?", options: ["현장조사일로부터 3일 이내 (근무일 기준)", "24시간 이내", "현장조사일로부터 14일 이내", "현장조사일로부터 7일 이내"], a: 0, exp: "현장조사일로부터 근무일 기준 3일 이내에 시스템에 현장조사서를 등록해야 합니다." },
            { id: 23, q: "결핵역학조사 현장 대응 원칙상, [정○원 환자 관련] 5세 이상 정상 면역자의 2차 TST 검사 결과에서 \'양전(Positive conversion)\'으로 판정하는 수치 기준은? 가장 올바른 것은?", options: ["2차 결과가 5mm 이상이며 1차 대비 5mm 증가", "2차 결과가 10mm 이상이면서 1차보다 6mm 이상 증가", "2차 결과가 무조건 15mm 이상일 때", "2차 결과가 1차 결과보다 10mm 이상 증가할 때"], a: 1, exp: "5세 이상 정상 면역자는 2차 TST가 10mm 이상이면서 1차 대비 6mm 이상 증가했을 때 양전으로 판정합니다." },
            { id: 92, q: "보건소 실무 지침서에 명시된 바에 따라, [의료기관 결핵 발생 사례] 집단시설 내 결핵환자 발생 시, 호흡기검체 검사 결과가 음성일지라도 역학조사를 실시해야 하는 경우는? 맞는 설명은?", options: ["환자가 만 65세 이상의 고령일 때", "기침, 가래 증상이 1개월 이상 지속될 때", "과거 결핵 약제를 복용한 이력이 있을 때", "흉부X선 상 공동(cavity)이 확인된 경우"], a: 3, exp: "검체가 음성이더라도 흉부X선 상 \'공동\'이 있다면 전염성이 있을 가능성이 커서 조사를 실시합니다." },

            { id: 93, q: "최신 지침을 기준으로 볼 때, [송○진 환자 관련] 집단시설 내에서 역학적 연관성이 있는 결핵환자가 몇 명 이상, 어떤 기준 내에 발생했을 때 집중 조사를 실시하는가에 대하여 가장 올바른 것은?", options: ["3개월 이내 3명 이상", "기간 상관없이 5명 이상", "6개월 이내 2명 이상", "1년 이내 1명 이상"], a: 2, exp: "호흡기검체 결과와 상관없이 6개월 이내에 연관성이 있는 환자가 2명 이상 발생 시 조사를 실시합니다." },
            { id: 256, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 5세 미만 결핵환자의 감염원 조사 시, M. bovis BCG 감염과 일반 결핵을 감별하기 위해 의뢰하는 검사는? 알맞은 것은?", options: ["결핵균 항산균 도말검사", "혈청학적 면역검사", "결핵균 유전형 검사", "HIV 항체 혈액 검사"], a: 2, exp: "BCG 예방접종 이상반응(M. bovis BCG 감염) 여부를 확인하기 위해 질병관리청에 유전형 검사를 의뢰합니다." },

            { id: 373, q: "보건소 실무 지침서에 명시된 바에 따라, [대형 학원 결핵 발생 사례] 집단시설 내에서 역학적 연관성이 있는 결핵환자가 몇 명 이상, 어떤 기준 내에 발생했을 때 집중 조사를 실시하는가에 대하여 맞는 설명은?", options: ["기간 상관없이 5명 이상", "3개월 이내 3명 이상", "1년 이내 1명 이상", "6개월 이내 2명 이상"], a: 3, exp: "호흡기검체 결과와 상관없이 6개월 이내에 연관성이 있는 환자가 2명 이상 발생 시 조사를 실시합니다." },
            { id: 403, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 결핵환자 신고 후, 관할 보건소는 가족접촉자가 언제까지 검진을 받도록 안내해야 하는가에 대하여 적절한 설명은?", options: ["신고일 기준 3개월 이내", "신고일 기준 2주 이내", "신고일 기준 1개월 이내", "신고일 기준 1주일 이내"], a: 2, exp: "환자 신고일 기준으로 1개월 내에 가족접촉자 검진의료기관이나 보건소를 방문하여 검사를 받도록 안내해야 합니다." },
            { id: 488, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 다제내성결핵 환자의 접촉자 중 잠복결핵감염 미치료자에 대한 추적검사(흉부X선) 횟수는? 적절한 설명은?", options: ["3년간 총 3회 (매년 1회)", "1년간 총 4회 (3, 6, 9, 12개월)", "5년간 총 5회 (매년 1회)", "2년간 총 6회 (3, 6, 9, 12, 18, 24개월)"], a: 3, exp: "다제내성결핵 접촉자 중 잠복결핵 미치료자는 2년에 걸쳐 총 6회 추적 관찰을 시행합니다." },

            { id: 380, q: "결핵역학조사 현장 대응 원칙상, [군부대 결핵 발생 사례] 집단시설 역학조사 시 \'중점사례\'로 분류되어 시·도가 총괄하여 철저히 관리해야 하는 대상이 아닌 것은? 맞는 설명은?", options: ["지표환자가 단순 흉부X선 유소견자인 사례", "지표환자가 다제내성결핵으로 확인된 사례", "역학조사 중 추가 결핵환자가 발견된 사례", "신생아 또는 영·유아 결핵 노출 사례"], a: 0, exp: "단순 흉부X선 유소견자(활동성 배제) 사례는 중점사례가 아니며, 신생아 노출이나 다제내성결핵 등이 중점사례에 해당합니다." },

            { id: 421, q: "감염병 대응 매뉴얼을 적용할 때, [이○연 환자 관련] 잠복결핵감염 검사를 위해 투베르쿨린 피부반응검사(TST)를 실시하기 전, 위음성 방지를 위해 반드시 확인해야 할 접종력은? 적절한 설명은?", options: ["최근 3개월 이내 모든 백신 접종력", "최근 2주 이내 코로나19 백신 접종력", "최근 4주 이내 사백신 접종력", "최근 4주 이내 생백신 접종력"], a: 3, exp: "생백신 접종은 TST 검사에 위음성 영향을 미칠 수 있으므로, 최근 4주 이내 생백신 접종력을 확인해야 합니다." },
            { id: 425, q: "보건소 실무 지침서에 명시된 바에 따라, [강○늘 환자 관련] 지표환자가 \'이소니아지드(INH) 단독 내성\' 결핵으로 판명되었다. 이 환자의 접촉자에게 권장되는 잠복결핵감염 치료 요법은? 알맞은 것은?", options: ["이소니아지드 9개월 요법 (9H)", "레보플록사신 6개월 요법 (6Lfx)", "이소니아지드/리팜핀 3개월 요법 (3HR)", "리팜핀 4개월 요법 (4R)"], a: 3, exp: "지표환자가 INH 단독 내성이면 INH를 제외한 리팜핀 4개월(4R) 요법을 권장합니다." },

            { id: 196, q: "결핵역학조사 현장 대응 원칙상, [콜센터 결핵 발생 사례] 전염성이 있는 결핵환자의 경우, 치료 시작 직후 \'전염성 기간(초기 2주간)\' 동안의 복약확인 주기로 옳은 것은? 알맞은 것은?", options: ["주 1회", "매일 확인 실시", "월 1회", "주 3회"], a: 1, exp: "전염성 환자의 경우 취약성 점수와 무관하게 치료시작 이후 초기 2주간 매일 복약확인을 실시해야 합니다." },

            { id: 432, q: "최신 지침을 기준으로 볼 때, [어린이집 결핵 발생 사례] 결핵환자 \'취약성평가\' 결과에 따라 환자를 분류할 때, \'중위험군\'에 해당하는 점수 구간은? 적절한 설명은?", options: ["31점 이상 45점 이하", "17점 이상 30점 이하", "16점 이하", "46점 이상"], a: 1, exp: "취약성평가 결과 저위험군은 16점 이하, 중위험군은 17~30점, 고위험군은 31점 이상으로 분류합니다." },

            { id: 322, q: "결핵역학조사 현장 대응 원칙상, [콜센터 결핵 발생 사례] 만 8세 이하 소아 폐외결핵 환자 발생 시, 가족접촉자 조사를 시행하는 주된 이유는 알맞은 것은?", options: ["소아의 결핵 발병으로 인한 성장 지연을 막기 위해", "유치원 등 집단시설로의 확산을 선제적으로 차단하기 위해", "예방접종(BCG) 이상반응 여부를 확인하기 위해", "가족 중 숨은 감염원(결핵환자)을 파악하기 위해"], a: 3, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원을 찾기 위해 역학조사를 실시합니다." },

            { id: 28, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 적절한 설명은?", options: ["음성으로 판정하여 치료를 시행하지 않는다.", "판정보류로 3개월 뒤 TST를 재검한다.", "흉부X선 결과와 무관하게 양전으로 간주한다.", "양성으로 판정하여 즉시 치료를 시작한다."], a: 0, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 382, q: "감염병 대응 매뉴얼을 적용할 때, [어린이집 결핵 발생 사례] 생후 4주 이하의 신생아가 전염성 결핵환자와 긴밀하게 접촉했다. 활동성 결핵 배제 후 즉시 취해야 할 조치는? 알맞은 것은?", options: ["아무 조치 없이 6개월 뒤 IGRA 검사만 시행한다.", "BCG 백신을 즉시 접종한다.", "즉시 리팜핀을 4개월간 투여한다.", "생후 3개월 이후 TST 판독 전까지 이소니아지드를 예방적으로 투여한다."], a: 3, exp: "활동성 결핵이 배제되면, 생후 3개월 이후 TST를 시행하고 그 전까지 예방적으로 이소니아지드를 선제 투여합니다." },
            { id: 498, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 집단시설 결핵역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정할 때 고려하는 요소가 아닌 것은? 맞는 설명은?", options: ["환자의 거주지 면적", "환자의 결핵 관련 임상 증상 유무 및 발생 시기", "객담 도말 및 배양검사 결과", "흉부X선 상 공동(cavity) 유무"], a: 0, exp: "전염성 추정 기간은 증상 발생일, 도말검사 양성 유무, 흉부X선 공동 유무 등을 종합하여 결정하며 거주지 면적은 무관합니다." },

            { id: 249, q: "결핵역학조사 현장 대응 원칙상, [대형 학원 결핵 발생 사례] 가족접촉자 조사의 주된 목적으로 추가 결핵환자 발견 외에 가장 중요한 것은? 알맞은 것은?", options: ["환자 가족의 건강보험 자격 심사 및 진료비 지원", "거주지 방역 소독 필요성 판단", "지역사회 감염병 통계 산출을 위한 데이터 수집", "잠복결핵감염 치료를 통한 결핵 발병 예방"], a: 3, exp: "가족접촉자 조사는 추가 환자 발견뿐만 아니라 잠복결핵감염 치료를 통한 발병 예방을 목적으로 합니다." },
            { id: 179, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 전염성 결핵환자가 집단시설 종사자로 확인된 경우, 보건소가 환자 본인과 소속 기관장에게 조치해야 하는 사항은? 알맞은 것은?", options: ["업무종사 및 등교 일시 제한 대상자 통보서 발급", "환자에 대한 강제 입원 명령서 발급", "해당 시설 폐쇄 및 전원 자가격리 명령서 발급", "기관장에 대한 방역 소독 과태료 부과 처분"], a: 0, exp: "전염성 결핵환자의 소속 기관장과 환자 본인에게 \'업무종사 및 등교 일시 제한 통보서\'를 발급하여 접촉을 차단합니다." },
            { id: 139, q: "감염병 대응 매뉴얼을 적용할 때, [송○진 환자 관련] 전염성 결핵환자가 집단시설 종사자로 확인된 경우, 보건소가 환자 본인과 소속 기관장에게 조치해야 하는 사항은? 적절한 설명은?", options: ["기관장에 대한 방역 소독 과태료 부과 처분", "업무종사 및 등교 일시 제한 대상자 통보서 발급", "환자에 대한 강제 입원 명령서 발급", "해당 시설 폐쇄 및 전원 자가격리 명령서 발급"], a: 1, exp: "전염성 결핵환자의 소속 기관장과 환자 본인에게 \'업무종사 및 등교 일시 제한 통보서\'를 발급하여 접촉을 차단합니다." },
            { id: 166, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 가족접촉자의 초회 잠복결핵감염검사(TST 또는 IGRA)가 음성으로 나왔을 때, 2차 검사(연속검사)는 언제 시행하는가에 대하여 적절한 설명은?", options: ["마지막 접촉일 기준 2~4주 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 후", "마지막 접촉일 기준 4~6주 후", "마지막 접촉일 기준 6개월 후"], a: 1, exp: "초회 검사 음성 시 창문기(Window period)를 고려하여 8~10주 이후에 2차 검사를 실시합니다." },
            { id: 376, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 5세 미만 결핵환자의 감염원 조사 시, M. bovis BCG 감염과 일반 결핵을 감별하기 위해 의뢰하는 검사는? 가장 올바른 것은?", options: ["결핵균 유전형 검사", "결핵균 항산균 도말검사", "HIV 항체 혈액 검사", "혈청학적 면역검사"], a: 0, exp: "BCG 예방접종 이상반응(M. bovis BCG 감염) 여부를 확인하기 위해 질병관리청에 유전형 검사를 의뢰합니다." },
            { id: 18, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 집단시설 결핵역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정할 때 고려하는 요소가 아닌 것은? 옳은 것은?", options: ["흉부X선 상 공동(cavity) 유무", "객담 도말 및 배양검사 결과", "환자의 결핵 관련 임상 증상 유무 및 발생 시기", "환자의 거주지 면적"], a: 3, exp: "전염성 추정 기간은 증상 발생일, 도말검사 양성 유무, 흉부X선 공동 유무 등을 종합하여 결정하며 거주지 면적은 무관합니다." },
            { id: 10, q: "최신 지침을 기준으로 볼 때, [콜센터 결핵 발생 사례] 임산부인 가족접촉자가 방사선 노출 우려로 흉부X선 검사를 거부할 경우 적절한 조치는? 적절한 설명은?", options: ["객담 도말검사만 3회 실시하고 조사를 종료한다.", "흉부X선 대신 즉시 잠복결핵감염 치료 약제를 투여한다.", "납치마를 착용하고 검사를 받도록 권고한다.", "출산 후 6개월까지 모든 검사를 보류한다."], a: 2, exp: "임산부라도 납치마(차폐복)를 착용하면 태아에게 미치는 방사선 영향이 거의 없으므로 활동성 결핵 배제를 위해 검사를 권고합니다." },
            { id: 97, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 집단시설 접촉자 조사가 모두 완료된 시점으로부터 며칠 이내에 \'결핵역학조사 종료보고서\'를 시스템에 등록해야 하는가에 대하여 맞는 설명은?", options: ["7일 이내", "30일 이내", "2주 이내 (14일 이내)", "3일 이내"], a: 2, exp: "접촉자 조사가 완료된 시점(예: 3개월 추적검사 완료)으로부터 2주 이내에 종료보고서를 작성해 등록해야 합니다." },
            { id: 356, q: "감염병 대응 매뉴얼을 적용할 때, [조○민 환자 관련] 전염성이 있는 결핵환자의 경우, 치료 시작 직후 \'전염성 기간(초기 2주간)\' 동안의 복약확인 주기로 옳은 것은? 옳은 것은?", options: ["매일 확인 실시", "월 1회", "주 3회", "주 1회"], a: 0, exp: "전염성 환자의 경우 취약성 점수와 무관하게 치료시작 이후 초기 2주간 매일 복약확인을 실시해야 합니다." },

            { id: 314, q: "결핵역학조사 현장 대응 원칙상, [정○원 환자 관련] 취약성평가 결과 \'고위험군\'으로 분류된 초치료 결핵 신환자의 권장 복약확인 횟수는? 적절한 설명은?", options: ["월 1~2회 확인", "2주 1회 확인", "주 4~5회 확인", "주 1~2회 확인"], a: 2, exp: "고위험군 신환자의 경우 복약 순응도가 떨어질 우려가 있어 주 4~5회 철저히 복약 여부를 확인해야 합니다." },
            { id: 441, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 호흡기 결핵 환자의 가족접촉자 조사 대상 기간은 언제부터 언제까지인가? 적절한 설명은?", options: ["진단일 기준 3개월 전부터 치료 시작 후 2주까지", "진단일 기준 6개월 전부터 전염성 소실 시점까지", "진단일 기준 1개월 전부터 치료 시작 후 1주까지", "증상 발생 6개월 전부터 치료 종료 시까지"], a: 0, exp: "호흡기 결핵 환자의 진단일을 기준으로 3개월 이전부터 치료 시작 후 2주까지 같은 공간에서 생활하거나 주기적으로 접촉한 가족 및 동거인이 대상입니다." },
            { id: 260, q: "결핵역학조사 현장 대응 원칙상, [이○연 환자 관련] 집단시설 역학조사 시 \'중점사례\'로 분류되어 시·도가 총괄하여 철저히 관리해야 하는 대상이 아닌 것은? 가장 올바른 것은?", options: ["지표환자가 다제내성결핵으로 확인된 사례", "신생아 또는 영·유아 결핵 노출 사례", "지표환자가 단순 흉부X선 유소견자인 사례", "역학조사 중 추가 결핵환자가 발견된 사례"], a: 2, exp: "단순 흉부X선 유소견자(활동성 배제) 사례는 중점사례가 아니며, 신생아 노출이나 다제내성결핵 등이 중점사례에 해당합니다." },
            { id: 188, q: "보건소 실무 지침서에 명시된 바에 따라, [의료기관 결핵 발생 사례] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 적절한 설명은?", options: ["음성으로 판정하여 치료를 시행하지 않는다.", "양성으로 판정하여 즉시 치료를 시작한다.", "판정보류로 3개월 뒤 TST를 재검한다.", "흉부X선 결과와 무관하게 양전으로 간주한다."], a: 0, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 371, q: "국가결핵관리지침 제2절에 의하면, [의료기관 결핵 발생 사례] 집단시설 결핵역학조사는 크게 두 가지 조사로 구성된다. 가장 올바른 것은?", options: ["지표환자 조사와 접촉자 조사", "환경 소독 조사와 시설 폐쇄 심의", "건강검진 실시와 예방접종력 조사", "의료진 역학조사와 방역 인력 배치"], a: 0, exp: "결핵역학조사는 전염성을 확인하는 \'지표환자 조사\'와 감염 확산을 막는 \'접촉자 조사\'로 이루어집니다." },
            { id: 126, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 가족접촉자의 초회 잠복결핵감염검사(TST 또는 IGRA)가 음성으로 나왔을 때, 2차 검사(연속검사)는 언제 시행하는가에 대하여 맞는 설명은?", options: ["마지막 접촉일 기준 6개월 후", "마지막 접촉일 기준 2~4주 후", "마지막 접촉일 기준 4~6주 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 후"], a: 3, exp: "초회 검사 음성 시 창문기(Window period)를 고려하여 8~10주 이후에 2차 검사를 실시합니다." },

            { id: 451, q: "감염병 대응 매뉴얼을 적용할 때, [박○민 환자 관련] 집단시설 결핵역학조사는 크게 두 가지 조사로 구성된다. 맞는 설명은?", options: ["환경 소독 조사와 시설 폐쇄 심의", "의료진 역학조사와 방역 인력 배치", "지표환자 조사와 접촉자 조사", "건강검진 실시와 예방접종력 조사"], a: 2, exp: "결핵역학조사는 전염성을 확인하는 \'지표환자 조사\'와 감염 확산을 막는 \'접촉자 조사\'로 이루어집니다." },

            { id: 279, q: "국가결핵관리지침 제2절에 의하면, [어린이집 결핵 발생 사례] 외국인 결핵환자가 정당한 사유 없이 결핵 치료를 지속적으로 거부(비순응)할 경우 취할 수 있는 조치는? 옳은 것은?", options: ["본국 대사관에 인계하여 본국 치료 권고", "내국인과 동일하게 어떠한 법적 제재도 불가", "즉각적인 강제 추방 및 벌금 1천만원 부과", "출입국·외국인관청에 통보하여 체류기간 연장 제한 등 조치"], a: 3, exp: "국내 체류 외국인 환자가 치료에 불응할 경우 감염병예방법 및 출입국관리법에 따라 체류 제한 조치를 의뢰할 수 있습니다." },
            { id: 334, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 집단시설 결핵역학조사에서 \'밀접접촉자\'로 분류하기 위한 지표환자와의 접촉 시간 기준은? 맞는 설명은?", options: ["하루 연속 4시간 이상 또는 누적 20시간 이상", "누적 100시간 이상", "하루 연속 12시간 이상 또는 누적 60시간 이상", "하루 연속 8시간 이상 또는 누적 40시간 이상"], a: 3, exp: "하루에 연속으로 8시간 이상 접촉하거나, 전염성 추정기간 동안 누적 40시간 이상 접촉한 사람을 밀접접촉자로 분류합니다." },
            { id: 56, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 5세 미만 결핵환자의 감염원 조사 시, M. bovis BCG 감염과 일반 결핵을 감별하기 위해 의뢰하는 검사는? 맞는 설명은?", options: ["결핵균 항산균 도말검사", "HIV 항체 혈액 검사", "혈청학적 면역검사", "결핵균 유전형 검사"], a: 3, exp: "BCG 예방접종 이상반응(M. bovis BCG 감염) 여부를 확인하기 위해 질병관리청에 유전형 검사를 의뢰합니다." },
            { id: 393, q: "최신 지침을 기준으로 볼 때, [노인요양원 결핵 발생 사례] 맞춤형 사례관리를 위해 보건소 전담요원이 \'사례상담\'을 필수로 진행해야 하는 취약성평가 위험도 기준은? 가장 올바른 것은?", options: ["저위험군을 포함한 모든 결핵 환자", "전염성 결핵 환자 전원", "중위험군 이상 (중위험군 및 고위험군)", "고위험군 환자만 전담"], a: 2, exp: "취약성평가 결과 \'중위험군\' 이상의 위험도를 가진 환자를 대상으로 심층적인 사례상담을 필수 진행합니다." },

            { id: 452, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 집단시설 내 결핵환자 발생 시, 호흡기검체 검사 결과가 음성일지라도 역학조사를 실시해야 하는 경우는? 옳은 것은?", options: ["과거 결핵 약제를 복용한 이력이 있을 때", "흉부X선 상 공동(cavity)이 확인된 경우", "기침, 가래 증상이 1개월 이상 지속될 때", "환자가 만 65세 이상의 고령일 때"], a: 1, exp: "검체가 음성이더라도 흉부X선 상 \'공동\'이 있다면 전염성이 있을 가능성이 커서 조사를 실시합니다." },

            { id: 66, q: "결핵역학조사 현장 대응 원칙상, [대형 학원 결핵 발생 사례] 지표환자가 다제내성결핵(MDR-TB)인 경우, 밀접접촉자의 잠복결핵감염 치료를 위해 전문가 상의 후 고려할 수 있는 요법은? 옳은 것은?", options: ["리팜핀 4개월 요법 (4R)", "이소니아지드 9개월 요법 (9H)", "피라진아미드 단독 2개월 요법", "레보플록사신 6개월 요법 (6Lfx)"], a: 3, exp: "다제내성 결핵 접촉자의 경우 득실을 고려하여 레보플록사신 6개월(6Lfx) 요법을 권고할 수 있습니다." },
            { id: 375, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 보건소가 집단시설 현장조사를 완료한 후, 현장조사서를 질병보건통합관리시스템에 등록해야 하는 기한은? 맞는 설명은?", options: ["현장조사일로부터 7일 이내", "현장조사일로부터 3일 이내 (근무일 기준)", "현장조사일로부터 14일 이내", "24시간 이내"], a: 1, exp: "현장조사일로부터 근무일 기준 3일 이내에 시스템에 현장조사서를 등록해야 합니다." },
            { id: 165, q: "최신 지침을 기준으로 볼 때, [최○수 환자 관련] 지표환자가 다제내성결핵인 경우, 기침 증상이 있는 접촉자의 객담 검사 시 반드시 포함해야 하는 검사는? 적절한 설명은?", options: ["단순 항산균 도말검사", "결핵균 핵산증폭검사(Xpert MTB/RIF 또는 BD max)", "결핵균 피부반응검사(TST)", "결핵균 통상감수성검사"], a: 1, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 407, q: "최신 지침을 기준으로 볼 때, [송○진 환자 관련] 잠복결핵감염으로 진단되었으나 치료를 받지 않는 일반 가족접촉자의 흉부X선 추적검사 주기는? 맞는 설명은?", options: ["진단일로부터 2년간 6개월 간격", "진단일로부터 6개월간 매달", "진단일로부터 3년간 1년 간격", "진단일로부터 1년간 3개월 간격"], a: 3, exp: "일반 잠복결핵감염 미치료자는 진단일로부터 1년간 3개월 간격으로 추적 흉부X선 검사를 실시합니다." },
            { id: 98, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 집단시설 결핵역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정할 때 고려하는 요소가 아닌 것은? 옳은 것은?", options: ["객담 도말 및 배양검사 결과", "흉부X선 상 공동(cavity) 유무", "환자의 결핵 관련 임상 증상 유무 및 발생 시기", "환자의 거주지 면적"], a: 3, exp: "전염성 추정 기간은 증상 발생일, 도말검사 양성 유무, 흉부X선 공동 유무 등을 종합하여 결정하며 거주지 면적은 무관합니다." },
            { id: 146, q: "국가결핵관리지침 제2절에 의하면, [박○민 환자 관련] 지표환자가 다제내성결핵(MDR-TB)인 경우, 밀접접촉자의 잠복결핵감염 치료를 위해 전문가 상의 후 고려할 수 있는 요법은? 적절한 설명은?", options: ["피라진아미드 단독 2개월 요법", "레보플록사신 6개월 요법 (6Lfx)", "리팜핀 4개월 요법 (4R)", "이소니아지드 9개월 요법 (9H)"], a: 1, exp: "다제내성 결핵 접촉자의 경우 득실을 고려하여 레보플록사신 6개월(6Lfx) 요법을 권고할 수 있습니다." },
            { id: 496, q: "감염병 대응 매뉴얼을 적용할 때, [송○진 환자 관련] 5세 미만 결핵환자의 감염원 조사 시, M. bovis BCG 감염과 일반 결핵을 감별하기 위해 의뢰하는 검사는? 옳은 것은?", options: ["혈청학적 면역검사", "결핵균 유전형 검사", "HIV 항체 혈액 검사", "결핵균 항산균 도말검사"], a: 1, exp: "BCG 예방접종 이상반응(M. bovis BCG 감염) 여부를 확인하기 위해 질병관리청에 유전형 검사를 의뢰합니다." },
            { id: 464, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 잠복결핵감염 치료 전 흉부X선 등을 통해 \'활동성 결핵\'을 반드시 배제해야 하는 가장 핵심적인 이유는? 옳은 것은?", options: ["잠복결핵 치료 약제가 너무 고가여서", "결핵 약제에 의한 급성 간독성을 예방하기 위해서", "활동성 결핵 상태에서 1~2제 약제만 쓸 경우 내성결핵이 유발될 수 있어서", "환자의 치료 순응도와 거부감을 줄이기 위해서"], a: 2, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제(단일 또는 2제)로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 116, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 전염성이 있는 결핵환자의 경우, 치료 시작 직후 \'전염성 기간(초기 2주간)\' 동안의 복약확인 주기로 옳은 것은? 맞는 설명은?", options: ["주 3회", "월 1회", "매일 확인 실시", "주 1회"], a: 2, exp: "전염성 환자의 경우 취약성 점수와 무관하게 치료시작 이후 초기 2주간 매일 복약확인을 실시해야 합니다." },
            { id: 430, q: "최신 지침을 기준으로 볼 때, [일반 사업장 결핵 발생 사례] 잠복결핵감염 치료 대상자가 치료 중 타 지역으로 전출(이사)을 간 경우 올바른 행정 조치는? 알맞은 것은?", options: ["기존 보건소에서 치료가 끝날 때까지 원격 관리한다.", "산정특례를 취소하고 일반 건강보험으로 전환한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리한다.", "이사한 즉시 치료를 중단하고 새로 진단받도록 한다."], a: 2, exp: "전출 시 신규 거주지 관할 보건소로 관리 기관을 변경(이관)하여 치료가 중단되지 않도록 연계해야 합니다." },
            { id: 180, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 집단시설 역학조사 시 \'중점사례\'로 분류되어 시·도가 총괄하여 철저히 관리해야 하는 대상이 아닌 것은? 적절한 설명은?", options: ["지표환자가 다제내성결핵으로 확인된 사례", "지표환자가 단순 흉부X선 유소견자인 사례", "신생아 또는 영·유아 결핵 노출 사례", "역학조사 중 추가 결핵환자가 발견된 사례"], a: 1, exp: "단순 흉부X선 유소견자(활동성 배제) 사례는 중점사례가 아니며, 신생아 노출이나 다제내성결핵 등이 중점사례에 해당합니다." },
            { id: 478, q: "결핵역학조사 현장 대응 원칙상, [대형 학원 결핵 발생 사례] 결핵 \'안심벨트 지원사업\'의 주된 목적과 지원 대상으로 가장 올바른 것은? 옳은 것은?", options: ["보건소 의료진의 방역복 및 장비 구매 지원", "모든 국민의 결핵 검진 비용 전액 지원", "사회·경제적 취약계층 결핵환자의 간병비, 이송비 등 지원", "다제내성결핵 환자의 해외 이송 비용 지원"], a: 2, exp: "결핵 안심벨트 지원사업은 결핵환자 중 취약계층을 대상으로 입원비, 간병비, 영양 간식 등을 지원하는 사업입니다." },
            { id: 194, q: "국가결핵관리지침 제2절에 의하면, [대형 학원 결핵 발생 사례] 취약성평가 결과 \'고위험군\'으로 분류된 초치료 결핵 신환자의 권장 복약확인 횟수는? 옳은 것은?", options: ["2주 1회 확인", "월 1~2회 확인", "주 4~5회 확인", "주 1~2회 확인"], a: 2, exp: "고위험군 신환자의 경우 복약 순응도가 떨어질 우려가 있어 주 4~5회 철저히 복약 여부를 확인해야 합니다." },
            { id: 475, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 취약성평가 결과 \'저위험군\'으로 분류된 환자의 기본 복약확인 권장 주기는? 맞는 설명은?", options: ["주 4~5회", "매일 확인", "월 1~2회", "주 1~2회"], a: 2, exp: "저위험군의 경우 의료기관이나 보건소를 통해 외래 중심으로 월 1~2회 규칙적인 복약 여부를 확인합니다." },
            { id: 81, q: "감염병 대응 매뉴얼을 적용할 때, [강○늘 환자 관련] 호흡기 결핵 환자의 가족접촉자 조사 대상 기간은 언제부터 언제까지인가? 맞는 설명은?", options: ["진단일 기준 6개월 전부터 전염성 소실 시점까지", "증상 발생 6개월 전부터 치료 종료 시까지", "진단일 기준 1개월 전부터 치료 시작 후 1주까지", "진단일 기준 3개월 전부터 치료 시작 후 2주까지"], a: 3, exp: "호흡기 결핵 환자의 진단일을 기준으로 3개월 이전부터 치료 시작 후 2주까지 같은 공간에서 생활하거나 주기적으로 접촉한 가족 및 동거인이 대상입니다." },
            { id: 297, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 집단시설 접촉자 조사가 모두 완료된 시점으로부터 며칠 이내에 \'결핵역학조사 종료보고서\'를 시스템에 등록해야 하는가에 대하여 맞는 설명은?", options: ["7일 이내", "30일 이내", "3일 이내", "2주 이내 (14일 이내)"], a: 3, exp: "접촉자 조사가 완료된 시점(예: 3개월 추적검사 완료)으로부터 2주 이내에 종료보고서를 작성해 등록해야 합니다." },
            { id: 468, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 가장 올바른 것은?", options: ["흉부X선 결과와 무관하게 양전으로 간주한다.", "판정보류로 3개월 뒤 TST를 재검한다.", "양성으로 판정하여 즉시 치료를 시작한다.", "음성으로 판정하여 치료를 시행하지 않는다."], a: 3, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 110, q: "국가결핵관리지침 제2절에 의하면, [대학교 기숙사 결핵 발생 사례] 잠복결핵감염 치료 대상자가 치료 중 타 지역으로 전출(이사)을 간 경우 올바른 행정 조치는? 알맞은 것은?", options: ["이사한 즉시 치료를 중단하고 새로 진단받도록 한다.", "산정특례를 취소하고 일반 건강보험으로 전환한다.", "기존 보건소에서 치료가 끝날 때까지 원격 관리한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리한다."], a: 3, exp: "전출 시 신규 거주지 관할 보건소로 관리 기관을 변경(이관)하여 치료가 중단되지 않도록 연계해야 합니다." },

            { id: 22, q: "국가결핵관리지침 제2절에 의하면, [종합병원 결핵 발생 사례] 생후 4주 이하의 신생아가 전염성 결핵환자와 긴밀하게 접촉했다. 활동성 결핵 배제 후 즉시 취해야 할 조치는? 맞는 설명은?", options: ["BCG 백신을 즉시 접종한다.", "생후 3개월 이후 TST 판독 전까지 이소니아지드를 예방적으로 투여한다.", "아무 조치 없이 6개월 뒤 IGRA 검사만 시행한다.", "즉시 리팜핀을 4개월간 투여한다."], a: 1, exp: "활동성 결핵이 배제되면, 생후 3개월 이후 TST를 시행하고 그 전까지 예방적으로 이소니아지드를 선제 투여합니다." },

            { id: 465, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 지표환자가 \'이소니아지드(INH) 단독 내성\' 결핵으로 판명되었다. 이 환자의 접촉자에게 권장되는 잠복결핵감염 치료 요법은? 가장 올바른 것은?", options: ["리팜핀 4개월 요법 (4R)", "이소니아지드/리팜핀 3개월 요법 (3HR)", "레보플록사신 6개월 요법 (6Lfx)", "이소니아지드 9개월 요법 (9H)"], a: 0, exp: "지표환자가 INH 단독 내성이면 INH를 제외한 리팜핀 4개월(4R) 요법을 권장합니다." },

            { id: 422, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 생후 4주 이하의 신생아가 전염성 결핵환자와 긴밀하게 접촉했다. 활동성 결핵 배제 후 즉시 취해야 할 조치는? 가장 올바른 것은?", options: ["BCG 백신을 즉시 접종한다.", "생후 3개월 이후 TST 판독 전까지 이소니아지드를 예방적으로 투여한다.", "아무 조치 없이 6개월 뒤 IGRA 검사만 시행한다.", "즉시 리팜핀을 4개월간 투여한다."], a: 1, exp: "활동성 결핵이 배제되면, 생후 3개월 이후 TST를 시행하고 그 전까지 예방적으로 이소니아지드를 선제 투여합니다." },

            { id: 379, q: "국가결핵관리지침 제2절에 의하면, [한○윤 환자 관련] 전염성 결핵환자가 집단시설 종사자로 확인된 경우, 보건소가 환자 본인과 소속 기관장에게 조치해야 하는 사항은? 옳은 것은?", options: ["환자에 대한 강제 입원 명령서 발급", "기관장에 대한 방역 소독 과태료 부과 처분", "업무종사 및 등교 일시 제한 대상자 통보서 발급", "해당 시설 폐쇄 및 전원 자가격리 명령서 발급"], a: 2, exp: "전염성 결핵환자의 소속 기관장과 환자 본인에게 \'업무종사 및 등교 일시 제한 통보서\'를 발급하여 접촉을 차단합니다." },
            { id: 396, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 전염성이 있는 결핵환자의 경우, 치료 시작 직후 \'전염성 기간(초기 2주간)\' 동안의 복약확인 주기로 옳은 것은? 맞는 설명은?", options: ["주 1회", "매일 확인 실시", "주 3회", "월 1회"], a: 1, exp: "전염성 환자의 경우 취약성 점수와 무관하게 치료시작 이후 초기 2주간 매일 복약확인을 실시해야 합니다." },
            { id: 157, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 결핵환자가 진료비 본인부담을 면제받는 \'산정특례\'를 확진일로부터 소급하여 적용받으려면 확진일 기준 며칠 이내에 신청해야 하는가에 대하여 맞는 설명은?", options: ["60일 이내", "30일 이내", "14일 이내", "7일 이내"], a: 1, exp: "확진일로부터 30일 이내에 국민건강보험공단에 신청해야 확진일(공휴일 포함)부터 소급하여 혜택을 적용받을 수 있습니다." },
            { id: 431, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 결핵환자 신고 접수 후, 관할 보건소가 실시하는 \'1차 사례조사\'의 완료 기한은? 맞는 설명은?", options: ["신고일 기준 7일 이내", "신고일 당일 자정까지", "신고일 기준 3일 이내 (토·공휴일 제외)", "신고일 기준 14일 이내"], a: 2, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 법정공휴일 제외)에 완료해야 합니다." },
            { id: 17, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 집단시설 접촉자 조사가 모두 완료된 시점으로부터 며칠 이내에 \'결핵역학조사 종료보고서\'를 시스템에 등록해야 하는가에 대하여 맞는 설명은?", options: ["30일 이내", "2주 이내 (14일 이내)", "7일 이내", "3일 이내"], a: 1, exp: "접촉자 조사가 완료된 시점(예: 3개월 추적검사 완료)으로부터 2주 이내에 종료보고서를 작성해 등록해야 합니다." },
            { id: 308, q: "최신 지침을 기준으로 볼 때, [윤○준 환자 관련] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 적절한 설명은?", options: ["음성으로 판정하여 치료를 시행하지 않는다.", "흉부X선 결과와 무관하게 양전으로 간주한다.", "양성으로 판정하여 즉시 치료를 시작한다.", "판정보류로 3개월 뒤 TST를 재검한다."], a: 0, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 79, q: "최신 지침을 기준으로 볼 때, [박○민 환자 관련] 외국인 결핵환자가 정당한 사유 없이 결핵 치료를 지속적으로 거부(비순응)할 경우 취할 수 있는 조치는? 적절한 설명은?", options: ["내국인과 동일하게 어떠한 법적 제재도 불가", "출입국·외국인관청에 통보하여 체류기간 연장 제한 등 조치", "본국 대사관에 인계하여 본국 치료 권고", "즉각적인 강제 추방 및 벌금 1천만원 부과"], a: 1, exp: "국내 체류 외국인 환자가 치료에 불응할 경우 감염병예방법 및 출입국관리법에 따라 체류 제한 조치를 의뢰할 수 있습니다." },
            { id: 291, q: "결핵역학조사 현장 대응 원칙상, [대학교 기숙사 결핵 발생 사례] 집단시설 결핵역학조사는 크게 두 가지 조사로 구성된다. 옳은 것은?", options: ["건강검진 실시와 예방접종력 조사", "지표환자 조사와 접촉자 조사", "의료진 역학조사와 방역 인력 배치", "환경 소독 조사와 시설 폐쇄 심의"], a: 1, exp: "결핵역학조사는 전염성을 확인하는 \'지표환자 조사\'와 감염 확산을 막는 \'접촉자 조사\'로 이루어집니다." },
            { id: 105, q: "국가결핵관리지침 제2절에 의하면, [의료기관 결핵 발생 사례] 지표환자가 \'이소니아지드(INH) 단독 내성\' 결핵으로 판명되었다. 이 환자의 접촉자에게 권장되는 잠복결핵감염 치료 요법은? 맞는 설명은?", options: ["리팜핀 4개월 요법 (4R)", "이소니아지드 9개월 요법 (9H)", "이소니아지드/리팜핀 3개월 요법 (3HR)", "레보플록사신 6개월 요법 (6Lfx)"], a: 0, exp: "지표환자가 INH 단독 내성이면 INH를 제외한 리팜핀 4개월(4R) 요법을 권장합니다." },
            { id: 388, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 가장 올바른 것은?", options: ["양성으로 판정하여 즉시 치료를 시작한다.", "음성으로 판정하여 치료를 시행하지 않는다.", "판정보류로 3개월 뒤 TST를 재검한다.", "흉부X선 결과와 무관하게 양전으로 간주한다."], a: 1, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 264, q: "최신 지침을 기준으로 볼 때, [정○원 환자 관련] 잠복결핵감염 치료 전 흉부X선 등을 통해 \'활동성 결핵\'을 반드시 배제해야 하는 가장 핵심적인 이유는? 알맞은 것은?", options: ["활동성 결핵 상태에서 1~2제 약제만 쓸 경우 내성결핵이 유발될 수 있어서", "결핵 약제에 의한 급성 간독성을 예방하기 위해서", "환자의 치료 순응도와 거부감을 줄이기 위해서", "잠복결핵 치료 약제가 너무 고가여서"], a: 0, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제(단일 또는 2제)로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 408, q: "최신 지침을 기준으로 볼 때, [대학교 기숙사 결핵 발생 사례] 다제내성결핵 환자의 접촉자 중 잠복결핵감염 미치료자에 대한 추적검사(흉부X선) 횟수는? 적절한 설명은?", options: ["1년간 총 4회 (3, 6, 9, 12개월)", "3년간 총 3회 (매년 1회)", "5년간 총 5회 (매년 1회)", "2년간 총 6회 (3, 6, 9, 12, 18, 24개월)"], a: 3, exp: "다제내성결핵 접촉자 중 잠복결핵 미치료자는 2년에 걸쳐 총 6회 추적 관찰을 시행합니다." },
            { id: 193, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 맞춤형 사례관리를 위해 보건소 전담요원이 \'사례상담\'을 필수로 진행해야 하는 취약성평가 위험도 기준은? 알맞은 것은?", options: ["전염성 결핵 환자 전원", "고위험군 환자만 전담", "중위험군 이상 (중위험군 및 고위험군)", "저위험군을 포함한 모든 결핵 환자"], a: 2, exp: "취약성평가 결과 \'중위험군\' 이상의 위험도를 가진 환자를 대상으로 심층적인 사례상담을 필수 진행합니다." },
            { id: 453, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 집단시설 내에서 역학적 연관성이 있는 결핵환자가 몇 명 이상, 어떤 기준 내에 발생했을 때 집중 조사를 실시하는가에 대하여 맞는 설명은?", options: ["기간 상관없이 5명 이상", "1년 이내 1명 이상", "6개월 이내 2명 이상", "3개월 이내 3명 이상"], a: 2, exp: "호흡기검체 결과와 상관없이 6개월 이내에 연관성이 있는 환자가 2명 이상 발생 시 조사를 실시합니다." },
            { id: 366, q: "감염병 대응 매뉴얼을 적용할 때, [이○연 환자 관련] 가족접촉자의 초회 잠복결핵감염검사(TST 또는 IGRA)가 음성으로 나왔을 때, 2차 검사(연속검사)는 언제 시행하는가에 대하여 적절한 설명은?", options: ["마지막 접촉일 기준 2~4주 후", "마지막 접촉일 기준 4~6주 후", "마지막 접촉일 기준 6개월 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 후"], a: 3, exp: "초회 검사 음성 시 창문기(Window period)를 고려하여 8~10주 이후에 2차 검사를 실시합니다." },
            { id: 155, q: "보건소 실무 지침서에 명시된 바에 따라, [콜센터 결핵 발생 사례] 취약성평가 결과 \'저위험군\'으로 분류된 환자의 기본 복약확인 권장 주기는? 가장 올바른 것은?", options: ["월 1~2회", "주 1~2회", "주 4~5회", "매일 확인"], a: 0, exp: "저위험군의 경우 의료기관이나 보건소를 통해 외래 중심으로 월 1~2회 규칙적인 복약 여부를 확인합니다." },
            { id: 86, q: "최신 지침을 기준으로 볼 때, [어린이집 결핵 발생 사례] 가족접촉자의 초회 잠복결핵감염검사(TST 또는 IGRA)가 음성으로 나왔을 때, 2차 검사(연속검사)는 언제 시행하는가에 대하여 적절한 설명은?", options: ["마지막 접촉일 기준 6개월 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 후", "마지막 접촉일 기준 2~4주 후", "마지막 접촉일 기준 4~6주 후"], a: 1, exp: "초회 검사 음성 시 창문기(Window period)를 고려하여 8~10주 이후에 2차 검사를 실시합니다." },

            { id: 340, q: "최신 지침을 기준으로 볼 때, [콜센터 결핵 발생 사례] 집단시설 역학조사 시 \'중점사례\'로 분류되어 시·도가 총괄하여 철저히 관리해야 하는 대상이 아닌 것은? 적절한 설명은?", options: ["지표환자가 다제내성결핵으로 확인된 사례", "지표환자가 단순 흉부X선 유소견자인 사례", "신생아 또는 영·유아 결핵 노출 사례", "역학조사 중 추가 결핵환자가 발견된 사례"], a: 1, exp: "단순 흉부X선 유소견자(활동성 배제) 사례는 중점사례가 아니며, 신생아 노출이나 다제내성결핵 등이 중점사례에 해당합니다." },
            { id: 136, q: "결핵역학조사 현장 대응 원칙상, [오○훈 환자 관련] 5세 미만 결핵환자의 감염원 조사 시, M. bovis BCG 감염과 일반 결핵을 감별하기 위해 의뢰하는 검사는? 적절한 설명은?", options: ["결핵균 유전형 검사", "혈청학적 면역검사", "HIV 항체 혈액 검사", "결핵균 항산균 도말검사"], a: 0, exp: "BCG 예방접종 이상반응(M. bovis BCG 감염) 여부를 확인하기 위해 질병관리청에 유전형 검사를 의뢰합니다." },
            { id: 312, q: "보건소 실무 지침서에 명시된 바에 따라, [의료기관 결핵 발생 사례] 결핵환자 \'취약성평가\' 결과에 따라 환자를 분류할 때, \'중위험군\'에 해당하는 점수 구간은? 알맞은 것은?", options: ["31점 이상 45점 이하", "17점 이상 30점 이하", "16점 이하", "46점 이상"], a: 1, exp: "취약성평가 결과 저위험군은 16점 이하, 중위험군은 17~30점, 고위험군은 31점 이상으로 분류합니다." },

            { id: 386, q: "감염병 대응 매뉴얼을 적용할 때, [오○훈 환자 관련] 지표환자가 다제내성결핵(MDR-TB)인 경우, 밀접접촉자의 잠복결핵감염 치료를 위해 전문가 상의 후 고려할 수 있는 요법은? 맞는 설명은?", options: ["레보플록사신 6개월 요법 (6Lfx)", "이소니아지드 9개월 요법 (9H)", "피라진아미드 단독 2개월 요법", "리팜핀 4개월 요법 (4R)"], a: 0, exp: "다제내성 결핵 접촉자의 경우 득실을 고려하여 레보플록사신 6개월(6Lfx) 요법을 권고할 수 있습니다." },
            { id: 319, q: "보건소 실무 지침서에 명시된 바에 따라, [군부대 결핵 발생 사례] 외국인 결핵환자가 정당한 사유 없이 결핵 치료를 지속적으로 거부(비순응)할 경우 취할 수 있는 조치는? 알맞은 것은?", options: ["내국인과 동일하게 어떠한 법적 제재도 불가", "즉각적인 강제 추방 및 벌금 1천만원 부과", "출입국·외국인관청에 통보하여 체류기간 연장 제한 등 조치", "본국 대사관에 인계하여 본국 치료 권고"], a: 2, exp: "국내 체류 외국인 환자가 치료에 불응할 경우 감염병예방법 및 출입국관리법에 따라 체류 제한 조치를 의뢰할 수 있습니다." },
            { id: 462, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 생후 4주 이하의 신생아가 전염성 결핵환자와 긴밀하게 접촉했다. 활동성 결핵 배제 후 즉시 취해야 할 조치는? 옳은 것은?", options: ["즉시 리팜핀을 4개월간 투여한다.", "아무 조치 없이 6개월 뒤 IGRA 검사만 시행한다.", "생후 3개월 이후 TST 판독 전까지 이소니아지드를 예방적으로 투여한다.", "BCG 백신을 즉시 접종한다."], a: 2, exp: "활동성 결핵이 배제되면, 생후 3개월 이후 TST를 시행하고 그 전까지 예방적으로 이소니아지드를 선제 투여합니다." },
            { id: 31, q: "결핵역학조사 현장 대응 원칙상, [콜센터 결핵 발생 사례] 결핵환자 신고 접수 후, 관할 보건소가 실시하는 \'1차 사례조사\'의 완료 기한은? 적절한 설명은?", options: ["신고일 당일 자정까지", "신고일 기준 14일 이내", "신고일 기준 3일 이내 (토·공휴일 제외)", "신고일 기준 7일 이내"], a: 2, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 법정공휴일 제외)에 완료해야 합니다." },
            { id: 172, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 집단시설 내 결핵환자 발생 시, 호흡기검체 검사 결과가 음성일지라도 역학조사를 실시해야 하는 경우는? 맞는 설명은?", options: ["흉부X선 상 공동(cavity)이 확인된 경우", "과거 결핵 약제를 복용한 이력이 있을 때", "환자가 만 65세 이상의 고령일 때", "기침, 가래 증상이 1개월 이상 지속될 때"], a: 0, exp: "검체가 음성이더라도 흉부X선 상 \'공동\'이 있다면 전염성이 있을 가능성이 커서 조사를 실시합니다." },
            { id: 450, q: "감염병 대응 매뉴얼을 적용할 때, [군부대 결핵 발생 사례] 임산부인 가족접촉자가 방사선 노출 우려로 흉부X선 검사를 거부할 경우 적절한 조치는? 가장 올바른 것은?", options: ["흉부X선 대신 즉시 잠복결핵감염 치료 약제를 투여한다.", "납치마를 착용하고 검사를 받도록 권고한다.", "객담 도말검사만 3회 실시하고 조사를 종료한다.", "출산 후 6개월까지 모든 검사를 보류한다."], a: 1, exp: "임산부라도 납치마(차폐복)를 착용하면 태아에게 미치는 방사선 영향이 거의 없으므로 활동성 결핵 배제를 위해 검사를 권고합니다." },
            { id: 307, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 잠복결핵감염 치료 중 부작용 모니터링을 위해 기본적으로 권장되는 간기능 검사(AST/ALT 등)의 주기는? 옳은 것은?", options: ["치료 시작 3개월 후 1회 실시", "치료 시작 후 2주, 4주 및 이후 매달", "치료 시작 후 1주, 2주 차만 실시", "치료 종료 시점에 1회 최종 확인"], a: 1, exp: "치료 시작 후 2주, 4주차에 시행하고, 이후 치료 종료 시까지 정기적으로 매달 검사합니다." },
            { id: 354, q: "결핵역학조사 현장 대응 원칙상, [군부대 결핵 발생 사례] 취약성평가 결과 \'고위험군\'으로 분류된 초치료 결핵 신환자의 권장 복약확인 횟수는? 맞는 설명은?", options: ["월 1~2회 확인", "주 4~5회 확인", "주 1~2회 확인", "2주 1회 확인"], a: 1, exp: "고위험군 신환자의 경우 복약 순응도가 떨어질 우려가 있어 주 4~5회 철저히 복약 여부를 확인해야 합니다." },
            { id: 70, q: "보건소 실무 지침서에 명시된 바에 따라, [의료기관 결핵 발생 사례] 잠복결핵감염 치료 대상자가 치료 중 타 지역으로 전출(이사)을 간 경우 올바른 행정 조치는? 알맞은 것은?", options: ["산정특례를 취소하고 일반 건강보험으로 전환한다.", "이사한 즉시 치료를 중단하고 새로 진단받도록 한다.", "기존 보건소에서 치료가 끝날 때까지 원격 관리한다.", "신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리한다."], a: 3, exp: "전출 시 신규 거주지 관할 보건소로 관리 기관을 변경(이관)하여 치료가 중단되지 않도록 연계해야 합니다." },
            { id: 328, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 다제내성결핵 환자의 접촉자 중 잠복결핵감염 미치료자에 대한 추적검사(흉부X선) 횟수는? 적절한 설명은?", options: ["1년간 총 4회 (3, 6, 9, 12개월)", "5년간 총 5회 (매년 1회)", "3년간 총 3회 (매년 1회)", "2년간 총 6회 (3, 6, 9, 12, 18, 24개월)"], a: 3, exp: "다제내성결핵 접촉자 중 잠복결핵 미치료자는 2년에 걸쳐 총 6회 추적 관찰을 시행합니다." },
            { id: 68, q: "최신 지침을 기준으로 볼 때, [의료기관 결핵 발생 사례] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 가장 올바른 것은?", options: ["흉부X선 결과와 무관하게 양전으로 간주한다.", "양성으로 판정하여 즉시 치료를 시작한다.", "음성으로 판정하여 치료를 시행하지 않는다.", "판정보류로 3개월 뒤 TST를 재검한다."], a: 2, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 485, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 지표환자가 다제내성결핵인 경우, 기침 증상이 있는 접촉자의 객담 검사 시 반드시 포함해야 하는 검사는? 옳은 것은?", options: ["단순 항산균 도말검사", "결핵균 통상감수성검사", "결핵균 핵산증폭검사(Xpert MTB/RIF 또는 BD max)", "결핵균 피부반응검사(TST)"], a: 2, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 397, q: "최신 지침을 기준으로 볼 때, [임○아 환자 관련] 결핵환자가 진료비 본인부담을 면제받는 \'산정특례\'를 확진일로부터 소급하여 적용받으려면 확진일 기준 며칠 이내에 신청해야 하는가에 대하여 적절한 설명은?", options: ["7일 이내", "30일 이내", "60일 이내", "14일 이내"], a: 1, exp: "확진일로부터 30일 이내에 국민건강보험공단에 신청해야 확진일(공휴일 포함)부터 소급하여 혜택을 적용받을 수 있습니다." },
            { id: 325, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 지표환자가 다제내성결핵인 경우, 기침 증상이 있는 접촉자의 객담 검사 시 반드시 포함해야 하는 검사는? 적절한 설명은?", options: ["결핵균 핵산증폭검사(Xpert MTB/RIF 또는 BD max)", "결핵균 피부반응검사(TST)", "단순 항산균 도말검사", "결핵균 통상감수성검사"], a: 0, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 474, q: "국가결핵관리지침 제2절에 의하면, [고등학교 결핵 발생 사례] 취약성평가 결과 \'고위험군\'으로 분류된 초치료 결핵 신환자의 권장 복약확인 횟수는? 맞는 설명은?", options: ["주 1~2회 확인", "2주 1회 확인", "주 4~5회 확인", "월 1~2회 확인"], a: 2, exp: "고위험군 신환자의 경우 복약 순응도가 떨어질 우려가 있어 주 4~5회 철저히 복약 여부를 확인해야 합니다." },
            { id: 11, q: "감염병 대응 매뉴얼을 적용할 때, [콜센터 결핵 발생 사례] 집단시설 결핵역학조사는 크게 두 가지 조사로 구성된다. 맞는 설명은?", options: ["지표환자 조사와 접촉자 조사", "건강검진 실시와 예방접종력 조사", "의료진 역학조사와 방역 인력 배치", "환경 소독 조사와 시설 폐쇄 심의"], a: 0, exp: "결핵역학조사는 전염성을 확인하는 \'지표환자 조사\'와 감염 확산을 막는 \'접촉자 조사\'로 이루어집니다." },
            { id: 355, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 취약성평가 결과 \'저위험군\'으로 분류된 환자의 기본 복약확인 권장 주기는? 알맞은 것은?", options: ["주 4~5회", "매일 확인", "월 1~2회", "주 1~2회"], a: 2, exp: "저위험군의 경우 의료기관이나 보건소를 통해 외래 중심으로 월 1~2회 규칙적인 복약 여부를 확인합니다." },
            { id: 42, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 만 8세 이하 소아 폐외결핵 환자 발생 시, 가족접촉자 조사를 시행하는 주된 이유는 알맞은 것은?", options: ["소아의 결핵 발병으로 인한 성장 지연을 막기 위해", "예방접종(BCG) 이상반응 여부를 확인하기 위해", "유치원 등 집단시설로의 확산을 선제적으로 차단하기 위해", "가족 중 숨은 감염원(결핵환자)을 파악하기 위해"], a: 3, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원을 찾기 위해 역학조사를 실시합니다." },
            { id: 288, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 다제내성결핵 환자의 접촉자 중 잠복결핵감염 미치료자에 대한 추적검사(흉부X선) 횟수는? 알맞은 것은?", options: ["3년간 총 3회 (매년 1회)", "1년간 총 4회 (3, 6, 9, 12개월)", "2년간 총 6회 (3, 6, 9, 12, 18, 24개월)", "5년간 총 5회 (매년 1회)"], a: 2, exp: "다제내성결핵 접촉자 중 잠복결핵 미치료자는 2년에 걸쳐 총 6회 추적 관찰을 시행합니다." },
            { id: 316, q: "보건소 실무 지침서에 명시된 바에 따라, [박○민 환자 관련] 전염성이 있는 결핵환자의 경우, 치료 시작 직후 \'전염성 기간(초기 2주간)\' 동안의 복약확인 주기로 옳은 것은? 맞는 설명은?", options: ["주 1회", "주 3회", "월 1회", "매일 확인 실시"], a: 3, exp: "전염성 환자의 경우 취약성 점수와 무관하게 치료시작 이후 초기 2주간 매일 복약확인을 실시해야 합니다." },
            { id: 384, q: "보건소 실무 지침서에 명시된 바에 따라, [최○수 환자 관련] 잠복결핵감염 치료 전 흉부X선 등을 통해 \'활동성 결핵\'을 반드시 배제해야 하는 가장 핵심적인 이유는? 가장 올바른 것은?", options: ["잠복결핵 치료 약제가 너무 고가여서", "활동성 결핵 상태에서 1~2제 약제만 쓸 경우 내성결핵이 유발될 수 있어서", "결핵 약제에 의한 급성 간독성을 예방하기 위해서", "환자의 치료 순응도와 거부감을 줄이기 위해서"], a: 1, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제(단일 또는 2제)로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 306, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 지표환자가 다제내성결핵(MDR-TB)인 경우, 밀접접촉자의 잠복결핵감염 치료를 위해 전문가 상의 후 고려할 수 있는 요법은? 옳은 것은?", options: ["레보플록사신 6개월 요법 (6Lfx)", "리팜핀 4개월 요법 (4R)", "피라진아미드 단독 2개월 요법", "이소니아지드 9개월 요법 (9H)"], a: 0, exp: "다제내성 결핵 접촉자의 경우 득실을 고려하여 레보플록사신 6개월(6Lfx) 요법을 권고할 수 있습니다." },
            { id: 428, q: "최신 지침을 기준으로 볼 때, [윤○준 환자 관련] TST와 IGRA를 모두 시행하는 병합 검사법에서, TST가 양성이나 IGRA가 음성인 경우 잠복결핵감염 최종 판정은? 적절한 설명은?", options: ["양성으로 판정하여 즉시 치료를 시작한다.", "음성으로 판정하여 치료를 시행하지 않는다.", "판정보류로 3개월 뒤 TST를 재검한다.", "흉부X선 결과와 무관하게 양전으로 간주한다."], a: 1, exp: "병합 검사 시 두 검사 중 특이도가 높은 IGRA 결과가 음성이면 최종 음성으로 판정합니다." },
            { id: 50, q: "최신 지침을 기준으로 볼 때, [오○훈 환자 관련] 임산부인 가족접촉자가 방사선 노출 우려로 흉부X선 검사를 거부할 경우 적절한 조치는? 옳은 것은?", options: ["납치마를 착용하고 검사를 받도록 권고한다.", "출산 후 6개월까지 모든 검사를 보류한다.", "흉부X선 대신 즉시 잠복결핵감염 치료 약제를 투여한다.", "객담 도말검사만 3회 실시하고 조사를 종료한다."], a: 0, exp: "임산부라도 납치마(차폐복)를 착용하면 태아에게 미치는 방사선 영향이 거의 없으므로 활동성 결핵 배제를 위해 검사를 권고합니다." },
            { id: 225, q: "결핵역학조사 현장 대응 원칙상, [종합병원 결핵 발생 사례] 지표환자가 \'이소니아지드(INH) 단독 내성\' 결핵으로 판명되었다. 이 환자의 접촉자에게 권장되는 잠복결핵감염 치료 요법은? 알맞은 것은?", options: ["이소니아지드/리팜핀 3개월 요법 (3HR)", "리팜핀 4개월 요법 (4R)", "레보플록사신 6개월 요법 (6Lfx)", "이소니아지드 9개월 요법 (9H)"], a: 1, exp: "지표환자가 INH 단독 내성이면 INH를 제외한 리팜핀 4개월(4R) 요법을 권장합니다." },
            { id: 267, q: "보건소 실무 지침서에 명시된 바에 따라, [윤○준 환자 관련] 잠복결핵감염 치료 중 부작용 모니터링을 위해 기본적으로 권장되는 간기능 검사(AST/ALT 등)의 주기는? 옳은 것은?", options: ["치료 시작 후 1주, 2주 차만 실시", "치료 시작 후 2주, 4주 및 이후 매달", "치료 종료 시점에 1회 최종 확인", "치료 시작 3개월 후 1회 실시"], a: 1, exp: "치료 시작 후 2주, 4주차에 시행하고, 이후 치료 종료 시까지 정기적으로 매달 검사합니다." },
            { id: 233, q: "국가결핵관리지침 제2절에 의하면, [군부대 결핵 발생 사례] 맞춤형 사례관리를 위해 보건소 전담요원이 \'사례상담\'을 필수로 진행해야 하는 취약성평가 위험도 기준은? 맞는 설명은?", options: ["중위험군 이상 (중위험군 및 고위험군)", "전염성 결핵 환자 전원", "고위험군 환자만 전담", "저위험군을 포함한 모든 결핵 환자"], a: 0, exp: "취약성평가 결과 \'중위험군\' 이상의 위험도를 가진 환자를 대상으로 심층적인 사례상담을 필수 진행합니다." },
            { id: 137, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 집단시설 접촉자 조사가 모두 완료된 시점으로부터 며칠 이내에 \'결핵역학조사 종료보고서\'를 시스템에 등록해야 하는가에 대하여 가장 올바른 것은?", options: ["7일 이내", "30일 이내", "3일 이내", "2주 이내 (14일 이내)"], a: 3, exp: "접촉자 조사가 완료된 시점(예: 3개월 추적검사 완료)으로부터 2주 이내에 종료보고서를 작성해 등록해야 합니다." },
            { id: 24, q: "감염병 대응 매뉴얼을 적용할 때, [이○희 환자 관련] 잠복결핵감염 치료 전 흉부X선 등을 통해 \'활동성 결핵\'을 반드시 배제해야 하는 가장 핵심적인 이유는? 맞는 설명은?", options: ["활동성 결핵 상태에서 1~2제 약제만 쓸 경우 내성결핵이 유발될 수 있어서", "잠복결핵 치료 약제가 너무 고가여서", "환자의 치료 순응도와 거부감을 줄이기 위해서", "결핵 약제에 의한 급성 간독성을 예방하기 위해서"], a: 0, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제(단일 또는 2제)로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 258, q: "결핵역학조사 현장 대응 원칙상, [박○민 환자 관련] 집단시설 결핵역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정할 때 고려하는 요소가 아닌 것은? 적절한 설명은?", options: ["객담 도말 및 배양검사 결과", "환자의 결핵 관련 임상 증상 유무 및 발생 시기", "흉부X선 상 공동(cavity) 유무", "환자의 거주지 면적"], a: 3, exp: "전염성 추정 기간은 증상 발생일, 도말검사 양성 유무, 흉부X선 공동 유무 등을 종합하여 결정하며 거주지 면적은 무관합니다." },
            { id: 224, q: "국가결핵관리지침 제2절에 의하면, [김○현 환자 관련] 잠복결핵감염 치료 전 흉부X선 등을 통해 \'활동성 결핵\'을 반드시 배제해야 하는 가장 핵심적인 이유는? 맞는 설명은?", options: ["결핵 약제에 의한 급성 간독성을 예방하기 위해서", "잠복결핵 치료 약제가 너무 고가여서", "활동성 결핵 상태에서 1~2제 약제만 쓸 경우 내성결핵이 유발될 수 있어서", "환자의 치료 순응도와 거부감을 줄이기 위해서"], a: 2, exp: "활동성 결핵을 배제하지 않고 잠복결핵 약제(단일 또는 2제)로만 치료하면 결핵균이 내성을 획득할 위험이 매우 큽니다." },
            { id: 140, q: "보건소 실무 지침서에 명시된 바에 따라, [콜센터 결핵 발생 사례] 집단시설 역학조사 시 \'중점사례\'로 분류되어 시·도가 총괄하여 철저히 관리해야 하는 대상이 아닌 것은? 옳은 것은?", options: ["역학조사 중 추가 결핵환자가 발견된 사례", "지표환자가 다제내성결핵으로 확인된 사례", "신생아 또는 영·유아 결핵 노출 사례", "지표환자가 단순 흉부X선 유소견자인 사례"], a: 3, exp: "단순 흉부X선 유소견자(활동성 배제) 사례는 중점사례가 아니며, 신생아 노출이나 다제내성결핵 등이 중점사례에 해당합니다." },
            { id: 219, q: "국가결핵관리지침 제2절에 의하면, [어린이집 결핵 발생 사례] 전염성 결핵환자가 집단시설 종사자로 확인된 경우, 보건소가 환자 본인과 소속 기관장에게 조치해야 하는 사항은? 가장 올바른 것은?", options: ["해당 시설 폐쇄 및 전원 자가격리 명령서 발급", "환자에 대한 강제 입원 명령서 발급", "업무종사 및 등교 일시 제한 대상자 통보서 발급", "기관장에 대한 방역 소독 과태료 부과 처분"], a: 2, exp: "전염성 결핵환자의 소속 기관장과 환자 본인에게 \'업무종사 및 등교 일시 제한 통보서\'를 발급하여 접촉을 차단합니다." },
            { id: 398, q: "결핵역학조사 현장 대응 원칙상, [일반 사업장 결핵 발생 사례] 결핵 \'안심벨트 지원사업\'의 주된 목적과 지원 대상으로 가장 올바른 것은? 적절한 설명은?", options: ["다제내성결핵 환자의 해외 이송 비용 지원", "사회·경제적 취약계층 결핵환자의 간병비, 이송비 등 지원", "보건소 의료진의 방역복 및 장비 구매 지원", "모든 국민의 결핵 검진 비용 전액 지원"], a: 1, exp: "결핵 안심벨트 지원사업은 결핵환자 중 취약계층을 대상으로 입원비, 간병비, 영양 간식 등을 지원하는 사업입니다." },

            { id: 83, q: "감염병 대응 매뉴얼을 적용할 때, [노인요양원 결핵 발생 사례] 결핵환자 신고 후, 관할 보건소는 가족접촉자가 언제까지 검진을 받도록 안내해야 하는가에 대하여 맞는 설명은?", options: ["신고일 기준 1개월 이내", "신고일 기준 3개월 이내", "신고일 기준 1주일 이내", "신고일 기준 2주 이내"], a: 0, exp: "환자 신고일 기준으로 1개월 내에 가족접촉자 검진의료기관이나 보건소를 방문하여 검사를 받도록 안내해야 합니다." },
            { id: 296, q: "보건소 실무 지침서에 명시된 바에 따라, [의료기관 결핵 발생 사례] 5세 미만 결핵환자의 감염원 조사 시, M. bovis BCG 감염과 일반 결핵을 감별하기 위해 의뢰하는 검사는? 가장 올바른 것은?", options: ["결핵균 항산균 도말검사", "혈청학적 면역검사", "결핵균 유전형 검사", "HIV 항체 혈액 검사"], a: 2, exp: "BCG 예방접종 이상반응(M. bovis BCG 감염) 여부를 확인하기 위해 질병관리청에 유전형 검사를 의뢰합니다." },
            { id: 357, q: "최신 지침을 기준으로 볼 때, [이○연 환자 관련] 결핵환자가 진료비 본인부담을 면제받는 \'산정특례\'를 확진일로부터 소급하여 적용받으려면 확진일 기준 며칠 이내에 신청해야 하는가에 대하여 옳은 것은?", options: ["7일 이내", "60일 이내", "30일 이내", "14일 이내"], a: 2, exp: "확진일로부터 30일 이내에 국민건강보험공단에 신청해야 확진일(공휴일 포함)부터 소급하여 혜택을 적용받을 수 있습니다." },
            { id: 345, q: "결핵역학조사 현장 대응 원칙상, [종합병원 결핵 발생 사례] 지표환자가 \'이소니아지드(INH) 단독 내성\' 결핵으로 판명되었다. 이 환자의 접촉자에게 권장되는 잠복결핵감염 치료 요법은? 옳은 것은?", options: ["이소니아지드 9개월 요법 (9H)", "레보플록사신 6개월 요법 (6Lfx)", "이소니아지드/리팜핀 3개월 요법 (3HR)", "리팜핀 4개월 요법 (4R)"], a: 3, exp: "지표환자가 INH 단독 내성이면 INH를 제외한 리팜핀 4개월(4R) 요법을 권장합니다." },
            { id: 107, q: "감염병 대응 매뉴얼을 적용할 때, [어린이집 결핵 발생 사례] 잠복결핵감염 치료 중 부작용 모니터링을 위해 기본적으로 권장되는 간기능 검사(AST/ALT 등)의 주기는? 옳은 것은?", options: ["치료 종료 시점에 1회 최종 확인", "치료 시작 후 2주, 4주 및 이후 매달", "치료 시작 후 1주, 2주 차만 실시", "치료 시작 3개월 후 1회 실시"], a: 1, exp: "치료 시작 후 2주, 4주차에 시행하고, 이후 치료 종료 시까지 정기적으로 매달 검사합니다." },
            { id: 471, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 결핵환자 신고 접수 후, 관할 보건소가 실시하는 \'1차 사례조사\'의 완료 기한은? 알맞은 것은?", options: ["신고일 기준 14일 이내", "신고일 기준 7일 이내", "신고일 기준 3일 이내 (토·공휴일 제외)", "신고일 당일 자정까지"], a: 2, exp: "사례조사의 1차 조사는 신고일 기준 3일 이내(토요일 및 법정공휴일 제외)에 완료해야 합니다." },
            { id: 495, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 보건소가 집단시설 현장조사를 완료한 후, 현장조사서를 질병보건통합관리시스템에 등록해야 하는 기한은? 알맞은 것은?", options: ["현장조사일로부터 7일 이내", "현장조사일로부터 3일 이내 (근무일 기준)", "현장조사일로부터 14일 이내", "24시간 이내"], a: 1, exp: "현장조사일로부터 근무일 기준 3일 이내에 시스템에 현장조사서를 등록해야 합니다." },

            { id: 3, q: "국가결핵관리지침 제2절에 의하면, [한○윤 환자 관련] 결핵환자 신고 후, 관할 보건소는 가족접촉자가 언제까지 검진을 받도록 안내해야 하는가에 대하여 적절한 설명은?", options: ["신고일 기준 1개월 이내", "신고일 기준 2주 이내", "신고일 기준 3개월 이내", "신고일 기준 1주일 이내"], a: 0, exp: "환자 신고일 기준으로 1개월 내에 가족접촉자 검진의료기관이나 보건소를 방문하여 검사를 받도록 안내해야 합니다." },
            { id: 153, q: "감염병 대응 매뉴얼을 적용할 때, [오○훈 환자 관련] 맞춤형 사례관리를 위해 보건소 전담요원이 \'사례상담\'을 필수로 진행해야 하는 취약성평가 위험도 기준은? 맞는 설명은?", options: ["고위험군 환자만 전담", "중위험군 이상 (중위험군 및 고위험군)", "저위험군을 포함한 모든 결핵 환자", "전염성 결핵 환자 전원"], a: 1, exp: "취약성평가 결과 \'중위험군\' 이상의 위험도를 가진 환자를 대상으로 심층적인 사례상담을 필수 진행합니다." },
            { id: 163, q: "국가결핵관리지침 제2절에 의하면, [역학조사관 현장 점검 사례] 결핵환자 신고 후, 관할 보건소는 가족접촉자가 언제까지 검진을 받도록 안내해야 하는가에 대하여 맞는 설명은?", options: ["신고일 기준 1개월 이내", "신고일 기준 2주 이내", "신고일 기준 3개월 이내", "신고일 기준 1주일 이내"], a: 0, exp: "환자 신고일 기준으로 1개월 내에 가족접촉자 검진의료기관이나 보건소를 방문하여 검사를 받도록 안내해야 합니다." },
            { id: 492, q: "결핵역학조사 현장 대응 원칙상, [종합병원 결핵 발생 사례] 집단시설 내 결핵환자 발생 시, 호흡기검체 검사 결과가 음성일지라도 역학조사를 실시해야 하는 경우는? 옳은 것은?", options: ["과거 결핵 약제를 복용한 이력이 있을 때", "흉부X선 상 공동(cavity)이 확인된 경우", "기침, 가래 증상이 1개월 이상 지속될 때", "환자가 만 65세 이상의 고령일 때"], a: 1, exp: "검체가 음성이더라도 흉부X선 상 \'공동\'이 있다면 전염성이 있을 가능성이 커서 조사를 실시합니다." },
            { id: 149, q: "결핵역학조사 현장 대응 원칙상, [의료기관 결핵 발생 사례] 잠복결핵감염 치료 중단 시 시스템에 등록해야 하는 중단 사유로 올바른 것은? 맞는 설명은?", options: ["환자의 단순 변심으로 인한 하루 복약 누락", "보건소 담당자의 휴가로 인한 확인 지연", "타 지역으로의 1박 2일 여행", "약제 부작용에 의한 의료진의 중단 지시"], a: 3, exp: "약제 부작용으로 인해 의사가 치료를 중단한 경우 명확한 중단 사유로 시스템에 등록합니다." },
            { id: 286, q: "보건소 실무 지침서에 명시된 바에 따라, [역학조사관 현장 점검 사례] 가족접촉자의 초회 잠복결핵감염검사(TST 또는 IGRA)가 음성으로 나왔을 때, 2차 검사(연속검사)는 언제 시행하는가에 대하여 알맞은 것은?", options: ["마지막 접촉일 기준 6개월 후", "마지막 접촉일 기준 2~4주 후", "마지막 접촉일 또는 전염성 소실일 기준 8~10주 후", "마지막 접촉일 기준 4~6주 후"], a: 2, exp: "초회 검사 음성 시 창문기(Window period)를 고려하여 8~10주 이후에 2차 검사를 실시합니다." },
            { id: 350, q: "감염병 대응 매뉴얼을 적용할 때, [어린이집 결핵 발생 사례] 잠복결핵감염 치료 대상자가 치료 중 타 지역으로 전출(이사)을 간 경우 올바른 행정 조치는? 맞는 설명은?", options: ["신규 거주지 관할 보건소로 환자 관리 기관을 이관 처리한다.", "산정특례를 취소하고 일반 건강보험으로 전환한다.", "기존 보건소에서 치료가 끝날 때까지 원격 관리한다.", "이사한 즉시 치료를 중단하고 새로 진단받도록 한다."], a: 0, exp: "전출 시 신규 거주지 관할 보건소로 관리 기관을 변경(이관)하여 치료가 중단되지 않도록 연계해야 합니다." },
            { id: 48, q: "감염병 대응 매뉴얼을 적용할 때, [역학조사관 현장 점검 사례] 다제내성결핵 환자의 접촉자 중 잠복결핵감염 미치료자에 대한 추적검사(흉부X선) 횟수는? 맞는 설명은?", options: ["2년간 총 6회 (3, 6, 9, 12, 18, 24개월)", "5년간 총 5회 (매년 1회)", "1년간 총 4회 (3, 6, 9, 12개월)", "3년간 총 3회 (매년 1회)"], a: 0, exp: "다제내성결핵 접촉자 중 잠복결핵 미치료자는 2년에 걸쳐 총 6회 추적 관찰을 시행합니다." },
            { id: 295, q: "보건소 실무 지침서에 명시된 바에 따라, [의료기관 결핵 발생 사례] 보건소가 집단시설 현장조사를 완료한 후, 현장조사서를 질병보건통합관리시스템에 등록해야 하는 기한은? 옳은 것은?", options: ["24시간 이내", "현장조사일로부터 3일 이내 (근무일 기준)", "현장조사일로부터 7일 이내", "현장조사일로부터 14일 이내"], a: 1, exp: "현장조사일로부터 근무일 기준 3일 이내에 시스템에 현장조사서를 등록해야 합니다." },
            { id: 247, q: "보건소 실무 지침서에 명시된 바에 따라, [이○희 환자 관련] 잠복결핵감염으로 진단되었으나 치료를 받지 않는 일반 가족접촉자의 흉부X선 추적검사 주기는? 옳은 것은?", options: ["진단일로부터 2년간 6개월 간격", "진단일로부터 3년간 1년 간격", "진단일로부터 1년간 3개월 간격", "진단일로부터 6개월간 매달"], a: 2, exp: "일반 잠복결핵감염 미치료자는 진단일로부터 1년간 3개월 간격으로 추적 흉부X선 검사를 실시합니다." },
            { id: 284, q: "최신 지침을 기준으로 볼 때, [역학조사관 현장 점검 사례] 가족접촉자 전원을 대상으로 활동성 결핵을 먼저 배제하기 위해 기본적으로 가장 먼저 실시하는 검사는? 옳은 것은?", options: ["투베르쿨린 피부반응검사(TST)", "객담 배양검사", "인터페론감마 분비검사(IGRA)", "흉부X선 검사"], a: 3, exp: "잠복결핵감염 검사 등에 앞서 활동성 결핵을 배제하기 위해 전체 가족접촉자에게 흉부X선 검사를 우선 시행합니다." },
            { id: 418, q: "보건소 실무 지침서에 명시된 바에 따라, [최○수 환자 관련] 집단시설 결핵역학조사 시 지표환자의 \'전염성 추정 기간\'을 설정할 때 고려하는 요소가 아닌 것은? 적절한 설명은?", options: ["객담 도말 및 배양검사 결과", "흉부X선 상 공동(cavity) 유무", "환자의 거주지 면적", "환자의 결핵 관련 임상 증상 유무 및 발생 시기"], a: 2, exp: "전염성 추정 기간은 증상 발생일, 도말검사 양성 유무, 흉부X선 공동 유무 등을 종합하여 결정하며 거주지 면적은 무관합니다." },
            { id: 45, q: "최신 지침을 기준으로 볼 때, [최○수 환자 관련] 지표환자가 다제내성결핵인 경우, 기침 증상이 있는 접촉자의 객담 검사 시 반드시 포함해야 하는 검사는? 알맞은 것은?", options: ["결핵균 핵산증폭검사(Xpert MTB/RIF 또는 BD max)", "단순 항산균 도말검사", "결핵균 통상감수성검사", "결핵균 피부반응검사(TST)"], a: 0, exp: "다제내성결핵 환자 접촉자의 객담 검사 시에는 Xpert MTB/RIF 또는 BD max 등 신속 내성 검사를 반드시 시행합니다." },
            { id: 362, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 만 8세 이하 소아 폐외결핵 환자 발생 시, 가족접촉자 조사를 시행하는 주된 이유는 옳은 것은?", options: ["예방접종(BCG) 이상반응 여부를 확인하기 위해", "가족 중 숨은 감염원(결핵환자)을 파악하기 위해", "소아의 결핵 발병으로 인한 성장 지연을 막기 위해", "유치원 등 집단시설로의 확산을 선제적으로 차단하기 위해"], a: 1, exp: "만 8세 이하 소아 폐외결핵은 초회 감염일 가능성이 높아 가족 내 감염원을 찾기 위해 역학조사를 실시합니다." },
            { id: 15, q: "최신 지침을 기준으로 볼 때, [김○현 환자 관련] 보건소가 집단시설 현장조사를 완료한 후, 현장조사서를 질병보건통합관리시스템에 등록해야 하는 기한은? 가장 올바른 것은?", options: ["24시간 이내", "현장조사일로부터 3일 이내 (근무일 기준)", "현장조사일로부터 7일 이내", "현장조사일로부터 14일 이내"], a: 1, exp: "현장조사일로부터 근무일 기준 3일 이내에 시스템에 현장조사서를 등록해야 합니다." },
            { id: 96, q: "최신 지침을 기준으로 볼 때, [군부대 결핵 발생 사례] 5세 미만 결핵환자의 감염원 조사 시, M. bovis BCG 감염과 일반 결핵을 감별하기 위해 의뢰하는 검사는? 옳은 것은?", options: ["HIV 항체 혈액 검사", "결핵균 항산균 도말검사", "결핵균 유전형 검사", "혈청학적 면역검사"], a: 2, exp: "BCG 예방접종 이상반응(M. bovis BCG 감염) 여부를 확인하기 위해 질병관리청에 유전형 검사를 의뢰합니다." },
            { id: 26, q: "최신 지침을 기준으로 볼 때, [노인요양원 결핵 발생 사례] 지표환자가 다제내성결핵(MDR-TB)인 경우, 밀접접촉자의 잠복결핵감염 치료를 위해 전문가 상의 후 고려할 수 있는 요법은? 옳은 것은?", options: ["레보플록사신 6개월 요법 (6Lfx)", "이소니아지드 9개월 요법 (9H)", "피라진아미드 단독 2개월 요법", "리팜핀 4개월 요법 (4R)"], a: 0, exp: "다제내성 결핵 접촉자의 경우 득실을 고려하여 레보플록사신 6개월(6Lfx) 요법을 권고할 수 있습니다." },
            { id: 210, q: "결핵역학조사 현장 대응 원칙상, [역학조사관 현장 점검 사례] 임산부인 가족접촉자가 방사선 노출 우려로 흉부X선 검사를 거부할 경우 적절한 조치는? 맞는 설명은?", options: ["출산 후 6개월까지 모든 검사를 보류한다.", "객담 도말검사만 3회 실시하고 조사를 종료한다.", "납치마를 착용하고 검사를 받도록 권고한다.", "흉부X선 대신 즉시 잠복결핵감염 치료 약제를 투여한다."], a: 2, exp: "임산부라도 납치마(차폐복)를 착용하면 태아에게 미치는 방사선 영향이 거의 없으므로 활동성 결핵 배제를 위해 검사를 권고합니다." },
            { id: 499, q: "감염병 대응 매뉴얼을 적용할 때, [대형 학원 결핵 발생 사례] 전염성 결핵환자가 집단시설 종사자로 확인된 경우, 보건소가 환자 본인과 소속 기관장에게 조치해야 하는 사항은? 맞는 설명은?", options: ["환자에 대한 강제 입원 명령서 발급", "업무종사 및 등교 일시 제한 대상자 통보서 발급", "해당 시설 폐쇄 및 전원 자가격리 명령서 발급", "기관장에 대한 방역 소독 과태료 부과 처분"], a: 1, exp: "전염성 결핵환자의 소속 기관장과 환자 본인에게 \'업무종사 및 등교 일시 제한 통보서\'를 발급하여 접촉을 차단합니다." }
        ];

        let availableQuestions = [];
        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;
        let isAnswered = false;
        let wrongQuestions = []; 

        const QUESTIONS_PER_QUIZ = 10;
        const STORAGE_KEY = 'tb_quiz_final_500_v5';

        const startBtn = document.getElementById('start-btn');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resetHistoryBtn = document.getElementById('reset-history-btn');

        function initQuiz() {
            wrongQuestions = [];
            let askedIds = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            availableQuestions = questionBank.filter(q => !askedIds.includes(q.id));
            
            if (availableQuestions.length < QUESTIONS_PER_QUIZ) {
                askedIds = [];
                availableQuestions = [...questionBank];
                alert("축하합니다! 500개의 모든 문제를 푸셨습니다! 출제 기록이 초기화됩니다.");
            }
            
            // Fisher-Yates shuffle
            for (let i = availableQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableQuestions[i], availableQuestions[j]] = [availableQuestions[j], availableQuestions[i]];
            }
            currentQuiz = availableQuestions.slice(0, QUESTIONS_PER_QUIZ);
            
            askedIds = [...askedIds, ...currentQuiz.map(q => q.id)];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(askedIds));

            currentQuestionIndex = 0;
            score = 0;
        }

        function displayQuestion() {
            isAnswered = false;
            selectedOptionIndex = null;
            submitBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('question-counter').innerText = `문제 ${currentQuestionIndex + 1} / ${QUESTIONS_PER_QUIZ}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex) / QUESTIONS_PER_QUIZ) * 100}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:bg-gray-50 focus:outline-none text-gray-700 font-medium transition-colors';
                btn.innerText = optText;
                btn.onclick = () => {
                    if (isAnswered) return;
                    selectedOptionIndex = index;
                    Array.from(optionsContainer.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer() {
            if (selectedOptionIndex === null) {
                alert("정답을 선택해주세요.");
                return;
            }
            
            isAnswered = true;
            submitBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            
            const q = currentQuiz[currentQuestionIndex];
            const buttons = document.getElementById('options-container').children;
            
            let isCorrect = false;

            for (let i = 0; i < buttons.length; i++) {
                if (i === q.a) {
                    buttons[i].classList.add('correct');
                    if (i === selectedOptionIndex) {
                        isCorrect = true;
                        score += 10;
                    }
                } else if (i === selectedOptionIndex) {
                    buttons[i].classList.add('incorrect');
                }
            }

            if (!isCorrect) {
                wrongQuestions.push({
                    question: q.q,
                    myAnswer: q.options[selectedOptionIndex],
                    correctAnswer: q.options[q.a],
                    explanation: q.exp
                });
            }

            document.getElementById('explanation-text').innerText = q.exp;
            document.getElementById('explanation-container').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / QUESTIONS_PER_QUIZ) * 100}%`;
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').innerText = score;

            const wrongListContainer = document.getElementById('wrong-list');
            wrongListContainer.innerHTML = '';
            
            if (wrongQuestions.length === 0) {
                wrongListContainer.innerHTML = '<li class="text-green-700 font-bold text-center py-6 bg-green-50 rounded-xl border border-green-200">🎉 완벽합니다! 모든 문제를 맞히셨습니다.</li>';
            } else {
                wrongQuestions.forEach((item, idx) => {
                    const li = document.createElement('li');
                    li.className = "bg-red-50 p-5 rounded-xl border border-red-200 shadow-sm";
                    li.innerHTML = `
                        <p class="font-bold text-gray-900 mb-3 text-lg">Q${idx+1}. ${item.question}</p>
                        <div class="space-y-2 mb-3">
                            <p class="text-sm text-red-600 flex items-start"><span class="font-bold w-20 shrink-0">선택한 답:</span> <span>${item.myAnswer}</span></p>
                            <p class="text-sm text-blue-700 flex items-start"><span class="font-bold w-20 shrink-0">올바른 답:</span> <span>${item.correctAnswer}</span></p>
                        </div>
                        <div class="text-sm text-gray-700 bg-white p-3 rounded-lg border border-red-100 flex items-start">
                            <span class="font-bold text-yellow-600 w-12 shrink-0">해설:</span> 
                            <span>${item.explanation}</span>
                        </div>
                    `;
                    wrongListContainer.appendChild(li);
                });
            }
        }

        startBtn.addEventListener('click', () => {
            initQuiz();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            displayQuestion();
        });

        submitBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < QUESTIONS_PER_QUIZ) {
                displayQuestion();
            } else {
                showResults();
            }
        });

        restartBtn.addEventListener('click', () => {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        });

        resetHistoryBtn.addEventListener('click', () => {
            if(confirm("모든 문제 출제 기록을 초기화하시겠습니까? (처음부터 500문제가 새롭게 출제됩니다)")) {
                localStorage.removeItem(STORAGE_KEY);
                alert("초기화 완료되었습니다.");
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            }
        });
    </script>
